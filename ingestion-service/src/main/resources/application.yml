spring:
  application:
    name: ingestion-service

  servlet:
    multipart:
      max-request-size: ${MAX_REQUEST_SIZE:1MB}
      max-file-size: ${MAX_FILE_SIZE:1MB}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 1s
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_ingestion

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaProducerInterceptor
    # No consumer: ingestion-service only produces (alerts.raw, alerts.resolved,
    # alerts.dead-letter) and has no @KafkaListener. The consumer/listener
    # block that used to be here configured nothing (removed with backlog #0-16).

  security:
    user:
      name: ${SECURITY_USER:disabled}
      password: ${SECURITY_PASSWORD:disabled}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  # Access token TTL — how long a user JWT is valid after login.
  # Short TTL (PT15M) limits exposure of stolen tokens; session continuity
  # is handled by the refresh token flow (POST /api/v1/auth/refresh).
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  # Service token TTL — for inter-service calls via ServiceTokenProvider.
  # Longer than access-token-ttl; rotated automatically before expiry.
  service-token-ttl: ${JWT_SERVICE_TOKEN_TTL:PT1H}
  # Refresh token TTL — how long a refresh token is valid.
  # Refresh tokens are rotated on every use — stolen tokens are
  # detected when the legitimate user next calls /auth/refresh.
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

kafka:
  topics:
    alerts-raw: alerts.raw
    alerts-resolved: alerts.resolved
    alerts-dead-letter: alerts.dead-letter
    incidents-lifecycle: incidents.lifecycle
  dead-letter:
    # How long DLT messages are retained before Kafka deletes them.
    # Gives operators time to inspect, replay or discard poison pills.
    # Override per environment: dev=1, staging=7, prod=30.
    retention-days: ${DEAD_LETTER_RETENTION_DAYS:30}
  # Fixed (backlog #66): KafkaConfig's own Javadoc already documented
  # this section as the way to configure partitions/replicas for
  # production — this was the missing other half of that promise; the
  # values below were previously only ever set via @Value's own inline
  # defaults, with no YAML entry point an operator could actually find.
  # Defaults match those exact previous hardcoded values exactly — zero
  # behavior change unless explicitly overridden. A production cluster
  # with more than one broker available should raise `replicas` (e.g.
  # to 3) for broker-failure resilience — the default of 1 here is only
  # correct for local/CI docker-compose, which runs a single broker.
  topic-config:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
    dead-letter-partitions: ${KAFKA_DEAD_LETTER_TOPIC_PARTITIONS:1}

ingestion:
  max-payload-bytes: ${INGESTION_MAX_PAYLOAD_BYTES:1048576}
  # Empty by default — see IngestionProperties.trustedProxies's Javadoc for
  # why (fail-closed: X-Forwarded-For/X-Real-IP are never trusted unless
  # explicitly configured). Override via the INGESTION_TRUSTED_PROXIES
  # environment variable (comma-separated, e.g. "10.0.0.5,172.20.0.0/16") —
  # Spring Boot's relaxed binding picks this up automatically without
  # needing a placeholder here; deliberately not using
  # ${INGESTION_TRUSTED_PROXIES:} for this because Spring Boot's binding of
  # an empty-string environment variable to a List<String> property has
  # inconsistent, version-dependent behavior (a documented, open Spring
  # Boot issue) — a plain empty-list literal avoids that risk entirely.
  trusted-proxies: []
  prometheus:
    max-batch-size: ${PROMETHEUS_MAX_BATCH_SIZE:500}
  client:
    # Timeouts of calls to other services — today only API key introspection
    # into auth-service (backlog #0-16). Short: the call sits on an alert's
    # request path, and a timeout answers 503 so the sender retries.
    connect-timeout-seconds: ${INGESTION_CLIENT_CONNECT_TIMEOUT:2}
    read-timeout-seconds: ${INGESTION_CLIENT_READ_TIMEOUT:3}

# auth-service answers which tenant an Integration API key belongs to
# (POST /api/v1/internal/api-keys/introspect, backlog #0-16, the #0-30 pattern).
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8087}

deduplication:
  ttl: ${DEDUPLICATION_TTL:PT5M}

server:
  port: ${SERVER_PORT:8081}
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-request-header-size: 8KB
    max-swallow-size: ${MAX_SWALLOW_SIZE:1MB}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_PORT:8091}

logging:
  level:
    root: INFO
    com.incidentplatform: DEBUG
    org.springframework.security: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{tenantId:-no-tenant}] [%X{requestId:-no-req}] [%X{userId:-no-user}] %-5level %logger{36} - %msg%n"

resilience4j:
  circuit-breaker:
    instances:
      redis-dedup:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          - io.lettuce.core.RedisConnectionException
          - java.net.ConnectException
      # Fixed (backlog #67): RateLimitingService previously had no
      # circuit breaker at all — see its own Javadoc for the full
      # account of why that mattered (every call independently waiting
      # out a Redis timeout during degradation, rather than the circuit
      # opening after a threshold and failing open immediately for
      # subsequent calls).
      #
      # Same thresholds as redis-dedup above — both protect the same
      # Redis instance in the same service, so there's no reason to
      # tune them differently without a specific need to.
      #
      # record-exceptions is deliberately NOT an identical copy of
      # redis-dedup's list: RateLimitingService goes through bucket4j's
      # own LettuceBasedProxyManager, a raw Lettuce connection that
      # bypasses Spring Data Redis entirely (see RedisRateLimitConfig's
      # own Javadoc for why) — so
      # org.springframework.data.redis.RedisConnectionFailureException,
      # a Spring Data Redis translation-layer exception, can never
      # actually be thrown on this path and is correctly omitted here.
      redis-ratelimit:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - io.lettuce.core.RedisConnectionException
          - java.net.ConnectException

      # ApiKeyIntrospectionClientImpl (backlog #0-16) — same shape as
      # notification-service's slack-workspace breaker (#0-30). {"active":false}
      # is a normal answer returned inside the proxied method, so a burst of
      # wrong keys never opens the circuit and locks out valid ones. Only an
      # unreachable auth-service, a 5xx or an unparseable body counts. A 4xx
      # (e.g. auth-service rejecting our purpose token) is not recorded as a
      # failure but still reaches the fallback: 503 to the sender, and
      # service_client_fallback_total{reason="auth"}.
      api-key-introspection:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.lang.IllegalStateException

  retry:
    instances:
      # One quick retry of the introspection call. @Retry wraps @CircuitBreaker
      # (Resilience4j's default aspect order), so it sees what the breaker's
      # fallback throws — ApiKeyIntrospectionUnavailableException — not the
      # original ResourceAccessException; that is the exception listed here
      # (unlike notification-service's oncall retry, backlog #0-23).
      # ApiKeyIntrospectionClientResilienceTest checks it with the real proxies.
      api-key-introspection:
        max-attempts: ${API_KEY_INTROSPECTION_RETRY_MAX_ATTEMPTS:2}
        wait-duration: ${API_KEY_INTROSPECTION_RETRY_WAIT_MS:100ms}
        retry-exceptions:
          - com.incidentplatform.ingestion.apikey.ApiKeyIntrospectionUnavailableException

# ================================================================
# Rate Limiting — multi-layer DDoS protection (Layer 3)
#
# Per tenant:   isolation between tenants
# Per IP:       protection against attacks from a single source
#
# TODO (Layer 1): Cloudflare — when project goes to public domain
# TODO (Layer 2): Nginx Ingress rate limiting — when Kubernetes
# TODO (Layer 4): Separate Kafka topics per severity — when Kubernetes
#   alerts.raw.critical, alerts.raw.high etc.
#   Priority benefit is minimal with single instance.
# TODO (Layer 5): Prometheus alert RateLimitExceeded — when monitoring
#
# Fixed (backlog #73): removed a "Per severity: CRITICAL > HIGH > MEDIUM
# > LOW" fixed-capacity bucket that used to be listed here as a peer of
# tenant/IP, alongside the RateLimitingProperties.severity config it
# read from (also removed — see that record's own Javadoc for the full
# account). Two independent problems: tryConsume() runs once per HTTP
# request, before the payload is normalized, and a single Prometheus
# webhook call can legitimately batch alerts of different severities —
# there was no single well-defined "severity of this request" to check.
# Separately, even where severity IS known up front, a fixed, always-
# enforced quota per severity isn't what production alerting systems
# mean by protecting critical alerts under load — that's priority-based
# load shedding, conditional on actual system stress, not a constant cap
# regardless of load. Genuine severity-aware protection belongs in
# Layer 4 above instead — differentiated downstream processing/
# prioritization, not an additional reject-gate at ingestion.
# ================================================================
rate-limiting:
  enabled: ${RATE_LIMITING_ENABLED:true}
  tenant:
    capacity: ${RATE_LIMIT_TENANT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_TENANT_REFILL:10}
    refill-period-seconds: ${RATE_LIMIT_TENANT_PERIOD:1}
  ip:
    capacity: ${RATE_LIMIT_IP_CAPACITY:50}
    refill-tokens: ${RATE_LIMIT_IP_REFILL:5}
    refill-period-seconds: ${RATE_LIMIT_IP_PERIOD:1}
  # Failed API key authentications per client IP, checked before a key is
  # sent to auth-service (AuthFailureRateLimiter, backlog #0-16). Only
  # failures consume; a key in the introspection cache is never throttled.
  auth-failure:
    capacity: ${RATE_LIMIT_AUTH_FAILURE_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_AUTH_FAILURE_REFILL:10}
    refill-period-seconds: ${RATE_LIMIT_AUTH_FAILURE_PERIOD:60}

security:
  cors:
    # Allowed origins for CORS. Comma-separated list.
    # Override per environment: dev=localhost, prod=https://app.incidentplatform.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}