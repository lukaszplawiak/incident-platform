spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:incidentdb}
    username: ${DB_USER:incident_app}
    password: ${DB_PASSWORD:incident_secret}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    table: flyway_schema_history_auth
    enabled: true
    locations: classpath:db/migration,classpath:com/incidentplatform/auth
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 1s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  # Access token TTL — how long a user JWT is valid after login.
  # Short TTL (PT15M) limits exposure of stolen tokens; session continuity
  # is handled by the refresh token flow (POST /api/v1/auth/refresh).
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  # Service token TTL — for inter-service calls via ServiceTokenProvider.
  # Longer than access-token-ttl; rotated automatically before expiry.
  service-token-ttl: ${JWT_SERVICE_TOKEN_TTL:PT1H}
  # Refresh token TTL — how long a refresh token is valid.
  # Refresh tokens are rotated on every use — stolen tokens are
  # detected when the legitimate user next calls /auth/refresh.
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

# Login brute-force protection.
# Counter key: auth:login:attempts:{tenant}:{email} — TTL = window
# Lockout key: auth:login:locked:{tenant}:{email}   — TTL = lockoutDuration
#
# Fail-open: if Redis is unavailable, login is allowed (Redis outage
# must not lock out all users). Prometheus counter fires on each lockout.
brute-force-protection:
  enabled: ${BRUTE_FORCE_PROTECTION_ENABLED:true}
  max-failures: ${BRUTE_FORCE_PROTECTION_MAX_FAILURES:5}
  lockout-duration: ${BRUTE_FORCE_PROTECTION_LOCKOUT_DURATION:PT15M}
  window: ${BRUTE_FORCE_PROTECTION_WINDOW:PT10M}

invite:
  email:
    from: ${INVITE_EMAIL_FROM:noreply@incidentplatform.com}
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    # Fixed (backlog #54): see InviteEmailProperties' own Javadoc for the
    # full reasoning behind this default value.
    batch-size: ${INVITE_EMAIL_BATCH_SIZE:15}
    scheduler-interval-ms: ${INVITE_EMAIL_SCHEDULER_INTERVAL_MS:30000}
    # Backlog #0-52: a failed email is retried after each of these delays in
    # turn (the last repeats) until the request's deadline (its token lifetime:
    # 7 days for an invite, 15 minutes for a reset) - see AuthEmailRetryPolicy.
    # Replaces max-retry-attempts (3) / retry-interval-ms (5 min), which gave
    # up after about 15 minutes of SMTP trouble.
    retry-backoff: ${INVITE_EMAIL_RETRY_BACKOFF:PT1M,PT5M,PT30M,PT2H,PT6H}
    # How long one scheduler run keeps taking entries; must leave the 4-minute
    # ShedLock room for one more send (checked at startup).
    processing-budget: ${INVITE_EMAIL_PROCESSING_BUDGET:PT2M}
    # Terminal outbox entries are purged after this long.
    retention: ${INVITE_EMAIL_RETENTION:P30D}
    purge-interval-ms: ${INVITE_EMAIL_PURGE_INTERVAL_MS:86400000}

auth:
  token-cleanup:
    # Housekeeping only — expired/used auth_tokens rows are already
    # correctly excluded by every query that matters. This just controls
    # how long the now-useless rows stick around before being pruned.
    interval-ms: ${AUTH_TOKEN_CLEANUP_INTERVAL_MS:86400000}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    mail:
      enabled: false
    defaults:
      enabled: true
    status:
      order: DOWN,OUT_OF_SERVICE,UNKNOWN,UP
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: db,redis
        liveness:
          include: ping
  server:
    port: ${MANAGEMENT_PORT:8097}

server:
  port: ${SERVER_PORT:8087}

logging:
  level:
    com.incidentplatform.auth: INFO
    com.incidentplatform.shared: INFO

security:
  cors:
    # Allowed origins for CORS. Comma-separated list.
    # Override per environment: dev=localhost, prod=https://app.incidentplatform.com
    # This property has no inline default — it must be set here or via env var.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
mfa:
  # AES-256-GCM key for encrypting TOTP secrets at rest.
  # REQUIRED — service will refuse to start if not set.
  # Generate: openssl rand -base64 32
  # Set via MFA_ENCRYPTION_KEY environment variable.
  encryption-key: ${MFA_ENCRYPTION_KEY}

  totp:
    issuer: ${MFA_TOTP_ISSUER:IncidentPlatform}

slack:
  # AES-256-GCM key for encrypting each tenant's Slack bot token at rest
  # (backlog #0-21). Deliberately separate from mfa.encryption-key — see
  # AesEncryptionConfig for why. REQUIRED — service will refuse to start
  # if not set. Generate: openssl rand -base64 32
  # Set via SLACK_ENCRYPTION_KEY environment variable.
  encryption-key: ${SLACK_ENCRYPTION_KEY}
api-key:
  usage:
    # Backlog #0-16: last_used_at is written at most once per key per interval
    # (a conditional UPDATE, see ApiKeyUsageRecorder), so a busy integration
    # does not turn every introspection into a write.
    write-interval: ${API_KEY_USAGE_WRITE_INTERVAL:PT5M}

platform:
  operator:
    bootstrap:
      # Backlog #0-16: when set, auth-service invites this address as the first
      # admin of the reserved platform-operator tenant, which receives the
      # platform's own alerts as incidents. Empty = no bootstrap.
      admin-email: ${OPERATOR_ADMIN_EMAIL:}
      # Backlog #0-49: a reconciler (OperatorTenantBootstrap) checks shortly after
      # startup and then at this interval that the tenant has an admin who can
      # log in, and re-invites the configured admin when their invite
      # permanently failed or expired. Metric: platform.operator.admin.pending,
      # refreshed read-only on every replica (the reconcile runs on one).
      initial-delay-ms: ${OPERATOR_BOOTSTRAP_INITIAL_DELAY_MS:30000}
      reconcile-interval-ms: ${OPERATOR_BOOTSTRAP_RECONCILE_INTERVAL_MS:3600000}
      gauge-refresh-interval-ms: ${OPERATOR_BOOTSTRAP_GAUGE_REFRESH_INTERVAL_MS:300000}
