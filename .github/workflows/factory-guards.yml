# ============================================================
# Factory guards — what an unattended agent must not merge without the owner (backlog #0-113)
#
# A pull request that deletes or disables tests, removes assertions, adds a Maven plugin, repository or
# dependency, edits an applied Flyway migration, or marks a backlog item `**Autopilot:** ready` fails
# this check unless the PR's author is the repository owner or the owner approved the PR's head commit. The autopilot's machine account can do neither, so its PRs with such a
# change wait for the owner; the owner's own PRs pass. Only an approval of the PR's current commit by the
# owner (or an organisation member) counts. Detection: .github/scripts/check-factory-guards.sh.
# Also runs the tests of the autopilot's hooks, of this check and of the queue and state scripts, validates the
# execution queue (.ai/plan/queue.md) against the backlog, and checks that the deny rules, the shell-write
# hook and CODEOWNERS still cover .ai/rules/protected-paths.md.
#
# Required check: "Factory guards" (repository settings, backlog #0-113), once this has run green on main.
# ============================================================

name: Factory guards

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  pull_request_review:
    types: [ submitted, dismissed ]
  push:
    branches: [ main ]

# GITHUB_TOKEN scope (backlog #0-59): read-only. The approval lookup needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  factory-guards:
    name: Factory guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hook tests
        run: .claude/hooks/test-hooks.sh

      - name: Guard check tests
        run: .github/scripts/test-factory-guards.sh

      - name: Queue script tests
        run: .github/scripts/test-queue.sh

      - name: Path gate tests
        run: .github/scripts/test-changed-paths.sh

      - name: State script tests
        run: .github/scripts/test-factory-state.sh

      - name: Protected path check tests
        run: .github/scripts/test-protected-paths.sh

      - name: Audit data tests
        run: .github/scripts/test-audit-data.sh

      # .ai/rules/protected-paths.md is the one list; the autopilot's deny rules, its shell-write hook and
      # CODEOWNERS keep literal copies on purpose, and this fails when one stops covering an entry
      # (backlog #0-122).
      - name: Protected paths are covered
        run: .github/scripts/check-protected-paths.sh

      # The approved order of work (.ai/plan/queue.md) must stay consistent with the backlog: a PR that
      # removes or changes an item the queue relies on fails here, not in the next autopilot run.
      - name: Execution queue is consistent
        run: scripts/factory/check-queue.sh

      - name: Changes that need the owner
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if .github/scripts/check-factory-guards.sh "$BASE_SHA" "$HEAD_SHA"; then
            exit 0
          fi
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ]; then
            echo "::notice::the PR author is the repository owner: allowed"
            exit 0
          fi
          # Only an approval of this exact commit, by the owner or an organisation member, counts: on a
          # public repository anyone can approve, and an approval of an earlier commit says nothing about
          # what was pushed after it. The machine account is a collaborator, never OWNER or MEMBER.
          approvals=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .user.login != \"${PR_AUTHOR}\" and .commit_id == \"${HEAD_SHA}\" and (.author_association == \"OWNER\" or .author_association == \"MEMBER\"))] | length")
          if [ "${approvals:-0}" -gt 0 ]; then
            echo "::notice::the owner approved this commit: allowed"
            exit 0
          fi
          echo "::error::these changes need the owner's approval (review the PR, then this check re-runs)"
          exit 1
