# ============================================================
# Factory guards — what an unattended agent must not merge without the owner (backlog #0-113)
#
# A pull request that deletes or disables tests, removes assertions, adds a Maven plugin, repository or
# dependency, edits an applied Flyway migration, or marks a backlog item `**Autopilot:** ready` fails
# this check unless the PR's author is the repository owner or the owner approved the PR's head commit. The autopilot's machine account can do neither, so its PRs with such a
# change wait for the owner; the owner's own PRs pass. Only an approval of the PR's current commit by the
# owner (or an organisation member) counts. Detection: .github/scripts/check-factory-guards.sh.
# Also runs the tests of the autopilot's hooks, of this check and of the queue, state, preflight and test gate scripts, validates the
# execution queue (.ai/plan/queue.md) against the backlog, checks that the deny rules, the shell-write
# hook and CODEOWNERS still cover .ai/rules/protected-paths.md, that every escape marker in the backlog is one
# the audits can read (backlog #0-128), that only the verifier agent can fetch from the web (backlog #0-160), and
# that every hook entry blocks the call when its hook fails (backlog #0-162); and the tests of ci-local.sh's step
# runner, the owner's local run of this job and of lint-workflows (backlog #0-166).
#
# A required check of main (its ruleset, .github/repository-settings/rulesets/main.json, backlog #0-113,
# ADR-0034). On its own it binds nobody who can change check-factory-guards.sh, since a pull request runs its
# own copy: the ruleset's code owner review of .github/ is what makes such a change wait for the owner.
# ============================================================

name: Factory guards

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  pull_request_review:
    types: [ submitted, dismissed ]
  push:
    branches: [ main ]

# GITHUB_TOKEN scope (backlog #0-59): read-only. The approval lookup needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  factory-guards:
    name: Factory guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Backlog #0-166 (ADR-0040): Ruby from .ruby-version for the .rb checks of this job, before any of them
      # (check-ruby-setup.rb); the runner's own Ruby and gems once changed a check's result (PR #517).
      - name: Set up Ruby
        uses: ./.github/actions/setup-ruby

      - name: Hook tests
        run: .claude/hooks/test-hooks.sh

      - name: Guard check tests
        run: .github/scripts/test-factory-guards.sh

      - name: Queue script tests
        run: .github/scripts/test-queue.sh

      - name: Path gate tests
        run: .github/scripts/test-changed-paths.sh

      - name: State script tests
        run: .github/scripts/test-factory-state.sh

      - name: Preflight tests
        run: .github/scripts/test-preflight.sh

      - name: Test gate tests
        run: .github/scripts/test-run-tests.sh

      - name: Protected path check tests
        run: .github/scripts/test-protected-paths.sh

      - name: Audit data tests
        run: .github/scripts/test-audit-data.sh

      - name: Escape marker check tests
        run: .github/scripts/test-escape-markers.sh

      - name: Web access check tests
        run: .github/scripts/test-web-access.sh

      - name: Hook entry check tests
        run: .github/scripts/test-hook-entries.sh

      # The step runner of .github/scripts/ci-local.sh, the owner's local run of this job and of lint-workflows
      # (backlog #0-166): it must run these steps as the runner does, or a local green means nothing.
      - name: Local CI runner tests
        run: .github/scripts/test-ci-local.sh

      # .ai/rules/protected-paths.md is the one list; the autopilot's deny rules, its shell-write hook and
      # CODEOWNERS keep literal copies on purpose, and this fails when one stops covering an entry
      # (backlog #0-122).
      - name: Protected paths are covered
        run: .github/scripts/check-protected-paths.sh

      # Only the verifier agent reaches the web, through webfetch-allowlist.sh: every agent declares its tools,
      # the settings run the hook and allow only its hosts, and the firewall opens them (backlog #0-160, ADR-0037).
      - name: Only the verifier fetches
        run: .github/scripts/check-web-access.sh

      # A hook that cannot start or times out lets the call through unless its entry says `onFailure: "block"`:
      # every entry of both settings files and of the agents' frontmatter must, and must run a hook of the
      # fail-closed table of test-hooks.sh (backlog #0-162, ADR-0039).
      - name: Hook entries block when their hook fails
        run: |
          set -euo pipefail
          ruby .github/scripts/check-hook-entries.rb

      # A line with `**Escaped from:** <stage>` but no `**Fixes:** #0-<digits>` would vanish from both audits
      # (backlog #0-128); the pattern is scripts/factory/_marker.sh, the one audit-data.sh reads.
      - name: Escape markers are well-formed
        run: .github/scripts/check-escape-markers.sh

      # The approved order of work (.ai/plan/queue.md) must stay consistent with the backlog: a PR that
      # removes or changes an item the queue relies on fails here, not in the next autopilot run.
      - name: Execution queue is consistent
        run: scripts/factory/check-queue.sh

      - name: Changes that need the owner
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if .github/scripts/check-factory-guards.sh "$BASE_SHA" "$HEAD_SHA"; then
            exit 0
          fi
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ]; then
            echo "::notice::the PR author is the repository owner: allowed"
            exit 0
          fi
          # Only an approval of this exact commit, by the owner or an organisation member, counts: on a
          # public repository anyone can approve, and an approval of an earlier commit says nothing about
          # what was pushed after it. The machine account is a collaborator, never OWNER or MEMBER.
          approvals=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq "[.[] | select(.state == \"APPROVED\" and .user.login != \"${PR_AUTHOR}\" and .commit_id == \"${HEAD_SHA}\" and (.author_association == \"OWNER\" or .author_association == \"MEMBER\"))] | length")
          if [ "${approvals:-0}" -gt 0 ]; then
            echo "::notice::the owner approved this commit: allowed"
            exit 0
          fi
          echo "::error::these changes need the owner's approval (review the PR, then this check re-runs)"
          exit 1
