# ============================================================
# Snyk Security Scan
#
# Scans dependencies for known CVEs AND analyses application
# code for security issues (SQL injection, XXE, path traversal,
# insecure deserialization, and others).
#
# Uses Snyk CLI directly (not snyk/actions/maven) to avoid
# JAVA_HOME issues with the Docker-based action in multi-module
# Maven projects.
#
# The CLI is the standalone binary at a pinned version, checked
# against a SHA-256 kept in this file before it runs (backlog #0-61,
# ADR-0033: install-pinned-tool.sh).
# It used to be `npm install -g snyk` (whatever npm served that
# minute, a Node wrapper whose unbundled `@sentry/node ^7` range was
# resolved at install time) followed by `snyk auth <token>`, which
# put the token in argv and in ~/.config/configstore/snyk.json for
# every later step. The token now reaches only the scan step, as
# the SNYK_TOKEN environment variable the CLI reads directly.
#
# Runs on:
#   - Push to main
#   - Every Monday at 09:00 Warsaw time (scheduled)
#   - Manual trigger (workflow_dispatch)
#
# Required GitHub secret:
#   SNYK_TOKEN — get free token at https://snyk.io
#   Account Settings -> Personal Access Tokens -> Generate
#   Add to: Settings -> Secrets and variables -> Actions -> SNYK_TOKEN
# ============================================================

name: Snyk Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - '**/pom.xml'
      - '**/src/**'
      - '.snyk'
      - '.github/workflows/snyk.yml'
  schedule:
    # Every Monday 09:00 Warsaw time (07:00 UTC) -- 1h after OWASP scan
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Read-only by default (backlog #0-59); every scope not listed is `none`.
# Each job that uploads SARIF widens its own token to security-events: write,
# so a job added later does not inherit the write scope. A job's block
# replaces this one, hence the repeated `contents: read`.
permissions:
  contents: read

# Snyk CLI, pinned for both jobs (backlog #0-61, ADR-0033): the snyk-linux
# asset of the snyk/cli GitHub release, the same file downloads.snyk.io
# serves. Renovate bumps the tag and the SHA-256 together; ci.yml's
# check-pinned-tools.sh then requires the SHA-256 in that release's
# sha256sums.txt.asc, signed by Snyk's code-signing key
# (.github/keys/<fingerprint>.asc). That replaces ADR-0021's hand check of two
# channels (downloads.snyk.io and npm): a signature by Snyk's key holds
# whichever host served the files. Each job below runs the same check on this
# file before it installs the CLI: Lint Workflows is a required check of
# main (backlog #0-113), but the owner can merge around it and this workflow
# can be dispatched by hand on any branch (#0-154), so a bump that reaches
# this run unchecked still never gets SNYK_TOKEN.
env:
  # renovate: datasource=github-release-attachments depName=snyk/cli verify=gpg:467717A30B2B4658415975629691DA64D0025194
  SNYK_CLI_VERSION: v1.1307.4
  SNYK_CLI_SHA256: b0baee4fa4d7d11b7df927a1046cf8137a8a89fafac8101a45c3c0e0777ddc35

# Every `uses:` names a full commit SHA, with its tag in a comment (backlog
# #0-60): a tag can be repointed by whoever controls the action's repository,
# a SHA cannot. Renovate (helpers:pinGitHubActionDigests) bumps both together.
# The repository setting "Require actions to be pinned to a full-length commit
# SHA" is on (since 2026-09-29): a workflow with a tag-pinned `uses:` fails to
# start. README "Infrastructure Hardening" records the setting.
jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Snyk dependency scan
  # Scans pom.xml dependencies against Snyk vulnerability database.
  # Uses --maven-aggregate-project (not --all-projects) to scan once
  # through the root pom.xml so .snyk suppressions are applied consistently.
  # ──────────────────────────────────────────────────────────
  snyk-dependencies:
    name: Snyk — Dependency Scan
    runs-on: ubuntu-latest
    # upload-sarif writes to the Security tab.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config for the rest of the job:
          # no step pushes, and any later step (a compromised action, a CLI
          # installed at run time) could read it from there (backlog #0-60).
          persist-credentials: false

      # The pin above against Snyk's signed checksums (backlog #0-147,
      # ADR-0033), before the build so a bad pin fails in seconds. --expect 1:
      # a pin renamed out of the *_SHA256 form would otherwise pass unseen.
      # The script uses the token only to read public releases (it also
      # carries this job's security-events: write); SNYK_TOKEN does not exist
      # yet.
      - name: The pinned Snyk CLI matches Snyk's signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-pinned-tools.sh --expect 1 .github/workflows/snyk.yml

      # Stops the job before the token exists in any process if the binary
      # is not the one pinned above (backlog #0-61, install-pinned-tool.sh).
      # Installed into RUNNER_TEMP and put on PATH for later steps: no sudo.
      # Before the build (backlog #0-147 review): the installer is a script
      # from the checkout, and the build runs Maven plugins and annotation
      # processors from the dependency tree, which could rewrite it. They
      # could still change files or $GITHUB_PATH for the scan step: same job,
      # same user. That exposure is older than this order (the scan needs the
      # build's output) and is not closed by it.
      - name: Install Snyk CLI (pinned, checksum verified)
        run: |
          set -euo pipefail
          .github/scripts/install-pinned-tool.sh --repo snyk/cli --tag "$SNYK_CLI_VERSION" \
            --asset snyk-linux --sha256 "$SNYK_CLI_SHA256" --name snyk --into "${RUNNER_TEMP}/snyk-cli"
          echo "${RUNNER_TEMP}/snyk-cli" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/snyk-cli/snyk" --version

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Backlog #0-145 (ADR-0031): the Maven distribution and the Maven
      # repository CI's build-and-test saved on main, through the one action
      # that writes their paths and keys (ci.yml calls it too). Never saved
      # here, so only what the entry lacks (this scan's own plugins) comes
      # from Maven Central. On a miss of the distribution, mvnw downloads the
      # zip and checks it against distributionSha256Sum, which build-and-test
      # checked against Apache.
      - name: Restore the Maven caches
        uses: ./.github/actions/restore-maven-caches

      - name: Build project
        run: ./mvnw clean compile -DskipTests --no-transfer-progress

      - name: Run Snyk dependency scan
        # The only step that sees the token (read by the CLI, no `snyk auth`).
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --maven-aggregate-project \
            --severity-threshold=high \
            --sarif-file-output=snyk-deps.sarif
        # --maven-aggregate-project: resolves multi-module project via root pom.xml
        # --all-projects is intentionally NOT used — it scans each module separately
        # causing .snyk suppressions to be applied inconsistently across scans

      - name: Upload dependency SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('snyk-deps.sarif') != ''
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dependencies

  # ──────────────────────────────────────────────────────────
  # Job 2: Snyk code scan (SAST)
  # Analyses Java source code for security vulnerabilities.
  # Findings go to GitHub Security tab, do not block the build.
  # ──────────────────────────────────────────────────────────
  snyk-code:
    name: Snyk — Code Scan (SAST)
    runs-on: ubuntu-latest
    # upload-sarif writes to the Security tab.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: The pinned Snyk CLI matches Snyk's signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-pinned-tools.sh --expect 1 .github/workflows/snyk.yml

      - name: Install Snyk CLI (pinned, checksum verified)
        run: |
          set -euo pipefail
          .github/scripts/install-pinned-tool.sh --repo snyk/cli --tag "$SNYK_CLI_VERSION" \
            --asset snyk-linux --sha256 "$SNYK_CLI_SHA256" --name snyk --into "${RUNNER_TEMP}/snyk-cli"
          echo "${RUNNER_TEMP}/snyk-cli" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/snyk-cli/snyk" --version

      - name: Run Snyk code scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test \
            --severity-threshold=high \
            --sarif-file-output=snyk-code.sarif
        # continue-on-error: true — SAST findings are reported as alerts
        # in the Security tab without blocking the build.
        # Security issues in application code require manual review.

      - name: Upload code SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('snyk-code.sarif') != ''
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code