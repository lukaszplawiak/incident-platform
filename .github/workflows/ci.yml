# ============================================================
# CI — Continuous Integration for Incident Platform
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GITHUB_TOKEN scope is declared here, not left to the repository setting
# (backlog #0-59): that setting lives in the UI, so switching it to "read and
# write" would hand a write token to every job that runs a PR's own code
# (tests, Docker builds, the smoke test) without any diff showing it.
# Declaring `permissions:` sets every scope not listed to `none`. A job that
# needs more declares its own block, which replaces this one (it does not add
# to it), so such a job repeats `contents: read`.
permissions:
  contents: read

# Every `uses:` names a full commit SHA, with its tag in a comment (backlog
# #0-60): a tag can be repointed by whoever controls the action's repository,
# a SHA cannot. Renovate (helpers:pinGitHubActionDigests) bumps both together.
# The repository setting "Require actions to be pinned to a full-length commit
# SHA" is on (since 2026-09-29): a workflow with a tag-pinned `uses:` fails to
# start. README "Infrastructure Hardening" records the setting.
jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Build, test and coverage
  #
  # Runs in full or not at all — every service depends on `shared`, so
  # there's no safe way to skip modules here. Not at all only on a pull
  # request that changes Markdown alone (`code` from detect-changes, see
  # the job's own comment); on every other PR and on every push to main
  # it builds and tests everything.
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    # Skipped on a pull request that changes Markdown only (the backlog, /ready, runbooks, .ai/), where a
    # full `mvn verify` of every module takes minutes and tests nothing that changed: nothing the build,
    # its tests or its check scripts read is Markdown. A non-Markdown file anywhere, in docs/ and .ai/
    # too, runs it (check-structured-logging.sh scans every tracked yml/json/sh, wherever it lives). Skipped at the job, not with `paths-ignore`
    # on the workflow: a skipped job counts as passed for a required check, while a workflow that does not
    # run leaves a required check waiting for ever (#0-113). Always run on a push to main (the safety net)
    # and whenever detect-changes did not succeed, so a failure there cannot skip the build silently.
    needs: detect-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.detect-changes.result != 'success' || needs.detect-changes.outputs.code == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave GITHUB_TOKEN in .git/config for the rest of the job:
          # no step pushes, and any later step (a compromised action, a CLI
          # installed at run time) could read it from there (backlog #0-60).
          persist-credentials: false
          # Full history on a PR: the patch coverage gate below diffs against
          # the base branch, which a shallow clone does not have. The values are
          # strings on purpose: in an expression the number 0 is falsy, so
          # `cond && 0 || 1` always yields 1; the string '0' is truthy.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # Backlog #0-81: no Spring profile configuration is committed under
      # src/main/resources, where it would ship in every jar and image (the
      # test profiles that sat there hard-coded a JWT secret and an MFA key).
      # The checker's own cases run first, so a broken checker cannot pass.
      - name: No profile configuration ships in a jar
        run: |
          .github/scripts/test-packaged-profiles.sh
          .github/scripts/check-packaged-profiles.sh

      # Backlog #0-82 step 2: a service without auth-service.base-url gets the
      # "every tenant has full access" status provider, silently. Every runnable
      # service but auth-service must set it from ${AUTH_SERVICE_URL}. The
      # checker's own cases run first, as above.
      - name: Every service enforces tenant status
        run: |
          .github/scripts/test-tenant-status-config.sh
          .github/scripts/check-tenant-status-config.sh

      # Backlog #0-94 step 1: every service logs JSON (ECS), its encoder escaping
      # every value; shared's StructuredLoggingGuard refuses to start one that
      # would not, unless platform.logging.plain-text is set, which only a
      # developer's gitignored application-local.yml may do. No tracked file may
      # name that switch, in any spelling, nor ship a Logback file of its own.
      # The checker's own cases run first, as above.
      - name: Every service logs JSON
        run: |
          .github/scripts/test-structured-logging.sh
          .github/scripts/check-structured-logging.sh

      # Backlog #0-94 step 2: `make dev-up` warns about a weak Grafana password
      # (Grafana reads every tenant's logs) by parsing docker/.env the way
      # compose does. Only warns, so a broken parse would show up as a missing
      # warning, never as a failure: its cases, with a stub curl, run here.
      - name: Grafana password check reads docker/.env like compose
        run: .github/scripts/test-grafana-password-check.sh

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Backlog #0-141: the Maven repository and the wrapper's Maven
      # distribution, restored from the newest cache of this month even when
      # the POMs changed, so a dependency bump downloads only what is new.
      # setup-java's `cache: maven` restored only an exact match of the POMs'
      # hash (no restore-keys, by design: actions/setup-java#269), so every
      # Renovate PR downloaded the whole tree from Maven Central again. The
      # month in the key is what #269 was about: a restored repository keeps
      # the versions it no longer needs, and a new month starts from an empty
      # one. Saved on a push to main only (see "Save the Maven repository"):
      # a pull request reads main's cache (one entry for all of them, not one
      # per PR branch in the 10 GB Actions cache), and so do snyk.yml and
      # owasp-dependency-check.yml, by the same key, never saving. Keep the
      # three keys equal.
      - name: Maven cache month
        id: maven-cache-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ steps.maven-cache-month.outputs.month }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ steps.maven-cache-month.outputs.month }}-

      # Backlog #0-100: the root POM keeps a developer's gitignored local
      # configuration (application-local.*, application-secrets.*: real local
      # secrets) out of every jar. CI has no such files, so it plants both in
      # each service and in `shared` (nested in every service jar); "No jar
      # holds a local config" below fails if any jar packaged one.
      - name: Plant a local config the jars must leave out
        run: |
          for dockerfile in */Dockerfile; do
            set -- "$@" "${dockerfile%/Dockerfile}"
          done
          for module in shared "$@"; do
            mkdir -p "$module/src/main/resources"
            for name in application-local.yml application-secrets.yml; do
              printf '# CI marker (backlog #0-100): must not reach the jar\n' \
                > "$module/src/main/resources/$name"
            done
          done

      - name: Compile project
        run: ./mvnw clean compile -DskipTests --no-transfer-progress

      - name: Run tests with coverage
        run: |
          ./mvnw verify \
            -pl shared,service-parent,auth-service,ingestion-service,incident-service,notification-service,escalation-service,postmortem-service,oncall-service \
            --no-transfer-progress

      # The ninth structural rule (.ai/context/infrastructure.md). The
      # checker's own cases run first, so a broken checker cannot pass.
      - name: No jar holds a local config
        run: |
          .github/scripts/test-no-local-config-in-jars.sh
          .github/scripts/check-no-local-config-in-jars.sh

      # Backlog #0-141 (ADR-0030): build once, package many. The jars `verify`
      # just built and tested are the ones the smoke test (job 4) packages
      # into the images, so CI compiles and downloads dependencies once, here,
      # and never in Docker. Only after a green verify: a jar whose tests
      # failed is never packaged. `*-service-*.jar` matches the repackaged
      # jar, not `*.jar.original`, and keeps the `<service>/target/` paths the
      # Dockerfiles copy from. Uncompressed: a jar is a zip already, and
      # compressing about 800 MB again only costs time. Uploaded only when the
      # smoke test will run: the same condition as that job's `if:` (keep the
      # two equal), so a pull request it skips (one that changes only
      # .github/scripts/, say) sends no 800 MB nobody downloads.
      - name: Upload service jars
        if: github.event_name == 'push' || (needs.detect-changes.outputs.code == 'true' && (needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.services != '[]'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-jars
          path: '*-service/target/*-service-*.jar'
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Save the Maven repository
        if: github.event_name == 'push' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

      - name: Upload Jacoco coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jacoco-reports
          path: |
            shared/target/site/jacoco/
            auth-service/target/site/jacoco/
            ingestion-service/target/site/jacoco/
            incident-service/target/site/jacoco/
            notification-service/target/site/jacoco/
            escalation-service/target/site/jacoco/
            postmortem-service/target/site/jacoco/
            oncall-service/target/site/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: |
            shared/target/surefire-reports/
            auth-service/target/surefire-reports/
            ingestion-service/target/surefire-reports/
            incident-service/target/surefire-reports/
            notification-service/target/surefire-reports/
            escalation-service/target/surefire-reports/
            postmortem-service/target/surefire-reports/
            oncall-service/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      # Informational only: this action's min-coverage-* inputs choose the
      # report's emoji, they never fail the job. The gate is the next step.
      # Written to the job summary, not as a PR comment (backlog #0-57): a
      # comment needs a token with pull-requests: write, and this job runs
      # the PR's own tests, so it keeps the workflow's read-only token
      # (backlog #0-59). The comment had never been posted: the read-only
      # token got "Resource not accessible by integration", hidden by the
      # action's continue-on-error.
      - name: Coverage report to job summary
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        if: github.event_name == 'pull_request'
        with:
          paths: |
            ${{ github.workspace }}/shared/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/auth-service/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/ingestion-service/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/incident-service/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/notification-service/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/escalation-service/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/postmortem-service/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/oncall-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage Report
          comment-type: summary
          min-coverage-overall: 60
          min-coverage-changed-files: 60

      # Patch coverage gate (backlog #0-57): at least 60% of the Java lines a
      # PR adds or changes must be covered by tests. Coverage per module is
      # enforced separately by `jacoco:check` in `verify`; this step is what
      # stops new code from landing untested. It reads the JaCoCo XML reports
      # (same excludes as `check`: *Config, *Application, dto, domain events),
      # so a diff that touches only excluded classes or no Java passes. The
      # score is over all changed lines together; uncovered lines are listed
      # per file in the log and the job summary. A missing report fails the
      # step — that is how a detached JaCoCo agent went unnoticed before.
      - name: Set up Python for diff-cover
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Enforce coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install --disable-pip-version-check 'diff-cover==10.6.0'
          reports=()
          roots=()
          for m in shared auth-service ingestion-service incident-service notification-service escalation-service postmortem-service oncall-service; do
            reports+=("$m/target/site/jacoco/jacoco.xml")
            roots+=("$m/src/main/java")
          done
          rc=0
          diff-cover "${reports[@]}" \
            --src-roots "${roots[@]}" \
            --compare-branch "origin/$BASE_REF" \
            --fail-under 60 \
            --format markdown:diff-coverage.md || rc=$?
          if [ -f diff-coverage.md ]; then cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $rc

  # ──────────────────────────────────────────────────────────
  # Job 2: Detect what changed
  #
  # Feeds three downstream decisions:
  # - `code` (boolean): does the change touch anything but Markdown?
  #   false skips build-and-test (job 1) and the smoke test (job 4) on a
  #   pull request; a push to main always runs both.
  # - `services` (JSON array): which services changed. A change under
  #   `shared/**` or `pom.xml` lists all 7, and so does every push to main.
  #   The smoke test (job 4) runs when it is not empty. Until backlog
  #   #0-141 it was also the matrix of a job that built each changed
  #   service's image on its own runner; the smoke test builds all seven
  #   from the same jars anyway, so that job proved nothing more.
  # - `infra` (boolean): did anything change that could plausibly break
  #   the docker-compose-smoke-test job (job 4)? Gates whether that
  #   expensive job runs on a PR at all.
  # ──────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # On a pull_request, dorny/paths-filter lists the PR's files through the
    # API, which needs pull-requests: read. Without it this job fails, and
    # the smoke test (which needs its outputs) goes with it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.compute.outputs.services }}
      infra: ${{ steps.filter.outputs.infra }}
      code: ${{ steps.code.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # `code`: does the change touch anything but Markdown? A step of its own because
      # `predicate-quantifier: every` (a file counts only if it matches every pattern, here "anything" and
      # not Markdown) applies to all filters of a step, and the filters below are lists of alternatives.
      # Patterns match dotfiles too: a non-Markdown file anywhere, .github/ and .claude/ included, is
      # code. A renamed file is listed under its old name as well, so X.java -> X.md is code.
      - name: Filter code changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'

      - name: Filter changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'service-parent/**'
              - 'pom.xml'
            auth-service:
              - 'auth-service/**'
            incident-service:
              - 'incident-service/**'
            ingestion-service:
              - 'ingestion-service/**'
            notification-service:
              - 'notification-service/**'
            escalation-service:
              - 'escalation-service/**'
            postmortem-service:
              - 'postmortem-service/**'
            oncall-service:
              - 'oncall-service/**'
            infra:
              - 'docker/**'
              - '**/Dockerfile'
              - 'k8s/**'
              - '**/src/main/resources/application*.yml'
              - 'pom.xml'
              - '*/pom.xml'
              # Backlog #0-141: what the images' build context lets in.
              - '.dockerignore'
              # Backlog #0-94 step 2: the smoke test runs it; a PR changing
              # only the script must run it too.
              - '.github/scripts/test-log-collection.sh'

      - name: Compute the changed services
        id: compute
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ALL='["auth-service","incident-service","ingestion-service","notification-service","escalation-service","postmortem-service","oncall-service"]'
          SHARED_CHANGED=$(echo "$CHANGES" | jq 'contains(["shared"])')

          if [ "$EVENT_NAME" = "push" ] || [ "$SHARED_CHANGED" = "true" ]; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
          else
            # Keep only entries that are actual service names (drop the
            # 'infra' and 'shared' pseudo-filters, which aren't
            # buildable services themselves).
            FILTERED=$(echo "$CHANGES" | jq -c --argjson all "$ALL" '[.[] | select(. as $x | $all | index($x))]')
            echo "services=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────
  # Job 3: Validate Kubernetes manifests
  #
  # Always runs, unconditionally — unlike Docker builds and the smoke
  # test, this is cheap (seconds, no JVM/container boot), so there's no
  # meaningful cost/benefit case for filtering it.
  #
  # Two layers:
  # 1. `kubectl kustomize` — proves base/ and all three overlays
  #    actually build: every resource path in every kustomization.yml
  #    resolves, every patch target exists. This is exactly the check
  #    that would have caught auth-service's ingress/kustomization
  #    gaps immediately instead of an ad-hoc manual review.
  # 2. kubeconform — validates the *rendered* output against the real
  #    Kubernetes API schemas. Catches things kustomize build can't:
  #    wrong apiVersion, typo'd field names, wrong types. Runs against
  #    rendered YAML, not source YAML, so it sees exactly what would
  #    actually be sent to a cluster.
  #
  # Every input is pinned (backlog #0-76), so the result changes only with
  # a change in this repository: the version of the kubectl that renders
  # (and of the kustomize it bundles), the kubeconform binary, and the
  # schemas it validates against. kubeconform used to come from `releases/latest`,
  # piped into tar unchecked, and with no -kubernetes-version and no
  # -schema-location it fetches the schemas of the newest Kubernetes from
  # the `master` branch of yannh/kubernetes-json-schema on every run. A
  # replaced binary also runs before the checks below that read the same
  # /tmp renders (#0-63's Spring profile, #0-42's mail), so it could make
  # them pass falsely. kubectl is pinned by version only: azure/setup-kubectl
  # checks nothing it downloads, and a replaced kubectl writes those renders
  # itself (its signature check is backlog #0-135).
  # ──────────────────────────────────────────────────────────
  validate-k8s-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    # Bumped by hand, each value together with what it depends on; Renovate
    # tracks none of them (it cannot compute a checksum):
    # - KUBERNETES_VERSION: the version manifests are validated against and
    #   the kubectl that renders them, one value for both. A minor still
    #   supported upstream (1.36: until 2027-06-28), as no cluster exists to
    #   name one; the schemas below must have its directory
    #   (v<version>-standalone-strict).
    # - KUBECONFORM_SHA256: the linux-amd64 archive of that release. Commit it
    #   only when the release's CHECKSUMS file and the asset's `digest` in
    #   GitHub's API agree (`gh api repos/yannh/kubeconform/releases/tags/
    #   v<version>`); both come from GitHub, and no signature or attestation
    #   is published, so this catches a swapped file, not a malicious release.
    # - KUBECONFORM_SCHEMA_LOCATION: a commit of yannh/kubernetes-json-schema,
    #   not `master`, which is regenerated as Kubernetes releases.
    env:
      KUBERNETES_VERSION: 1.36.5
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBECONFORM_SCHEMA_LOCATION: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/817113f21a2643311cbc3e992bb44ffe1c416c54/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up kubectl (bundles kustomize)
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v${{ env.KUBERNETES_VERSION }}

      # Downloaded to a file and checked before it is unpacked or run, as the
      # Snyk CLI is (backlog #0-61). Downloaded and installed into RUNNER_TEMP,
      # outside the checkout a PR controls, and put on PATH for later steps:
      # no sudo needed.
      - name: Install kubeconform (pinned, checksum verified)
        run: |
          archive="${RUNNER_TEMP}/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            --output "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/kubeconform"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/kubeconform" kubeconform
          rm "$archive"
          echo "${RUNNER_TEMP}/kubeconform" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/kubeconform/kubeconform" -v
          kubectl version --client

      - name: Render and validate base
        run: |
          kubectl kustomize k8s/base > /tmp/base-rendered.yml
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$KUBECONFORM_SCHEMA_LOCATION" /tmp/base-rendered.yml

      - name: Render and validate dev overlay
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/dev-rendered.yml
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$KUBECONFORM_SCHEMA_LOCATION" /tmp/dev-rendered.yml

      - name: Render and validate staging overlay
        run: |
          kubectl kustomize k8s/overlays/staging > /tmp/staging-rendered.yml
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$KUBECONFORM_SCHEMA_LOCATION" /tmp/staging-rendered.yml

      - name: Render and validate prod overlay
        run: |
          kubectl kustomize k8s/overlays/prod > /tmp/prod-rendered.yml
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$KUBECONFORM_SCHEMA_LOCATION" /tmp/prod-rendered.yml

      - name: Cross-check every service has a Deployment in base
        run: |
          # Direct, cheap defense against exactly the auth-service gap
          # this job was written to catch: fails loudly if a service
          # directory with a Dockerfile has no matching Deployment.
          set -e
          for dir in */; do
            service="${dir%/}"
            if [ -f "$service/Dockerfile" ]; then
              if ! grep -q "name: $service$" /tmp/base-rendered.yml; then
                echo "::error::$service has a Dockerfile but no Deployment found in k8s/base"
                exit 1
              fi
            fi
          done
          echo "Every service with a Dockerfile has a matching k8s Deployment."

      # Backlog #0-63: the base ConfigMap once set SPRING_PROFILES_ACTIVE=dev,
      # so prod and staging started incident-service with the dev profile and
      # its unauthenticated /dev/token (an ADMIN JWT for any tenant). No
      # application-<profile>.yml exists for staging or prod, so neither sets
      # a profile at all: any profile setting in their rendered output fails,
      # in every form Spring reads (env var, property, command-line flag).
      # A future prod profile must be added to this check deliberately.
      - name: Staging and prod set no Spring profile
        run: |
          set -e
          pattern='spring[._-]profiles[._-](active|include|default)'
          failed=0
          for env in staging prod; do
            # A missing render must fail the step, not read as "no match":
            # inside `if`, grep's exit 2 (no such file) would pass silently.
            if [ ! -s "/tmp/${env}-rendered.yml" ]; then
              echo "::error::/tmp/${env}-rendered.yml is missing or empty; the render step above must run first"
              exit 1
            fi
            if grep -niE "$pattern" "/tmp/${env}-rendered.yml"; then
              echo "::error::k8s/overlays/${env} sets a Spring profile (backlog #0-63)"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "Neither staging nor prod sets a Spring profile."
          exit "$failed"

      # Backlog #0-42 (ADR-0026): dev on Kubernetes catches mail in its own Mailpit
      # (ClusterIP only: its UI shows invite and reset links), with the SMTP auth and
      # STARTTLS overrides compose uses; base, staging and prod have neither, and the
      # dev JVM patches reach the seven services only. check-k8s-mail.rb parses the
      # renders above (structure, not grep); its mutation test runs first, so a broken
      # checker cannot pass.
      - name: Mail manifests (Mailpit in dev only)
        run: |
          set -euo pipefail
          ruby --version
          .github/scripts/test-k8s-mail.sh
          ruby .github/scripts/check-k8s-mail.rb /tmp

      # Backlog #0-29: from the first commit of the manifests the staging and prod overlays held each
      # other's kustomization.yml, so "prod" rendered into incident-platform-staging with images tagged
      # `staging`. check-k8s-environments.rb parses the renders above and fails when an overlay renders
      # into another environment's namespace, or prod runs an untagged or `latest` image or a service
      # tagged with an environment's name. Backlog #0-137: it also fails when a service's replica count is
      # not owned by its HPA alone (spec.replicas set, no HPA, an HPA aimed at a missing Deployment, a
      # floor above the ceiling) or a prod HPA's floor is below 2. Backlog #0-138 (ADR-0029): and when a
      # service is not covered by exactly one PodDisruptionBudget of maxUnavailable 1 with
      # unhealthyPodEvictionPolicy AlwaysAllow, or does not spread over nodes (hostname, ScheduleAnyway).
      # Its mutation test runs first, so a broken checker cannot pass.
      - name: Each overlay deploys its own environment
        run: |
          set -euo pipefail
          .github/scripts/test-k8s-environments.sh
          ruby .github/scripts/check-k8s-environments.rb /tmp

  # ──────────────────────────────────────────────────────────
  # PostgreSQL roles (backlog #0-78), and the database password config (#0-66)
  #
  # Runs .github/scripts/test-postgres-roles.sh against the postgres image
  # docker-compose uses: the init script on an empty volume (restricted
  # services' role, a password with quotes, a non-default admin name),
  # its guard against APP_DB_USER == POSTGRES_USER, and
  # docs/database-roles-migrate.sql on a pre-#0-78 database, including
  # the completeness check that rolls everything back. The smoke test
  # only ever sees a fresh volume, so this is the only check of the
  # migration, the guard and the backup/restore commands. Always runs:
  # about 25 s plus pulling the image (22 s measured locally, image cached).
  # ──────────────────────────────────────────────────────────
  postgres-roles:
    name: PostgreSQL Roles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Init script, guard and migration
        run: .github/scripts/test-postgres-roles.sh

      # Backlog #0-66: the services' database password has no default, so a
      # Deployment or run without DB_PASSWORD never connects with the dev
      # password. .github/scripts/check-db-password-config.rb reads every
      # committed Spring config (application*.{yml,yaml,properties} under
      # */src/main/resources and its config/ subdirectory, parsed, not
      # grepped) and fails on a literal or defaulted datasource/Flyway
      # password, a password in the JDBC URL, or a service with a datasource
      # but no password. Its bypass test runs first, so a broken checker
      # cannot pass. A plain grep for the old default's pieces stays as a
      # second layer.
      - name: No service has a default database password
        run: |
          set -euo pipefail
          ruby --version
          .github/scripts/test-db-password-config.sh
          ruby .github/scripts/check-db-password-config.rb

          mapfile -t files < <(git ls-files -- '*/src/main/resources/application*' '*/src/main/resources/config/application*')
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no Spring config files found"; exit 1; }
          # grep exits 1 on no match and 2 on an error; only 1 passes.
          set +e
          grep -nE '\$\{DB_PASSWORD:|incident_secret' "${files[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::the old default database password is back in the lines above (backlog #0-66)"
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep failed (exit $rc)"
            exit 1
          fi
          echo "Checked ${#files[@]} config files: the old default is nowhere."

  # ──────────────────────────────────────────────────────────
  # Validate the monitoring config (backlog #0-16)
  #
  # Alertmanager and Prometheus only read their config at startup, and
  # the CI smoke test deliberately does not start them, so a broken
  # route, rule or inhibit rule would only show up when someone runs
  # the monitoring stack. Runs the pinned images' own tools:
  #   promtool check config  (prometheus.yml + the rules file)
  #   promtool test rules    (docker/prometheus.rules.test.yml)
  #   amtool check-config + route tests (Watchdog never reaches the
  #   webhook, critical alerts reach both email and webhook)
  # Image tags must stay equal to docker/docker-compose.yml.
  # ──────────────────────────────────────────────────────────
  validate-monitoring-config:
    name: Validate Monitoring Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Prometheus config and rule tests
        run: |
          docker run --rm -v "$PWD/docker:/cfg" -w /cfg --entrypoint promtool \
            prom/prometheus:v3.13.3 check config prometheus.yml
          docker run --rm -v "$PWD/docker:/cfg" -w /cfg --entrypoint promtool \
            prom/prometheus:v3.13.3 test rules prometheus.rules.test.yml

      # Backlog #0-94 step 2: the log pipeline's own config, on the images
      # docker/docker-compose.yml runs: the tags are read from it (as
      # test-postgres-roles.sh reads Postgres's), so the two cannot drift.
      # alloy fmt fails on a file that is not in canonical form, so the
      # committed one stays it (a new Alloy version may need a reformat).
      - name: Loki and Alloy config
        run: |
          set -euo pipefail
          image_of() { awk -v svc="  $1:" '$0 == svc {f=1} f && /^    image:/ {print $2; exit}' docker/docker-compose.yml; }
          loki_image=$(image_of loki)
          alloy_image=$(image_of alloy)
          case "$loki_image" in grafana/loki:*) ;; *) echo "::error::no grafana/loki image for service loki in docker-compose.yml (got '$loki_image')"; exit 1 ;; esac
          case "$alloy_image" in grafana/alloy:*) ;; *) echo "::error::no grafana/alloy image for service alloy in docker-compose.yml (got '$alloy_image')"; exit 1 ;; esac
          echo "Loki: $loki_image, Alloy: $alloy_image"
          docker run --rm -v "$PWD/docker:/cfg:ro" \
            "$loki_image" -config.file=/cfg/loki.yml -verify-config
          docker run --rm -v "$PWD/docker/alloy:/cfg:ro" \
            "$alloy_image" validate /cfg/config.alloy
          docker run --rm -v "$PWD/docker/alloy:/cfg:ro" \
            "$alloy_image" fmt /cfg/config.alloy | diff -u docker/alloy/config.alloy - \
            || { echo "::error file=docker/alloy/config.alloy::not in alloy fmt's canonical form"; exit 1; }

      - name: Alertmanager config and routing
        run: |
          amtool() {
            docker run --rm -v "$PWD/docker:/cfg" -w /cfg --entrypoint amtool \
              prom/alertmanager:v0.34.1 "$@"
          }
          amtool check-config alertmanager.yml
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=deadmans-switch \
            alertname=Watchdog scope=platform severity=none
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email \
            alertname=AlertmanagerNotificationsFailing scope=platform severity=high
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=PlatformServiceDown scope=platform severity=critical service=auth-service
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=JvmMemoryHigh scope=platform severity=high
          # Backlog #0-83: the platform API alerts. The two critical ones must
          # reach the operator by email (outside the platform: someone acting as
          # an operator could resolve the incident in the operator tenant).
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=PlatformTenantProvisioningSpike scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=PlatformApiRateLimited scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=PlatformApiRateLimitUnavailable scope=platform severity=high
          # Backlog #0-88: the admin MFA reset limit's alerts. Reaching the limit
          # may mean a taken-over admin account, so it reaches the operator by
          # email too.
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=AdminMfaResetRateLimited scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=AdminMfaResetRateLimitUnavailable scope=platform severity=high
          # Backlog #0-84: an audit trail behind its actions reaches the
          # operator by email too.
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=AuditOutboxBacklog scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=AuditEventsRejected scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=AuditEventUnrecorded scope=platform severity=critical
          # Backlog #0-91/#0-92: a refused record's tenant is a lost event and
          # possibly a forged record, so it reaches the operator by email too.
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=KafkaRecordsTenantRejected scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=KafkaRecordsWithoutTenant scope=platform severity=high
          # Backlog #0-96: a record given up on is an event not processed, so it
          # reaches the operator by email too; a stuck partition is high.
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=KafkaRecordRedeliveryGaveUp scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=KafkaRecordRedeliveryStuck scope=platform severity=high
          # Backlog #0-82 step 2: a rejected status-lookup token means new
          # suspensions go unenforced in that service, so the operator hears of
          # it by email too; an outage is high (the last known statuses hold).
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=operator-email,platform-webhook \
            alertname=TenantStatusLookupRejected scope=platform severity=critical
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=TenantStatusLookupFailing scope=platform severity=high
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=WebSocketSessionUntracked scope=platform severity=high
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=TenantStatusCacheFull scope=platform severity=high
          # Backlog #0-94 step 2: the log pipeline's alerts.
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=LogPipelineDown scope=platform severity=high job=loki
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=LogDiscoveryFailing scope=platform severity=high
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=LogPipelineNotScraped scope=platform severity=high job=alloy
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=LogPipelineRestarting scope=platform severity=high job=loki
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=LogsNotFlowing scope=platform severity=high job=alloy
          amtool config routes test --config.file=alertmanager.yml \
            --verify.receivers=platform-webhook \
            alertname=LogsDropped scope=platform severity=high reason=ingester_error

  # ──────────────────────────────────────────────────────────
  # Job 4: Smoke test — boot the real stack via docker compose and
  # confirm every service reports healthy.
  #
  # Static validation (job 3) proves the files are well-formed.
  # It cannot prove the application actually starts — wrong port
  # numbers, missing required env vars, or services that can't reach
  # their dependencies all pass static validation and fail here (this
  # is exactly how the DB_HOST/DB_URL bug was found).
  #
  # Scoped to postgres/redis/kafka + the 7 application services —
  # deliberately skips kafka-ui/kafka-exporter/pgadmin/alertmanager/
  # prometheus/grafana, which are local dev conveniences unrelated to
  # whether the platform itself runs. The log pipeline
  # (docker-socket-proxy, loki, alloy; backlog #0-94 step 2) is started
  # too: only the real services' output shows that their lines reach
  # Loki parsed.
  #
  # The one place in CI where the images are built (backlog #0-141,
  # ADR-0030): `docker compose up` builds all seven through compose's own
  # `build:` blocks, from the jars build-and-test's `verify` tested (the
  # `service-jars` artifact, put back into each `<service>/target/`). The
  # Dockerfiles only package a jar, so this job neither compiles nor
  # downloads from Maven Central (a 502 there failed it, 2026-10-15), and
  # it boots exactly what the tests ran against. Until #0-141 every image
  # compiled its service again and resolved its dependencies on its own,
  # here and in a separate per-service image job, which this job replaced.
  # Hence `needs: build-and-test`: it starts once verify is green and does
  # not run when verify failed, on main too.
  #
  # Runs on every push to main unconditionally (safety net — catches
  # things path-filtering can miss, e.g. a transitive dependency bump
  # changing runtime behavior with no docker/k8s/yml file touched). On
  # pull_request, runs whenever detect-changes found an infra-relevant
  # path changed OR any service's own directory changed (backlog #35 —
  # previously only the former, which missed pure .java-only PRs
  # entirely; see the job's own `if:` condition below for the full
  # account).
  # ──────────────────────────────────────────────────────────
  docker-compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    # build-and-test is skipped only on a pull request that changes Markdown
    # alone, which `code` below skips too; the `if:` names no status function,
    # so a failed or skipped build-and-test skips this job. Any failed step of
    # it, not only `verify`: the local-config check and, on a pull request,
    # the changed-lines coverage gate too (ADR-0030, Consequences).
    needs: [ detect-changes, build-and-test ]
    # Fixed (backlog #35): previously only `event_name == push` (i.e.
    # after merge, too late) or `infra == 'true'` — the infra filter only
    # matches docker/**, Dockerfile, k8s/**, application*.yml, and pom.xml
    # changes. A PR touching only .java source in a service (no infra
    # file touched at all) was skipped entirely here, only ever reaching
    # this check on the subsequent push to main — after the bug already
    # merged. Not a theoretical gap: both examples cited in this job's
    # own header comment (the DB_HOST/DB_URL bug) and the JPQL role/
    # teamRole typo in TeamMemberRepository (auth-service) were exactly
    # this shape — pure .java changes, no infra file touched — and would
    # have been invisible to this job on their original PR.
    #
    # Added `needs.detect-changes.outputs.services != '[]'`, reusing
    # detect-changes' output rather than inventing a parallel path filter. `services` already
    # captures "did anything under this service's own directory change"
    # (including .java files, unlike infra's application*.yml-only
    # scoping), so this closes the gap using data already computed two
    # jobs up. `infra` is kept alongside it, not replaced — it still adds
    # real, unique coverage for changes under k8s/** or docker-compose.yml
    # itself, neither of which maps to any single service's path filter
    # and so would never appear in `services`.
    #
    # `event_name == 'push'` is now technically redundant — the compute
    # step in detect-changes already forces `services` to all 7 on every
    # push to main regardless of what changed, so `services != '[]'`
    # alone would already be true there. Kept anyway, deliberately, as a
    # explicit, defensive fallback: if that forcing logic in
    # detect-changes ever changed or broke silently, this job's own
    # safety net for the push-to-main case should not silently disappear
    # along with it.
    #
    # And `code`: a pull request that changes Markdown only (a service's
    # README matches its `services` filter) has nothing to boot differently,
    # as build-and-test (job 1) concludes too; it no longer waits for this
    # job's 20 minutes.
    #
    # build-and-test's "Upload service jars" step has this same condition, so
    # the artifact exists exactly when this job runs: keep the two equal.
    if: github.event_name == 'push' || (needs.detect-changes.outputs.code == 'true' && (needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.services != '[]'))
    timeout-minutes: 20
    # docker-compose.yml requires both database passwords (backlog #0-78) and
    # Grafana's admin password (#0-94 step 2), and interpolates them for every
    # compose command, the log dump and teardown included, so they are set for
    # the whole job. Dummy CI-only values.
    env:
      DB_PASSWORD: ci-smoke-test-db-password
      POSTGRES_ADMIN_PASSWORD: ci-smoke-test-admin-password
      # JWT_SECRET, MFA_ENCRYPTION_KEY and SLACK_ENCRYPTION_KEY have no
      # default in docker-compose.yml; everything else falls back safely for
      # a smoke test. Set for the whole job since backlog #0-141: the
      # break-glass step starts auth-service once more (`docker compose run`),
      # not only "Start the stack". Dummy CI-only values, never used anywhere
      # real. SLACK_ENCRYPTION_KEY (backlog #0-21) is a different key from
      # MFA_ENCRYPTION_KEY on purpose — auth-service refuses to start without it.
      JWT_SECRET: ci-smoke-test-secret-not-for-real-use-minimum-64-characters-long-k8s
      MFA_ENCRYPTION_KEY: n8WIymtbGNC8V61F6BVDfbswbkBLJNqY9bi+GYJEt5M=
      SLACK_ENCRYPTION_KEY: XrKj1e9X/qBW4x1/woM+mZoYIMkRaNap0Qs8Id+ujE8=
      # Required by compose since #0-94 step 2 (Grafana is not started here).
      GRAFANA_ADMIN_PASSWORD: ci-smoke-test-grafana-password

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Into the workspace: the artifact keeps the `<service>/target/` paths
      # each Dockerfile copies its jar from.
      - name: Download service jars
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: service-jars

      - name: Start the stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 300 \
            postgres redis kafka docker-socket-proxy loki alloy \
            auth-service ingestion-service incident-service notification-service \
            escalation-service postmortem-service oncall-service

      - name: Check every service's health endpoint
        run: |
          declare -A ports=(
            [auth-service]=8097
            [ingestion-service]=8091
            [incident-service]=8092
            [notification-service]=8093
            [escalation-service]=8094
            [postmortem-service]=8095
            [oncall-service]=8096
          )
          failed=0
          for service in auth-service ingestion-service incident-service notification-service escalation-service postmortem-service oncall-service; do
            port="${ports[$service]}"
            echo "Checking $service on port $port..."
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:$port/actuator/health" || echo "CURL_FAILED")
            if [ "$status" != "200" ]; then
              echo "::error::$service health check returned '$status' (expected 200) on port $port"
              failed=1
            else
              echo "$service: healthy"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

      # Backlog #0-141 (ADR-0030): the images start the extracted jar through
      # Spring Boot's JarLauncher, and auth-service's break-glass command
      # (backlog #0-88, ADR-0007) depends on it passing the arguments after
      # the entrypoint to main unchanged. Run without its options, the command
      # must start, recognise the subcommand and refuse: exit code 1 and its
      # own message, not the service starting (which would mean the
      # subcommand never reached main) and nothing changed in the database.
      - name: The break-glass command reaches auth-service's main
        run: |
          set +e
          out=$(docker compose -f docker/docker-compose.yml run --rm --no-deps -T \
            auth-service break-glass-mfa-reset 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 1 ] || ! grep -q 'Break-glass MFA reset refused: --break-glass.mfa-reset.user-email is required' <<<"$out"; then
            echo "::error::break-glass-mfa-reset without options: expected exit 1 and its refusal, got exit $rc"
            printf '%s\n' "$out" | tail -20
            exit 1
          fi
          echo "break-glass-mfa-reset reached main and refused as expected (exit 1)."

      # Backlog #0-78: the services' DB role must not be a superuser (it was,
      # through the image's POSTGRES_USER, which made SQL injection in any
      # service command execution in the database container). The services
      # above already ran every Flyway migration as this role on an empty
      # database, so this run also shows that no migration needs superuser
      # rights; the Testcontainers tests cannot, as they connect as the
      # container's superuser.
      #
      # Three checks, because the attributes alone are not the property:
      # a later GRANT of pg_execute_server_program (or any other role) would
      # bring COPY ... TO PROGRAM back without making the role a superuser.
      # The last check tries exactly that, with a harmless program.
      # The role names come from the container's own POSTGRES_USER and
      # APP_DB_USER; psql runs over its local socket, where the image uses
      # 'trust', so no password is needed (passwords are tested by the
      # postgres-roles job).
      - name: Services' DB role is not a superuser
        run: |
          set -euo pipefail
          # as_admin / as_app run psql in the container as POSTGRES_USER / APP_DB_USER.
          as_admin() { docker compose -f docker/docker-compose.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" "$@"' psql "$@"; }
          as_app()   { docker compose -f docker/docker-compose.yml exec -T postgres sh -c 'psql -U "$APP_DB_USER" -d "$POSTGRES_DB" "$@"' psql "$@"; }
          app=$(docker compose -f docker/docker-compose.yml exec -T postgres sh -c 'printf %s "$APP_DB_USER"')

          attrs=$(as_admin -tA -v app="$app" <<'SQL'
          SELECT concat_ws(',', rolsuper, rolcreaterole, rolcreatedb, rolreplication, rolbypassrls) FROM pg_roles WHERE rolname = :'app';
          SQL
          )
          if [ "$attrs" != "f,f,f,f,f" ]; then
            echo "::error::${app} must exist without SUPERUSER, CREATEROLE, CREATEDB, REPLICATION or BYPASSRLS; got '${attrs}' (in that order)"
            exit 1
          fi

          memberships=$(as_admin -tA -v app="$app" <<'SQL'
          SELECT coalesce(string_agg(m.roleid::regrole::text, ','), '')
          FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.member WHERE r.rolname = :'app';
          SQL
          )
          if [ -n "$memberships" ]; then
            echo "::error::${app} must not be a member of any role; it is a member of: ${memberships}"
            exit 1
          fi

          if out=$(as_app -v ON_ERROR_STOP=1 -c "COPY (SELECT 1) TO PROGRAM 'true'" 2>&1); then
            echo "::error::${app} was allowed to run COPY ... TO PROGRAM"
            exit 1
          fi
          if ! grep -q "permission denied to COPY to or from an external program" <<<"$out"; then
            echo "::error::COPY ... TO PROGRAM as ${app} failed, but not with the expected permission error: ${out}"
            exit 1
          fi
          echo "${app}: no superuser-like attributes, no role memberships, COPY ... TO PROGRAM refused."

      # Backlog #0-94 step 2: every service's lines reach Loki with their level,
      # a JSON line's tenantId and requestId as structured metadata, never labels.
      - name: Logs reach Loki
        run: .github/scripts/test-log-collection.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          for service in postgres redis kafka docker-socket-proxy loki alloy \
            auth-service ingestion-service incident-service notification-service \
            escalation-service postmortem-service oncall-service; do
            echo "::group::Logs — $service"
            docker compose -f docker/docker-compose.yml logs "$service"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
