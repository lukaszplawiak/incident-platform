# ============================================================
# OWASP Dependency-Check
#
# Compares all Maven dependencies against the NVD CVE database.
# Fails when any dependency has a CVSS score >= 7.0 (High/Critical).
#
# Runs on:
#   - Push to main when pom.xml changes
#   - Every Monday at 08:00 Warsaw time (scheduled)
#   - Manual trigger (workflow_dispatch)
#
# Separate from the main CI workflow — NVD database download
# takes 2-15 minutes and should not slow down every build.
#
# Run locally:
#   NVD_API_KEY=your-key ./mvnw dependency-check:aggregate
#   open target/dependency-check-report.html
#
# Required secret (optional but recommended), in the environment `scans`
# (backlog #0-154), never a repository secret:
#   NVD_API_KEY — speeds up NVD download from ~15 min to ~2 min
#   Free key at: https://nvd.nist.gov/developers/request-an-api-key
#   Add to: Settings -> Environments -> scans -> Environment secrets -> NVD_API_KEY
#
# The scan job runs in the environment `scans`, which only main may use
# (ADR-0035, as in snyk.yml): a manual dispatch on another branch would run
# that branch's mvnw, POM and plugins next to the key. Both jobs are skipped
# off main, so such a dispatch builds nothing either.
# ============================================================

name: OWASP Dependency-Check

on:
  push:
    branches: [ main ]
    paths:
      - '**/pom.xml'
      - 'owasp-suppressions.xml'
      - '.github/workflows/owasp-dependency-check.yml'

  schedule:
    # Every Monday 08:00 Warsaw time (06:00 UTC)
    - cron: '0 6 * * 1'

  workflow_dispatch:

# Declared, not left to the repository setting (backlog #0-59); every scope
# not listed is `none`. Checkout is the only GITHUB_TOKEN use: the Maven
# cache, actions/cache and upload-artifact go through the runner's own
# Actions runtime token.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OWASP_FAIL_THRESHOLD: 7

# Every `uses:` names a full commit SHA, with its tag in a comment (backlog
# #0-60): a tag can be repointed by whoever controls the action's repository,
# a SHA cannot. Renovate (helpers:pinGitHubActionDigests) bumps both together.
# The repository setting "Require actions to be pinned to a full-length commit
# SHA" is on (since 2026-09-29): a workflow with a tag-pinned `uses:` fails to
# start. README "Infrastructure Hardening" records the setting.
jobs:

  # ============================================================
  # 1. BUILD JOB
  # ============================================================
  build:
    name: Build project
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config for the rest of the job:
          # no step pushes, and any later step (a compromised action, a CLI
          # installed at run time) could read it from there (backlog #0-60).
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Backlog #0-145 (ADR-0031): the Maven distribution and the Maven
      # repository CI's build-and-test saved on main, through the one action
      # that writes their paths and keys (ci.yml calls it too). Never saved
      # here, so only what the entry lacks (this scan's own plugins) comes
      # from Maven Central. On a miss of the distribution, mvnw downloads the
      # zip and checks it against distributionSha256Sum, which build-and-test
      # checked against Apache.
      - name: Restore the Maven caches
        uses: ./.github/actions/restore-maven-caches

      - name: Build project
        run: |
          ./mvnw clean verify \
            -DskipTests \
            --no-transfer-progress


  # ============================================================
  # 2. OWASP SECURITY SCAN JOB
  # ============================================================
  owasp-dependency-check:
    name: OWASP Dependency-Check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: scans
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Backlog #0-145 (ADR-0031): the Maven distribution and the Maven
      # repository CI's build-and-test saved on main, through the one action
      # that writes their paths and keys (ci.yml calls it too). Never saved
      # here, so only what the entry lacks (this scan's own plugins) comes
      # from Maven Central. On a miss of the distribution, mvnw downloads the
      # zip and checks it against distributionSha256Sum, which build-and-test
      # checked against Apache.
      - name: Restore the Maven caches
        uses: ./.github/actions/restore-maven-caches

      # ------------------------------------------------------------
      # Stable OWASP DB cache (no pom.xml dependency coupling)
      # ------------------------------------------------------------
      - name: Cache OWASP DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-db-${{ runner.os }}
          restore-keys: |
            owasp-db-

      # ------------------------------------------------------------
      # Security scan (fail only on real CVEs)
      # Fail-safe enabled for NVD outages
      # ------------------------------------------------------------
      # Backlog #0-150: the key is an environment variable of this step only,
      # which the plugin reads itself (`nvdApiKeyEnvironmentVariable` in the root
      # pom.xml), never an argument of the Maven process, where any process of
      # the job could read it (/proc/<pid>/cmdline) and Maven's debug log shows
      # it (GHSA-qqhq-8r2c-c3f5).
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          timeout 20m ./mvnw dependency-check:aggregate \
            --no-transfer-progress \
            -DfailBuildOnCVSS=${{ env.OWASP_FAIL_THRESHOLD }}

      # ------------------------------------------------------------
      # Upload report (always preserved even if scan fails)
      # ------------------------------------------------------------
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30