# ============================================================
# Main guard — a red main stops the autopilot (backlog #0-113)
#
# When CI fails on main, open (once) an issue labelled `autopilot-stop`. The autopilot's preflight
# (scripts/factory/preflight.sh) refuses to start while such an issue is open, and also reads main's
# latest CI result itself, so this issue is the visible, remote half of the stop: closable from a phone,
# and a place to note what broke. Reverting is the owner's decision, not automated: the failing commit is
# not always the one to revert.
#
# Fixed (backlog #0-148): `branches: [ main ]` matches the head branch of the CI run, a name the author of a
# pull request chooses: a fork's branch named `main` matched it (runs of this repository's own PR branches
# never started this workflow, runs of pushes to main always did), and a fork pull request's CI run does
# trigger workflow_run here, with this workflow's token. A failing run of such a pull request could open the
# issue and stop the autopilot, again after every close. So the job also requires a push to this
# repository: the filter narrows when it starts, the `if:` decides whose run it trusts.
# preflight.sh reads main's CI result the same way (`--event push`).
# ============================================================

name: Main guard

# zizmor (backlog #0-147) rates every workflow_run trigger high, whatever guards it: the run it reacts to
# may be a fork's. Here the job's `if:` acts only on a push to this repository (#0-148), checks out
# nothing and runs no code from the triggering run, so the finding is suppressed on the trigger itself
# (on both lines: zizmor versions place it on either).
on:  # zizmor: ignore[dangerous-triggers] the job acts only on a push to this repository (backlog #0-148)
  workflow_run:  # zizmor: ignore[dangerous-triggers] backlog #0-148, see above
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

# GITHUB_TOKEN scope (backlog #0-59): nothing at the workflow level; the one job asks for what it uses,
# so a job added later starts with no scope (zizmor's excessive-permissions, backlog #0-147).
permissions: {}

jobs:
  stop-on-red-main:
    name: Stop the autopilot on a red main
    # issues: write for the stop issue only; contents: read for `gh` to read the repository.
    permissions:
      contents: read
      issues: write
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Open the autopilot-stop issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          open=$(gh issue list --label autopilot-stop --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "an autopilot-stop issue is already open"
            exit 0
          fi
          body=$(printf 'CI failed on main at %s: %s\n\nThe autopilot will not start while this issue is open. Fix or revert main, check that CI is green, then close this issue.\n' "$HEAD_SHA" "$RUN_URL")
          gh issue create --label autopilot-stop \
            --title "CI is red on main (${HEAD_SHA:0:7}): autopilot stopped" \
            --body "$body"
