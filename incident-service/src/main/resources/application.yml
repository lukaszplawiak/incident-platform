spring:
  application:
    name: incident-service

    # Virtual threads (Project Loom, stable since Java 21) — one line,
    # meaningful throughput improvement for an I/O-bound service like this
    # one (JPA/JDBC, Kafka, WebSocket all spend most of their time waiting,
    # not computing). Caveat worth knowing: virtual threads can "pin" to
    # their OS carrier thread during a `synchronized` block, temporarily
    # losing the scalability benefit for that section. HikariCP (used here)
    # and the Postgres JDBC driver are both current enough to avoid the
    # worst of this, but if CPU/thread-pool metrics look off after enabling
    # this, that's the first thing to check.
  threads:
    virtual:
      enabled: true
  # Backlog #0-84: with virtual threads Spring Boot schedules on a
  # SimpleAsyncTaskScheduler, one virtual thread per run, so a slow audit
  # outbox relay run holds no other @Scheduled job (spring.task.scheduling.
  # pool.size has no effect here; found in review: it was set to no avail).

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:incidentdb}
    username: ${DB_USER:incident_app}
    # No default (backlog #0-66), so a missing DB_PASSWORD never connects
    # with the dev password. Spring Boot leaves an unresolved placeholder in
    # place here, so the symptom is "password authentication failed for user
    # incident_app", not a placeholder error; compose and Kubernetes stop
    # earlier with their own message. Set in docker/.env (compose),
    # app-secrets (k8s) or application-local.yml (spring-boot:run):
    # docs/database-roles.md.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
      pool-name: incident-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_incident
    # Backlog #0-84: V13 builds an index CONCURRENTLY, which waits for every
    # open transaction, Flyway's own included: with the default transactional
    # advisory lock (Flyway 10+) Flyway holds a transaction open on its lock
    # connection and the build waits on it forever (found in the migration
    # test). A session-level lock instead, released when the connection
    # closes; this service connects to Postgres directly, not through a
    # transaction-pooling proxy that would make a session lock unsafe.
    postgresql:
      transactional-lock: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: incident-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaConsumerInterceptor
        max.poll.interval.ms: 30000
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaProducerInterceptor
        # Backlog #0-84: how long KafkaProducer.send() itself may block while
        # Kafka's metadata is missing (Kafka down or unreachable), before it
        # fails. The default, 60 s, would hold the audit outbox relay on the
        # scheduling thread that long per run; the relay waits for
        # acknowledgements within audit.outbox.send-timeout (5 s) anyway. The
        # incident event outbox and the dead-letter publisher fail as fast.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  security:
    user:
      name: ${SECURITY_USER:disabled}
      password: ${SECURITY_PASSWORD:disabled}

jwt:
  secret: ${JWT_SECRET}
  # Access token TTL — how long a user JWT is valid after login.
  # Short TTL (PT15M) limits exposure of stolen tokens; session continuity
  # is handled by the refresh token flow (POST /api/v1/auth/refresh).
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  # Service token TTL — for inter-service calls via ServiceTokenProvider.
  # Longer than access-token-ttl; rotated automatically before expiry.
  service-token-ttl: ${JWT_SERVICE_TOKEN_TTL:PT1H}
  # Refresh token TTL — how long a refresh token is valid.
  # Refresh tokens are rotated on every use — stolen tokens are
  # detected when the legitimate user next calls /auth/refresh.
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

kafka:
  topics:
    alerts-raw: alerts.raw
    alerts-resolved: alerts.resolved
    incidents-lifecycle: incidents.lifecycle
    audit-events: audit.events
    incidents-dead-letter: incidents.dead-letter
  dead-letter:
    # How long DLT messages are retained before Kafka deletes them.
    # Gives operators time to inspect, replay or discard poison pills.
    # Override per environment: dev=1, staging=7, prod=30.
    retention-days: ${DEAD_LETTER_RETENTION_DAYS:30}

# Backlog #36 — Transactional Outbox for incidents.lifecycle publishing.
# See IncidentEventOutbox/IncidentEventOutboxScheduler's Javadoc for the
# full account of the phantom-event bug this replaces.
incident:
  event-outbox:
    # Kept short relative to auth-service's 30s email-outbox interval —
    # incident lifecycle events drive real-time escalation timers and
    # notification paging downstream; this interval is the only added
    # latency versus the old direct-publish behavior.
    poll-interval-ms: ${INCIDENT_EVENT_OUTBOX_POLL_INTERVAL_MS:2000}
    # Caps how many PENDING entries one poll cycle processes — bounds
    # worst-case cycle duration if a backlog accumulates (e.g. after a
    # Kafka outage); the next cycle continues where this one left off.
    batch-size: ${INCIDENT_EVENT_OUTBOX_BATCH_SIZE:50}
    # How long sendRawSync blocks waiting for the broker's ack per entry
    # before treating the send as failed (left PENDING, retried next cycle).
    send-timeout: ${INCIDENT_EVENT_OUTBOX_SEND_TIMEOUT:PT5S}


# Backlog #0-84: audit events go to this service's outbox table (migration),
# written with the action they record, and the shared relay sends them to
# Kafka. Without this property the service would send directly.
audit:
  outbox:
    table: incident_audit_outbox
    poll-interval-ms: ${AUDIT_OUTBOX_POLL_INTERVAL_MS:2000}

server:
  port: ${SERVER_PORT:8082}
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_PORT:8092}

logging:
  level:
    root: INFO
    com.incidentplatform: DEBUG
    org.springframework.security: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{tenantId:-no-tenant}] [%X{requestId:-no-req}] [%X{userId:-no-user}] %-5level %logger{36} - %msg%n"

security:
  cors:
    # Allowed origins for CORS. Comma-separated list.
    # Override per environment: dev=localhost, prod=https://app.incidentplatform.com
    # This property has no inline default — it must be set here or via env var.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}