# Alertmanager configuration for the platform's OWN monitoring (backlog #0-16)
#
# Every alert here comes from docker/prometheus.rules.yml and is about the
# platform itself (label scope: platform). Tenants run their own Alertmanager
# with their own Integration API key; that traffic never passes through here.
#
# Routing (first matching route wins unless it says continue: true):
#   1. Watchdog            -> external dead man's switch, nothing else
#   2. AlertmanagerNotificationsFailing -> operator email only, never the
#      webhook that may be the one failing
#   3. critical platform   -> operator email (out of band) AND, via continue,
#      the platform webhook (history and postmortems in the operator tenant)
#   4. everything else     -> platform webhook only
#
# Why the out-of-band paths: a system must not be the only channel that reports
# its own failure. When ingestion-service, Kafka or notification-service is
# down, an alert about it cannot travel through them; the email and the dead
# man's switch do not depend on any of them. incident.io keeps a backup pager
# for the same reason, and PagerDuty's 2025-08-28 Kafka outage degraded its own
# notification path for hours.
#
# Alertmanager does NOT expand environment variables. Everything dynamic comes
# from *_file fields read at notification time, from ./secrets (gitignored),
# mounted read-only at /etc/alertmanager/secrets:
#   deadmans-switch-url    URL the Watchdog is POSTed to about every 2 minutes
#                          (see route 1). Locally:
#                          copy docker/deadmans-switch-url.example. In a real
#                          deployment: a healthchecks.io / Dead Man's Snitch /
#                          Grafana IRM heartbeat URL, which pages when pings stop.
#   platform-operator-api-key
#                          Integration API key (ipl_...) of the reserved
#                          platform-operator tenant, scope alerts:ingest, for
#                          the platform webhook (see receiver, README Step 5).

global:
  resolve_timeout: 5m
  http_config:
    follow_redirects: true
  # Dev only: mailpit (docker-compose) accepts plain SMTP without auth. A real
  # deployment points this at its relay with TLS and smtp_auth_password_file.
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alertmanager@incident-platform.local'
  smtp_require_tls: false

route:
  receiver: platform-webhook
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # 1. Heartbeat. repeat_interval is rounded up to a multiple of
    #    group_interval, so both are 1m; a repeat goes out only on a
    #    group_interval tick once repeat_interval has passed, which in practice
    #    is every other tick (observed: about every 2 minutes). A real dead
    #    man's switch needs a period above that. No continue: the Watchdog
    #    must never reach ingestion-service.
    - matchers:
        - alertname = "Watchdog"
      receiver: deadmans-switch
      group_by: ['alertname']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # 2. Alertmanager itself cannot deliver: tell the operator by email only.
    - matchers:
        - alertname = "AlertmanagerNotificationsFailing"
      receiver: operator-email
      group_wait: 10s
      repeat_interval: 1h

    # 3. Critical platform alerts: email now, and continue to route 4 so the
    #    same alert also becomes an incident of the operator tenant.
    - matchers:
        - scope = "platform"
        - severity = "critical"
      receiver: operator-email
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # 4. All platform alerts into the platform (operator tenant).
    - matchers:
        - scope = "platform"
      receiver: platform-webhook

receivers:
  - name: deadmans-switch
    webhook_configs:
      - url_file: '/etc/alertmanager/secrets/deadmans-switch-url'
        send_resolved: false
        timeout: 10s

  - name: operator-email
    email_configs:
      # Literal on purpose: Alertmanager has no env expansion. Keep it equal to
      # NOTIFICATION_OPERATOR_ALERT_EMAIL in docker-compose.yml, the address that
      # already receives notification-service's content-free operator alerts.
      - to: 'operator@incident-platform.local'
        send_resolved: true

  - name: platform-webhook
    webhook_configs:
      - url: 'http://host.docker.internal:8081/api/v1/alerts/prometheus'
        send_resolved: true
        # Per attempt. Alertmanager retries network errors and 5xx (not 4xx)
        # until the group_interval deadline; without a timeout one hung request
        # would use up that whole window.
        timeout: 10s
        http_config:
          # Fixed (backlog #0-16): this used to be a 30-day ROLE_SERVICE JWT
          # for tenant "system" that could not be revoked, minted by
          # ingestion-service itself. Now an Integration API key of the
          # platform-operator tenant, revocable in auth-service like any
          # tenant's key (ingestion-service caches the answer for at most 60 s).
          # "type: ApiKey" makes Alertmanager send "Authorization: ApiKey ipl_...".
          authorization:
            type: ApiKey
            # credentials_file is read on every outgoing request, not once at
            # startup, so the key can be rotated without a restart.
            credentials_file: '/etc/alertmanager/secrets/platform-operator-api-key'

inhibit_rules:
  # Fixed (backlog #0-16): the only rule here used to target severity "warning",
  # which no rule in prometheus.rules.yml uses, so it never inhibited anything.

  # A service that is down explains its error-rate, JVM and ingestion symptoms.
  - source_matchers:
      - alertname = "PlatformServiceDown"
    target_matchers:
      - alertname =~ "HighHttpErrorRate|JvmMemoryHigh|JvmGcPauseHigh|AlertIngestionErrorRateHigh"
    equal: ['service']

  # Critical lag supersedes high lag on the same consumer group and topic.
  - source_matchers:
      - alertname = "KafkaConsumerLagCritical"
    target_matchers:
      - alertname = "KafkaConsumerLagHigh"
    equal: ['consumergroup', 'topic']

  # Generic: a critical alert silences lower severities of the same alert on
  # the same service.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity =~ "high|medium|low"
    equal: ['alertname', 'service']
