# Backlog #0-94 step 2: every container's log is Docker's json-file, which
# grows without bound by default; Alloy ships it to Loki, so a few rotated
# files are all Docker needs to keep.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: incident-postgres
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentdb
      # Backlog #0-78: the image's superuser is for administration only.
      # The services connect as APP_DB_USER, created without superuser
      # rights by the init script below; see docs/database-roles.md.
      # Both passwords are required, with no default: a missing one (e.g. a
      # docker/.env from before #0-78, which had POSTGRES_PASSWORD) stops
      # compose with this message instead of failing logins later.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in docker/.env (see docker/.env.example and docs/database-roles.md)}
      APP_DB_USER: incident_app
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env (it replaced POSTGRES_PASSWORD; see docs/database-roles.md)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Same script as Kubernetes (Kustomize cannot read files outside
      # k8s/base). Runs only when postgres_data is empty.
      - ../k8s/base/infrastructure/postgresql-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      # -h 127.0.0.1, not the default socket: while the init script runs, the
      # image's temporary server listens on the socket only, so a socket check
      # reports ready before incident_app exists (backlog #0-78, reproduced).
      # pg_isready does not log in, so the user name only labels the check.
      # start_period: a first start (initdb + init script) is not counted
      # against the retries.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Redis 7
  # ----------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: incident-redis
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------
  # Apache Kafka (KRaft mode - no ZooKeeper)
  # ----------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.2
    container_name: incident-kafka
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9095
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # Kafka UI: http://localhost:8090
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: incident-kafka-ui
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      kafka:
        condition: service_healthy


  # ----------------------------------------------------------
  # Kafka Exporter: exposes Kafka consumer group lag metrics
  # for Prometheus scraping.
  #
  # Metrics available at http://localhost:9308/metrics:
  #   kafka_consumer_group_lag      -- messages behind per partition
  #   kafka_consumer_group_lag_sum  -- total lag per consumer group
  #   kafka_consumer_group_members  -- number of active consumers
  #   kafka_topic_partition_offset  -- latest offset per partition
  #
  # Used by KafkaConsumerLagHigh and KafkaConsumerLagCritical alert rules.
  # ----------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: incident-kafka-exporter
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9094
      - --web.listen-address=:9308
      - --log.level=warn
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:9308/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # pgAdmin: http://localhost:5050
  # Login: admin@incident.com / admin
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: incident-pgadmin
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@incident.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # Mailpit: SMTP on 1025, web UI http://localhost:8025
  #
  # Catches every email sent in the local stack: the operator email route of
  # Alertmanager (backlog #0-16) and the platform's own mail (MAIL_HOST below).
  # MAIL_HOST defaulted to "mailhog", but no such service existed, so no email
  # was ever caught locally. MailHog is unmaintained; Mailpit is its maintained
  # successor with the same ports.
  # ----------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: incident-mailpit
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ----------------------------------------------------------
  # Heartbeat sink (dev stand-in for a dead man's switch service)
  #
  # Receives Alertmanager's Watchdog every minute and logs it
  # (docker logs incident-heartbeat-sink). A real deployment points
  # docker/secrets/deadmans-switch-url at healthchecks.io, Dead Man's Snitch
  # or a Grafana IRM heartbeat instead, which pages when the pings stop.
  # ----------------------------------------------------------
  heartbeat-sink:
    image: mendhak/http-https-echo:42
    container_name: incident-heartbeat-sink
    logging: *default-logging
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080

  # ----------------------------------------------------------
  # Alertmanager: http://localhost:9093
  #
  # Routes the platform's own alerts (docker/alertmanager.yml, backlog #0-16):
  # Watchdog to the dead man's switch, critical alerts to the operator by email,
  # everything to the ingestion-service webhook.
  #
  # REQUIRED files in docker/secrets/ (gitignored, mounted read-only):
  #   deadmans-switch-url  cp docker/deadmans-switch-url.example docker/secrets/deadmans-switch-url
  #   platform-operator-api-key  Integration API key of the platform-operator
  #                        tenant for the ingestion-service webhook, see README Step 5
  # Alertmanager reads both on every outgoing request, not once at startup.
  # ----------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: incident-alertmanager
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    depends_on:
      - mailpit
      - heartbeat-sink
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Prometheus: http://localhost:9090
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: incident-prometheus
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # logs: scrapes Loki and Alloy (#0-94 step 2); default: everything else.
    networks:
      - default
      - logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Grafana: http://localhost:3000 (this machine only)
  # Login: admin / GRAFANA_ADMIN_PASSWORD from docker/.env
  # Datasources: Prometheus (default) and Loki, provisioned from
  # docker/grafana/provisioning/datasources/
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.3
    container_name: incident-grafana
    logging: *default-logging
    restart: unless-stopped
    ports:
      # Backlog #0-94 step 2: Grafana reads every tenant's logs (Loki), so it
      # is reachable from this machine only, and its admin password has no
      # default (it was admin/admin on every interface, #0-72).
      - "127.0.0.1:3000:3000"
    environment:
      # Applied only when grafana_data is first created; for an existing volume
      # see README "Step 5" (grafana cli admin reset-admin-password).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in docker/.env (see docker/.env.example)}
      GF_SECURITY_ADMIN_USER: admin
      # Grafana reads every tenant's logs and has a route out (grafana-ui is
      # not internal, to publish its port): nothing it does not need to send
      # goes out, and no plugin is installed from its UI (#0-94 step 2).
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      # Grafana 13 downloads a set of app plugins from grafana.com at start
      # (seen: advisor, Logs/Metrics/Traces Drilldown, Pyroscope); none is
      # needed, and each would run where every tenant's logs can be read.
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DATASOURCES_DEFAULT_NAME: Prometheus
      GF_DATASOURCES_DEFAULT_TYPE: prometheus
      GF_DATASOURCES_DEFAULT_URL: http://prometheus:9090
      GF_DATASOURCES_DEFAULT_IS_DEFAULT: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    # Not on default (review of #0-94 step 2): Grafana reads every tenant's
    # logs, and from default any compromised service, kafka-ui or pgAdmin
    # could log in to it and query Loki through its datasource proxy, around
    # the logs network. logs: Loki and Prometheus (both there); grafana-ui:
    # only to publish the port on 127.0.0.1.
    networks:
      - logs
      - grafana-ui
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Log collection (backlog #0-94, step 2): docker-socket-proxy -> Alloy -> Loki,
  # read in Grafana (Explore -> Loki). Every container named incident-* is
  # collected; tenantId, requestId, userId and kafkaMessageId are structured
  # metadata of each line (docker/alloy/config.alloy). Kept 15 days
  # (docker/loki.yml). No port of the three is published, and none of them is
  # on "default": Loki and Alloy answer without authentication, so they sit on
  # the internal "logs" network with Grafana and Prometheus only (review: on
  # "default" any service, kafka-ui or pgAdmin could read every tenant's logs).
  # ----------------------------------------------------------

  # Docker API for Alloy, read-only. The socket is root on the host whether
  # mounted :ro or not (":ro" protects the file, not the API), so Alloy never
  # gets it: this proxy answers GET on /containers and /networks (Alloy's
  # discovery lists both), plus /version and /_ping, and 403 to anything else,
  # every POST (exec, stop, create) included. Reachable only on the internal
  # docker-api network, shared with Alloy alone. NOT narrowed further: GET
  # /containers also covers inspect (every container's environment, so
  # JWT_SECRET, DB_PASSWORD, the encryption keys and Grafana's password),
  # archive (a path's files) and export (the whole filesystem); whoever
  # controls Alloy can read those (README "Not done yet", #0-94). And one
  # GET that writes: attach/ws upgrades to a websocket that can feed a
  # container's stdin (checked: 101); no container here keeps stdin open, so
  # nothing reads it, but "read-only" is the proxy's rule, not a guarantee.
  # Pinned by digest as well as tag: it is the one container holding the socket.
  # The checks in .github/scripts/test-log-collection.sh fail if a write gets
  # through or the network is not internal.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: incident-docker-socket-proxy
    logging: *default-logging
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      # The image allows these by default; Alloy needs none of them.
      EVENTS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Hardened (review of #0-94 step 2): no capabilities (it binds 2375 and
    # talks to a socket, needing none), no privilege gain, a read-only root;
    # the entrypoint renders haproxy.cfg into /tmp, hence the small tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=1m
      - /run:size=1m
    # About 32 MiB in use (measured, #0-94 step 2).
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.7.8
    container_name: incident-loki
    logging: *default-logging
    restart: unless-stopped
    command:
      - '-config.file=/etc/loki/loki.yml'
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - logs
    # About 150 MiB idle (measured, #0-94 step 2); the rest is for queries. A
    # limit keeps a heavy query from starving the services on a laptop or the
    # CI runner; past it Loki restarts and LogPipelineDown says so. GOMEMLIMIT
    # makes the Go GC work to stay under it; the query limits in loki.yml
    # bound what a query asks for.
    mem_limit: 1g
    environment:
      GOMEMLIMIT: 800MiB
    # Hardened like the proxy (review of #0-94 step 2): Loki holds every
    # tenant's lines. It runs as uid 10001 and writes only to loki_data.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No healthcheck: the image is distroless (no shell, no wget). Prometheus
    # scrapes it (LogPipelineDown) and Alloy retries a push until it is ready.

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: incident-alloy
    logging: *default-logging
    restart: unless-stopped
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      # No usage report to Grafana Labs (it has no route out anyway).
      - '--disable-reporting'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read positions: a restart resumes where it stopped instead of sending
      # every container's log again.
      - alloy_data:/var/lib/alloy/data
    # About 80 MiB in use (measured, #0-94 step 2); the rest holds batches
    # while Loki is retried. GOMEMLIMIT makes the Go GC work to stay under it.
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    # Hardened like the proxy (review of #0-94 step 2): Alloy reads the Docker
    # API, so whoever takes it reads every container's environment. It runs as
    # the image's own alloy user, not root (with no capabilities, root could not
    # even write the data directory the image gives to that user), and writes
    # only to alloy_data (and /tmp). A volume an older Alloy filled as root
    # needs: docker run --rm -v docker_alloy_data:/d alpine chown -R 473:473 /d
    user: "473:473"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # logs: pushes to Loki, scraped by Prometheus; docker-api: the proxy.
    # Not on default (its HTTP API shows its config and pipeline).
    networks:
      - logs
      - docker-api
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      # No wget or curl in the image; bash's /dev/tcp asks /-/ready.
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # APPLICATION SERVICES
  # Build from source: docker compose build
  # Start all:        docker compose up -d
  #
  # Ports:
  #   auth-service        8087
  #   ingestion-service   8081
  #   incident-service    8082
  #   notification-service 8083
  #   escalation-service  8084
  #   postmortem-service  8085
  #   oncall-service      8086
  #
  # Required secrets (set in .env.example or environment):
  #   JWT_SECRET          — min 64 chars, same across all services
  #   MFA_ENCRYPTION_KEY  — 32-byte base64 (openssl rand -base64 32)
  #   SLACK_ENCRYPTION_KEY — 32-byte base64 (openssl rand -base64 32), separate from MFA_ENCRYPTION_KEY
  #   DB_PASSWORD             — password of the services' DB role (incident_app)
  #   POSTGRES_ADMIN_PASSWORD — password of the postgres superuser (administration only, backlog #0-78)
  # ==========================================================

  # ----------------------------------------------------------
  # auth-service: port 8087
  # ----------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    container_name: incident-auth-service
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-8087}:8087"
      - "${AUTH_SERVICE_MGMT_PORT:-8097}:8097"
    environment:
      SERVER_PORT: 8087
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      DB_USER: incident_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env (it replaced POSTGRES_PASSWORD; see docs/database-roles.md)}
      # JWT — shared secret across all services
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      JWT_SERVICE_TOKEN_TTL: ${JWT_SERVICE_TOKEN_TTL:-PT1H}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Kafka — audit event publishing (AuditEventPublisher/AuditEventKafkaSender)
      # Fixed: this variable was missing entirely, so Spring fell back to
      # its own default (localhost:9092) — inside this container, localhost
      # refers to the auth-service container itself, not the kafka
      # container, so every KafkaProducer.send() call blocked for the full
      # default max.block.ms (60s) waiting on cluster metadata that could
      # never arrive, before AuditEventPublisher's own catch (Exception e)
      # swallowed the resulting failure and let login complete anyway --
      # surfacing as a login that "succeeds" but takes about a minute,
      # every time, not just on first use. kafka:9094 is the INTERNAL
      # listener (see the kafka service's own KAFKA_ADVERTISED_LISTENERS),
      # meant for exactly this kind of inter-container traffic --
      # matching ingestion-service/incident-service/notification-service/
      # escalation-service/postmortem-service's own identical setting.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      # MFA
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      MFA_TOTP_ISSUER: ${MFA_TOTP_ISSUER:-IncidentPlatform}
      # Slack workspace connections (backlog #0-21) — separate key from
      # MFA_ENCRYPTION_KEY on purpose, see AesEncryptionConfig.
      SLACK_ENCRYPTION_KEY: ${SLACK_ENCRYPTION_KEY}
      # Mail (optional — invite emails)
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      INVITE_EMAIL_FROM: ${INVITE_EMAIL_FROM:-noreply@incident-platform.local}
      # Dev only (backlog #0-16, #0-42): application.yml requires SMTP auth and
      # STARTTLS, which mailpit does not offer, so no invite was ever delivered
      # locally. Overridden here for the compose stack only; a real relay keeps
      # both. Spring binds each variable to the matching spring.mail.properties key.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      # Backlog #0-16/#0-49: first admin of the reserved platform-operator tenant,
      # invited ~30 s after startup and re-invited if that invite is lost or
      # expires (OperatorTenantBootstrap, hourly check). Empty = no bootstrap.
      OPERATOR_ADMIN_EMAIL: ${OPERATOR_ADMIN_EMAIL:-}
      # App
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8087}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
              "http://localhost:8097/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # ingestion-service: port 8081
  # ----------------------------------------------------------
  ingestion-service:
    build:
      context: ..
      dockerfile: ingestion-service/Dockerfile
    container_name: incident-ingestion-service
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${INGESTION_SERVICE_PORT:-8081}:8081"
      - "${INGESTION_SERVICE_MGMT_PORT:-8091}:8091"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      JWT_SERVICE_TOKEN_TTL: ${JWT_SERVICE_TOKEN_TTL:-PT1H}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Integration API keys are checked by introspection into auth-service
      # (backlog #0-16). If auth-service is down, ingest answers 503 and the
      # sender retries, so no depends_on: ingestion starts without it.
      AUTH_SERVICE_URL: http://auth-service:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
             "http://localhost:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # incident-service: port 8082
  # ----------------------------------------------------------
  incident-service:
    build:
      context: ..
      dockerfile: incident-service/Dockerfile
    container_name: incident-incident-service
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${INCIDENT_SERVICE_PORT:-8082}:8082"
      - "${INCIDENT_SERVICE_MGMT_PORT:-8092}:8092"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      DB_USER: incident_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env (it replaced POSTGRES_PASSWORD; see docs/database-roles.md)}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      JWT_SERVICE_TOKEN_TTL: ${JWT_SERVICE_TOKEN_TTL:-PT1H}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      # Backlog #0-82 step 2: TenantStatusFilter asks auth-service each tenant's status.
      AUTH_SERVICE_URL: http://auth-service:8087
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
             "http://localhost:8092/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # notification-service: port 8083
  # ----------------------------------------------------------
  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: incident-notification-service
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8083}:8083"
      - "${NOTIFICATION_SERVICE_MGMT_PORT:-8093}:8093"
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      DB_USER: incident_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env (it replaced POSTGRES_PASSWORD; see docs/database-roles.md)}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      JWT_SERVICE_TOKEN_TTL: ${JWT_SERVICE_TOKEN_TTL:-PT1H}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      INCIDENT_SERVICE_URL: http://incident-service:8082
      ONCALL_SERVICE_URL: http://oncall-service:8086
      # Backlog #0-21/#0-30: SlackWorkspaceClient reads each tenant's Slack
      # workspace connection from auth-service — SLACK_BOT_TOKEN below was
      # removed, it's no longer a platform-wide secret held here.
      AUTH_SERVICE_URL: http://auth-service:8087
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Dev only (backlog #0-16, #0-42): see auth-service above.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-placeholder-signing-secret-not-real}
      # Dev only: mailpit catches it. The service has no default (empty means no operator email),
      # and the k8s ConfigMap ships it empty; never point a shared environment at a placeholder.
      NOTIFICATION_OPERATOR_ALERT_EMAIL: ${NOTIFICATION_OPERATOR_ALERT_EMAIL:-operator@incident-platform.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
             "http://localhost:8093/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # escalation-service: port 8084
  # ----------------------------------------------------------
  escalation-service:
    build:
      context: ..
      dockerfile: escalation-service/Dockerfile
    container_name: incident-escalation-service
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${ESCALATION_SERVICE_PORT:-8084}:8084"
      - "${ESCALATION_SERVICE_MGMT_PORT:-8094}:8094"
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      DB_USER: incident_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env (it replaced POSTGRES_PASSWORD; see docs/database-roles.md)}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      JWT_SERVICE_TOKEN_TTL: ${JWT_SERVICE_TOKEN_TTL:-PT1H}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      ONCALL_SERVICE_URL: http://oncall-service:8086
      # Backlog #0-82 step 2: TenantStatusFilter asks auth-service each tenant's status.
      AUTH_SERVICE_URL: http://auth-service:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
             "http://localhost:8094/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # postmortem-service: port 8085
  # ----------------------------------------------------------
  postmortem-service:
    build:
      context: ..
      dockerfile: postmortem-service/Dockerfile
    container_name: incident-postmortem-service
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${POSTMORTEM_SERVICE_PORT:-8085}:8085"
      - "${POSTMORTEM_SERVICE_MGMT_PORT:-8095}:8095"
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: incidentdb
      DB_USER: incident_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env (it replaced POSTGRES_PASSWORD; see docs/database-roles.md)}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      JWT_SERVICE_TOKEN_TTL: ${JWT_SERVICE_TOKEN_TTL:-PT1H}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      INCIDENT_SERVICE_URL: http://incident-service:8082
      # Backlog #0-82 step 2: TenantStatusFilter asks auth-service each tenant's status.
      AUTH_SERVICE_URL: http://auth-service:8087
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your-api-key-here}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null",
             "http://localhost:8095/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
