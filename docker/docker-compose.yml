volumes:
  postgres_data:
  redis_data:
  kafka_data:
  pgadmin_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  # Backlog #0-94 step 2: the Docker API proxy's only network. internal: no
  # route out, and no other container but Alloy joins it.
  docker-api:
    internal: true
  # Backlog #0-94 step 2 (review): Loki and Alloy, which answer without
  # authentication, with the two containers that read them (Grafana,
  # Prometheus). internal: no route out; the services are not on it.
  logs:
    internal: true
  # Grafana's port only (#0-94 step 2): a container on internal networks alone
  # cannot publish one. Nothing else joins it.
  grafana-ui:
