# Unit tests for docker/prometheus.rules.yml (backlog #0-16).
#   promtool test rules docker/prometheus.rules.test.yml
# Run in CI by the "Validate monitoring config" step.

rule_files:
  - prometheus.rules.yml

evaluation_interval: 1m

tests:
  # The Watchdog fires unconditionally, from the first evaluation.
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
              scope: platform
            exp_annotations:
              summary: "Alerting pipeline heartbeat (always firing)"
              description: "This alert is always firing. If the dead man's switch stops receiving it, Prometheus or Alertmanager is down or cannot send notifications.\n"

  # Failed notifications fire only after 5 minutes of sustained failures,
  # and not at all while the counter is flat.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="serverError"}'
        values: '0+1x20'
      - series: 'alertmanager_notifications_failed_total{integration="email",reason="other"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              integration: webhook
            exp_annotations:
              summary: "Alertmanager cannot deliver webhook notifications"
              description: "Alertmanager has been failing to send webhook notifications for at least 5 minutes. Platform alerts sent through that integration are not arriving.\n"

  # Any of the services down is critical (email route), Alertmanager itself is not
  # matched by the job regex.
  - interval: 1m
    input_series:
      - series: 'up{job="auth-service",service="auth-service"}'
        values: '0x5'
      - series: 'up{job="ingestion-service",service="ingestion-service"}'
        values: '1x5'
      - series: 'up{job="alertmanager",service="alertmanager"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PlatformServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: auth-service
              service: auth-service
            exp_annotations:
              summary: "auth-service is down"
              description: "auth-service has been unreachable for Prometheus for more than 1 minute.\n"

  # Operator admin not activated (backlog #0-49): fires after 1 hour of the
  # gauge at 1 on any replica, and not while it is 0.
  - interval: 1m
    input_series:
      - series: 'platform_operator_admin_pending{job="auth-service",instance="auth-1"}'
        values: '1x90'
      - series: 'platform_operator_admin_pending{job="auth-service",instance="auth-2"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OperatorAdminNotActivated
        exp_alerts: []
      - eval_time: 75m
        alertname: OperatorAdminNotActivated
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "The platform-operator tenant has no admin who can log in"
              description: "For more than 1 hour the operator tenant has had no active admin who accepted an invite. See the OperatorTenantBootstrap lines in the auth-service log and README Step 5.\n"

  - interval: 1m
    input_series:
      - series: 'platform_operator_admin_pending{job="auth-service",instance="auth-1"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 75m
        alertname: OperatorAdminNotActivated
        exp_alerts: []

  # Auth email delivery failing (backlog #0-52): failures and no success for
  # 30 minutes fire it; a success in the window keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="INVITE",outcome="failed"}'
        values: '0+1x90'
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="INVITE",outcome="sent"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: AuthEmailDeliveryFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: AuthEmailDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "auth-service cannot send invite or password reset emails"
              description: "Every invite and password reset email auth-service tried to send in the last 30 minutes failed, for more than 30 minutes. Check the SMTP settings and the AuthEmailScheduler lines in the auth-service log.\n"

  - interval: 1m
    input_series:
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="INVITE",outcome="failed"}'
        values: '0+1x90'
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="PASSWORD_RESET",outcome="sent"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 45m
        alertname: AuthEmailDeliveryFailing
        exp_alerts: []

  # Auth email permanently failed (backlog #0-52): fires per type and reason
  # after an increase, and resolves an hour later.
  - interval: 1m
    input_series:
      - series: 'auth_email_permanently_failed_total{job="auth-service",instance="auth-1",type="INVITE",reason="RETRY_WINDOW_EXHAUSTED"}'
        values: '0x10 1x80'
      - series: 'auth_email_permanently_failed_total{job="auth-service",instance="auth-1",type="PASSWORD_RESET",reason="TOKEN_EXPIRED"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: AuthEmailPermanentlyFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: AuthEmailPermanentlyFailed
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              type: INVITE
              reason: RETRY_WINDOW_EXHAUSTED
            exp_annotations:
              summary: "INVITE email given up without being sent (RETRY_WINDOW_EXHAUSTED)"
              description: "auth-service gave up at least one INVITE email in the last hour (RETRY_WINDOW_EXHAUSTED). The recipient never got the link. The auth-service ERROR log names the user; resend the invite, or ask the user to request a new password reset.\n"
      - eval_time: 85m
        alertname: AuthEmailPermanentlyFailed
        exp_alerts: []

  # Audit outbox backlog (backlog #0-84): fires after the oldest event has
  # waited over 10 minutes for 5 minutes, per service; resolves once sent.
  - interval: 1m
    input_series:
      - series: 'audit_outbox_oldest_pending_age_seconds{job="auth-service",instance="auth-1"}'
        values: '0x5 60+60x30 0x20'
      - series: 'audit_outbox_oldest_pending_age_seconds{job="incident-service",instance="incident-1"}'
        values: '0x60'
      # The services moved in #0-84's second step expose the same gauge.
      - series: 'audit_outbox_oldest_pending_age_seconds{job="notification-service",instance="notification-1"}'
        values: '0x60'
      - series: 'audit_outbox_oldest_pending_age_seconds{job="escalation-service",instance="escalation-1"}'
        values: '0x60'
      - series: 'audit_outbox_oldest_pending_age_seconds{job="postmortem-service",instance="postmortem-1"}'
        values: '0x5 60+60x30 0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: AuditOutboxBacklog
        exp_alerts: []
      - eval_time: 18m
        alertname: AuditOutboxBacklog
        exp_alerts: []
      - eval_time: 25m
        alertname: AuditOutboxBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: auth-service
            exp_annotations:
              summary: "auth-service audit events waiting in the outbox for over 10 minutes"
              description: "The oldest audit event in auth-service's outbox has waited 20m 0s. Nothing is lost, but the audit trail is behind until the relay sends it. Check Kafka and the service's \"Audit event not sent\" WARN lines.\n"
          - exp_labels:
              severity: critical
              scope: platform
              job: postmortem-service
            exp_annotations:
              summary: "postmortem-service audit events waiting in the outbox for over 10 minutes"
              description: "The oldest audit event in postmortem-service's outbox has waited 20m 0s. Nothing is lost, but the audit trail is behind until the relay sends it. Check Kafka and the service's \"Audit event not sent\" WARN lines.\n"
      - eval_time: 45m
        alertname: AuditOutboxBacklog
        exp_alerts: []

  # Rejected audit records (backlog #0-84): fire on the first one, resolve an
  # hour after the last.
  - interval: 1m
    input_series:
      - series: 'audit_events_rejected_total{job="incident-service",instance="incident-1",reason="constraint"}'
        values: '0x10 1x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: AuditEventsRejected
        exp_alerts: []
      - eval_time: 15m
        alertname: AuditEventsRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: incident-service
              reason: constraint
            exp_annotations:
              summary: "incident-service rejected audit events (constraint)"
              description: "incident-service could not store at least one audit event in the last hour (constraint); it is in the dead-letter topic (incidents.dead-letter, sourceTopic audit.events) and missing from the tenant's audit trail. The ERROR log \"Audit event rejected\" names it.\n"
      - eval_time: 85m
        alertname: AuditEventsRejected
        exp_alerts: []

  # Audit events written after the fact and not recorded (backlog #0-84,
  # second step): fire on the first one, per service and type; resolve an
  # hour after the last.
  - interval: 1m
    input_series:
      - series: 'audit_event_unrecorded_total{job="notification-service",instance="notification-1",event_type="NOTIFICATION_SENT"}'
        values: '0x10 1x90'
      - series: 'audit_event_unrecorded_total{job="escalation-service",instance="escalation-1",event_type="ESCALATION_FIRED"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: AuditEventUnrecorded
        exp_alerts: []
      - eval_time: 15m
        alertname: AuditEventUnrecorded
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: notification-service
              event_type: NOTIFICATION_SENT
            exp_annotations:
              summary: "notification-service could not record NOTIFICATION_SENT audit events"
              description: "notification-service failed to write at least one NOTIFICATION_SENT audit event in the last hour, after the action it records had happened; it is missing from the tenant's audit trail. The ERROR log (\"Audit event not recorded\", or \"Notification delivered but not recorded\") names the incident and holds what to reconstruct.\n"
      - eval_time: 85m
        alertname: AuditEventUnrecorded
        exp_alerts: []

  # Kafka records whose tenant a consumer refused (backlog #0-92; a missing
  # header is refused too), and records produced without a valid tenant header
  # (backlog #0-91): fire on the first
  # one, per service and reason; resolve an hour after the last. The counters
  # are registered at zero, so the series start at 0.
  - interval: 1m
    input_series:
      - series: 'kafka_records_tenant_rejected_total{job="notification-service",instance="notification-1",reason="mismatch"}'
        values: '0x10 1x90'
      - series: 'kafka_records_tenant_rejected_total{job="escalation-service",instance="escalation-1",reason="invalid"}'
        values: '0x100'
      - series: 'kafka_records_tenant_rejected_total{job="postmortem-service",instance="postmortem-1",reason="header_missing"}'
        values: '0x10 1x90'
      - series: 'kafka_records_produced_tenant_invalid_total{job="incident-service",instance="incident-1",reason="missing"}'
        values: '0x10 1x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: KafkaRecordsTenantRejected
        exp_alerts: []
      - eval_time: 15m
        alertname: KafkaRecordsTenantRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: notification-service
              reason: mismatch
            exp_annotations:
              summary: "notification-service refused Kafka records' tenant (mismatch)"
              description: "notification-service dead-lettered at least one Kafka record in the last hour because its tenant could not be trusted (mismatch). Its event was not processed. The dead-letter topic holds it; the ERROR log \"Poison pill\" (or \"Audit event rejected\") names its topic, partition and offset.\n"
          - exp_labels:
              severity: critical
              scope: platform
              job: postmortem-service
              reason: header_missing
            exp_annotations:
              summary: "postmortem-service refused Kafka records' tenant (header_missing)"
              description: "postmortem-service dead-lettered at least one Kafka record in the last hour because its tenant could not be trusted (header_missing). Its event was not processed. The dead-letter topic holds it; the ERROR log \"Poison pill\" (or \"Audit event rejected\") names its topic, partition and offset.\n"
      - eval_time: 85m
        alertname: KafkaRecordsTenantRejected
        exp_alerts: []
      - eval_time: 15m
        alertname: KafkaRecordsWithoutTenant
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              job: incident-service
              reason: missing
            exp_annotations:
              summary: "incident-service produced Kafka records without a valid tenant header (missing)"
              description: "incident-service sent at least one Kafka record in the last hour whose X-Tenant-Id header was missing. Its WARN log names the topic; the sender should build the record with TenantRecords.\n"
      - eval_time: 85m
        alertname: KafkaRecordsWithoutTenant
        exp_alerts: []

  # Kafka redelivery (backlog #0-96): a record given up on fires at once and
  # resolves an hour later; nacking for 15 minutes without a break fires the
  # stuck alert, a single nack does not. Counters are registered at zero.
  - interval: 1m
    input_series:
      - series: 'kafka_records_redelivery_gave_up_total{job="escalation-service",instance="escalation-1"}'
        values: '0x10 1x90'
      - series: 'kafka_records_redelivery_gave_up_total{job="postmortem-service",instance="postmortem-1"}'
        values: '0x100'
      - series: 'kafka_records_redelivery_requested_total{job="notification-service",instance="notification-1",reason="transient"}'
        values: '0+12x40'
      - series: 'kafka_records_redelivery_requested_total{job="incident-service",instance="incident-1",reason="transient"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: KafkaRecordRedeliveryGaveUp
        exp_alerts: []
      - eval_time: 15m
        alertname: KafkaRecordRedeliveryGaveUp
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: escalation-service
            exp_annotations:
              summary: "escalation-service gave up redelivering Kafka records"
              description: "escalation-service dead-lettered at least one Kafka record in the last hour because it was still failing after its redelivery deadline. Its event was not processed. The ERROR log \"longer than its redelivery deadline\" names its topic, partition and offset; the dead-letter topic holds it.\n"
      - eval_time: 85m
        alertname: KafkaRecordRedeliveryGaveUp
        exp_alerts: []
      - eval_time: 10m
        alertname: KafkaRecordRedeliveryStuck
        exp_alerts: []
      - eval_time: 25m
        alertname: KafkaRecordRedeliveryStuck
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              job: notification-service
              reason: transient
            exp_annotations:
              summary: "notification-service keeps reading Kafka records again (transient)"
              description: "notification-service has been nacking Kafka records for 15 minutes (transient); the records behind them wait. The WARN logs \"Transient failure processing record\" or \"could not be dead-lettered\" name the partition and the cause.\n"

  # Platform API (backlog #0-83): more than 10 tenants in an hour fires the
  # spike alert; 10 does not.
  - interval: 1m
    input_series:
      - series: 'platform_tenants_provisioned_total{job="auth-service",instance="auth-1"}'
        values: '0x10 12x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformTenantProvisioningSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformTenantProvisioningSpike
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "Unusually many tenants created through the platform API"
              description: "12 tenants were created in the last hour. Check the TENANT_PROVISIONED audit events in the platform-operator tenant: which operator, which tenants, which admin addresses.\n"

  - interval: 1m
    input_series:
      - series: 'platform_tenants_provisioned_total{job="auth-service",instance="auth-1"}'
        values: '0x10 10x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: PlatformTenantProvisioningSpike
        exp_alerts: []

  # A single refusal by either limit fires; it resolves an hour later. The
  # global limit's series carries its own tag; the rule sums both.
  - interval: 1m
    input_series:
      - series: 'platform_ratelimit_rejected_total{job="auth-service",instance="auth-1",limit="operator"}'
        values: '0x10 1x80'
      - series: 'platform_ratelimit_rejected_total{job="auth-service",instance="auth-1",limit="global"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformApiRateLimited
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformApiRateLimited
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "The platform API's rate limit was reached"
              description: "The platform API refused write operations for exceeding its per-operator or platform-wide limit in the last hour. The auth-service WARN log names the operator and the limit; check the recent TENANT_* audit events.\n"
      - eval_time: 85m
        alertname: PlatformApiRateLimited
        exp_alerts: []

  # A refusal by the platform-wide limit alone fires too.
  - interval: 1m
    input_series:
      - series: 'platform_ratelimit_rejected_total{job="auth-service",instance="auth-1",limit="global"}'
        values: '0x10 2x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: PlatformApiRateLimited
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "The platform API's rate limit was reached"
              description: "The platform API refused write operations for exceeding its per-operator or platform-wide limit in the last hour. The auth-service WARN log names the operator and the limit; check the recent TENANT_* audit events.\n"

  # A refusal because Redis could not be checked fires the high alert.
  - interval: 1m
    input_series:
      - series: 'platform_ratelimit_unavailable_total{job="auth-service",instance="auth-1"}'
        values: '0x10 3x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PlatformApiRateLimitUnavailable
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
            exp_annotations:
              summary: "Platform API write operations refused: rate limit unavailable"
              description: "auth-service could not reach Redis to check the platform API's limit in the last 15 minutes and refused tenant provisioning. Check Redis and the PlatformRateLimiter ERROR lines in the auth-service log.\n"

  # Backlog #0-88: an admin reaching the MFA reset limit fires the critical
  # alert, by either limit, and clears an hour after the refusals stop.
  - interval: 1m
    input_series:
      - series: 'auth_mfa_reset_ratelimit_rejected_total{job="auth-service",instance="auth-1",limit="admin"}'
        values: '0x10 1x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: AdminMfaResetRateLimited
        exp_alerts: []
      - eval_time: 15m
        alertname: AdminMfaResetRateLimited
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "An admin reached the MFA reset rate limit"
              description: "Admin MFA resets were refused for exceeding the per-admin or per-tenant limit in the last hour. The auth-service WARN log names the admin and the tenant; check that tenant's MFA_RESET_BY_ADMIN audit events and contact its other admins.\n"
      - eval_time: 85m
        alertname: AdminMfaResetRateLimited
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'auth_mfa_reset_ratelimit_rejected_total{job="auth-service",instance="auth-1",limit="tenant"}'
        values: '0x10 2x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: AdminMfaResetRateLimited
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "An admin reached the MFA reset rate limit"
              description: "Admin MFA resets were refused for exceeding the per-admin or per-tenant limit in the last hour. The auth-service WARN log names the admin and the tenant; check that tenant's MFA_RESET_BY_ADMIN audit events and contact its other admins.\n"

  # A refusal because Redis could not be checked fires the high alert.
  - interval: 1m
    input_series:
      - series: 'auth_mfa_reset_ratelimit_unavailable_total{job="auth-service",instance="auth-1"}'
        values: '0x10 3x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: AdminMfaResetRateLimitUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: AdminMfaResetRateLimitUnavailable
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
            exp_annotations:
              summary: "Admin MFA resets refused: rate limit unavailable"
              description: "auth-service could not reach Redis to check the MFA reset limit in the last 15 minutes and refused admin MFA resets. Check Redis and the MfaResetRateLimiter ERROR lines in the auth-service log.\n"

  # Backlog #0-82: a suspension or a resumption fires, and stops an hour later.
  - interval: 1m
    input_series:
      - series: 'platform_tenant_lifecycle_total{job="auth-service",instance="auth-1",action="suspended"}'
        values: '0x10 1x80'
      - series: 'platform_tenant_lifecycle_total{job="auth-service",instance="auth-1",action="resumed"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformTenantSuspensionChanged
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformTenantSuspensionChanged
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "A tenant was suspended or resumed"
              description: "An operator suspended a tenant, changed its suspension or resumed it in the last hour. Check the TENANT_SUSPENDED and TENANT_RESUMED audit events in the platform-operator tenant (who, which tenant, mode, reason and note) and confirm it was expected.\n"
      - eval_time: 85m
        alertname: PlatformTenantSuspensionChanged
        exp_alerts: []

  # Backlog #0-82: a lookup of a tenant without a tenants row fires; none does not.
  - interval: 1m
    input_series:
      - series: 'platform_tenant_status_missing_total{job="auth-service",instance="auth-1"}'
        values: '0x10 3x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformTenantStatusRowMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformTenantStatusRowMissing
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
            exp_annotations:
              summary: "A tenant has no row in the tenants table"
              description: "auth-service checked the status of a tenant without a tenants row in the last 15 minutes; it has full access and cannot be suspended. Find it in the auth-service WARN log (\"Tenant has no row in tenants\") and insert its row.\n"

  # Backlog #0-82 step 2: a service that keeps failing to read tenant status
  # fires after 5 minutes, per service and reason; another client's fallbacks
  # do not, and neither does a rejected token, which is its own critical alert,
  # firing at once.
  - interval: 1m
    input_series:
      - series: 'service_client_fallback_total{job="incident-service",instance="incident-1",client="tenant-status",target="auth-service",reason="unreachable"}'
        values: '0x5 1+1x40'
      - series: 'service_client_fallback_total{job="notification-service",instance="notification-1",client="oncall",target="oncall-service",reason="unreachable"}'
        values: '0x5 1+1x40'
      - series: 'service_client_fallback_total{job="oncall-service",instance="oncall-1",client="tenant-status",target="auth-service",reason="auth"}'
        values: '0x5 1+1x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: TenantStatusLookupFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantStatusLookupFailing
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              job: incident-service
              reason: unreachable
            exp_annotations:
              summary: "incident-service cannot read tenant status from auth-service"
              description: "incident-service failed to read tenant status from auth-service (reason unreachable) for over 5 minutes. It keeps each tenant's last known status; a tenant it never saw gets full access there until auth-service answers. Check auth-service's health and the service's WARN log (\"Tenant status lookup failed\").\n"
      - eval_time: 4m
        alertname: TenantStatusLookupRejected
        exp_alerts: []
      - eval_time: 7m
        alertname: TenantStatusLookupRejected
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: oncall-service
            exp_annotations:
              summary: "auth-service rejects oncall-service's tenant status lookups"
              description: "auth-service answered 401/403 to oncall-service's tenant status lookups: its service token is not accepted (JWT secret or audience). New suspensions are not enforced there until it is fixed. See the service's ERROR log (\"rejected the service token from client tenant-status\").\n"

  # Backlog #0-82 step 2: a few untracked sessions (clients closing during
  # CONNECT) do not fire; a steady stream does.
  - interval: 1m
    input_series:
      - series: 'websocket_sessions_unbound_total{job="incident-service",instance="incident-1"}'
        values: '0x5 1+1x30'
      - series: 'websocket_sessions_unbound_total{job="incident-service",instance="incident-2"}'
        values: '0x40 1'
    alert_rule_test:
      - eval_time: 7m
        alertname: WebSocketSessionUntracked
        exp_alerts: []
      - eval_time: 15m
        alertname: WebSocketSessionUntracked
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              job: incident-service
            exp_annotations:
              summary: "incident-service cannot close suspended tenants' WebSocket sessions"
              description: "incident-service authenticated WebSocket sessions it does not track in the last 15 minutes: a suspension does not close them. Check the WARN log (\"Authenticated WebSocket session not tracked\") and whether the WebSocket transport or a proxy changed the session id.\n"

  # Backlog #0-82 step 2: skipped puts in the tenant-status cache for 15 minutes
  # fire; another cache's do not.
  - interval: 1m
    input_series:
      - series: 'cache_puts_skipped_total{job="oncall-service",instance="oncall-1",cache="tenant-status"}'
        values: '0x5 1+1x40'
      - series: 'cache_puts_skipped_total{job="notification-service",instance="notification-1",cache="slack-workspace"}'
        values: '0x5 1+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: TenantStatusCacheFull
        exp_alerts: []
      - eval_time: 25m
        alertname: TenantStatusCacheFull
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              job: oncall-service
            exp_annotations:
              summary: "oncall-service's tenant status cache is full"
              description: "oncall-service could not cache some tenants' status for 15 minutes: more than 10000 tenants active on one instance, or many known suspensions. Their requests each call auth-service. Raise AuthServiceTenantStatusProvider.MAX_CACHED_TENANTS or move to the generic cache (backlog #0-33).\n"

  # Backlog #0-90: one MFA recovery request fires, and stops an hour later;
  # the other outcomes of the same counter do not.
  - interval: 1m
    input_series:
      - series: 'platform_mfa_recovery_total{job="auth-service",instance="auth-1",outcome="requested"}'
        values: '0x10 1x80'
      - series: 'platform_mfa_recovery_total{job="auth-service",instance="auth-1",outcome="executed"}'
        values: '0x10 5x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformMfaRecoveryRequested
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformMfaRecoveryRequested
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "An MFA recovery of a customer tenant's only admin was requested"
              description: "An operator asked the platform to reset a customer admin's MFA and password in the last hour; it runs after the waiting period unless cancelled. Check the MFA_RECOVERY_REQUESTED audit events in the platform-operator tenant (who asked, how the person was verified) and cancel through the platform API if nobody expected it.\n"
      - eval_time: 85m
        alertname: PlatformMfaRecoveryRequested
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformMfaRecoveryCancelledByAccount
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'platform_mfa_recovery_total{job="auth-service",instance="auth-1",outcome="cancelled_by_account"}'
        values: '0x10 1x80'
      - series: 'platform_mfa_recovery_total{job="auth-service",instance="auth-1",outcome="cancelled_by_operator"}'
        values: '0x10 3x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: PlatformMfaRecoveryCancelledByAccount
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "An account cancelled the MFA recovery requested for it"
              description: "A customer admin cancelled, from its notice, an MFA recovery an operator had requested. Find the MFA_RECOVERY_CANCELLED event in the platform-operator tenant, then review how the request was verified with the operator who made it.\n"
      - eval_time: 15m
        alertname: PlatformMfaRecoveryRequested
        exp_alerts: []

  # Review: an expired request (its notice never sent) fires, high.
  - interval: 1m
    input_series:
      - series: 'platform_mfa_recovery_total{job="auth-service",instance="auth-1",outcome="expired"}'
        values: '0x10 1x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: PlatformMfaRecoveryExpired
        exp_alerts: []
      - eval_time: 15m
        alertname: PlatformMfaRecoveryExpired
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
            exp_annotations:
              summary: "An MFA recovery request expired: its notice was never sent"
              description: "An MFA recovery request expired because the account's notice could not be emailed in time. Check AuthEmailPermanentlyFailed and SMTP, then ask for the recovery again (MFA_RECOVERY_EXPIRED in the platform-operator tenant names the tenant and user).\n"

  # Security review: a cancellation on recheck fires; the job-failing alert
  # needs failures for 15 minutes, so a single one does not page.
  - interval: 1m
    input_series:
      - series: 'platform_mfa_recovery_total{job="auth-service",instance="auth-1",outcome="cancelled_on_recheck"}'
        values: '0x10 1x80'
      - series: 'platform_mfa_recovery_failures_total{job="auth-service",instance="auth-1"}'
        values: '0x10 1x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: PlatformMfaRecoveryCancelledOnRecheck
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "An MFA recovery was cancelled when it was due to run"
              description: "An MFA recovery no longer applied when its waiting period ended and was cancelled. The MFA_RECOVERY_CANCELLED event in the platform-operator tenant gives the reason (OTHER_ADMIN_EXISTS, NO_LONGER_APPLICABLE, OPERATOR_NO_LONGER_ADMIN); for a new admin, ask the customer through the verified channel whether they know it.\n"
      - eval_time: 20m
        alertname: PlatformMfaRecoveryJobFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'platform_mfa_recovery_failures_total{job="auth-service",instance="auth-1"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: PlatformMfaRecoveryJobFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: PlatformMfaRecoveryJobFailing
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
            exp_annotations:
              summary: "MFA recovery requests keep failing in the scheduler"
              description: "auth-service's MfaRecoveryScheduler failed on MFA recovery requests for the last 15 minutes. Its ERROR log \"MFA recovery: could not\" names the request and the cause.\n"
