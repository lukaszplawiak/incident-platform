# Unit tests for docker/prometheus.rules.yml (backlog #0-16).
#   promtool test rules docker/prometheus.rules.test.yml
# Run in CI by the "Validate monitoring config" step.

rule_files:
  - prometheus.rules.yml

evaluation_interval: 1m

tests:
  # The Watchdog fires unconditionally, from the first evaluation.
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
              scope: platform
            exp_annotations:
              summary: "Alerting pipeline heartbeat (always firing)"
              description: "This alert is always firing. If the dead man's switch stops receiving it, Prometheus or Alertmanager is down or cannot send notifications.\n"

  # Failed notifications fire only after 5 minutes of sustained failures,
  # and not at all while the counter is flat.
  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="serverError"}'
        values: '0+1x20'
      - series: 'alertmanager_notifications_failed_total{integration="email",reason="other"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              integration: webhook
            exp_annotations:
              summary: "Alertmanager cannot deliver webhook notifications"
              description: "Alertmanager has been failing to send webhook notifications for at least 5 minutes. Platform alerts sent through that integration are not arriving.\n"

  # Any of the services down is critical (email route), Alertmanager itself is not
  # matched by the job regex.
  - interval: 1m
    input_series:
      - series: 'up{job="auth-service",service="auth-service"}'
        values: '0x5'
      - series: 'up{job="ingestion-service",service="ingestion-service"}'
        values: '1x5'
      - series: 'up{job="alertmanager",service="alertmanager"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: PlatformServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
              job: auth-service
              service: auth-service
            exp_annotations:
              summary: "auth-service is down"
              description: "auth-service has been unreachable for Prometheus for more than 1 minute.\n"

  # Operator admin not activated (backlog #0-49): fires after 1 hour of the
  # gauge at 1 on any replica, and not while it is 0.
  - interval: 1m
    input_series:
      - series: 'platform_operator_admin_pending{job="auth-service",instance="auth-1"}'
        values: '1x90'
      - series: 'platform_operator_admin_pending{job="auth-service",instance="auth-2"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: OperatorAdminNotActivated
        exp_alerts: []
      - eval_time: 75m
        alertname: OperatorAdminNotActivated
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "The platform-operator tenant has no admin who can log in"
              description: "For more than 1 hour the operator tenant has had no active admin who accepted an invite. See the OperatorTenantBootstrap lines in the auth-service log and README Step 5.\n"

  - interval: 1m
    input_series:
      - series: 'platform_operator_admin_pending{job="auth-service",instance="auth-1"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 75m
        alertname: OperatorAdminNotActivated
        exp_alerts: []

  # Auth email delivery failing (backlog #0-52): failures and no success for
  # 30 minutes fire it; a success in the window keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="INVITE",outcome="failed"}'
        values: '0+1x90'
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="INVITE",outcome="sent"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: AuthEmailDeliveryFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: AuthEmailDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              scope: platform
            exp_annotations:
              summary: "auth-service cannot send invite or password reset emails"
              description: "Every invite and password reset email auth-service tried to send in the last 30 minutes failed, for more than 30 minutes. Check the SMTP settings and the AuthEmailScheduler lines in the auth-service log.\n"

  - interval: 1m
    input_series:
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="INVITE",outcome="failed"}'
        values: '0+1x90'
      - series: 'auth_email_send_total{job="auth-service",instance="auth-1",type="PASSWORD_RESET",outcome="sent"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 45m
        alertname: AuthEmailDeliveryFailing
        exp_alerts: []

  # Auth email permanently failed (backlog #0-52): fires per type and reason
  # after an increase, and resolves an hour later.
  - interval: 1m
    input_series:
      - series: 'auth_email_permanently_failed_total{job="auth-service",instance="auth-1",type="INVITE",reason="RETRY_WINDOW_EXHAUSTED"}'
        values: '0x10 1x80'
      - series: 'auth_email_permanently_failed_total{job="auth-service",instance="auth-1",type="PASSWORD_RESET",reason="TOKEN_EXPIRED"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: AuthEmailPermanentlyFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: AuthEmailPermanentlyFailed
        exp_alerts:
          - exp_labels:
              severity: high
              scope: platform
              type: INVITE
              reason: RETRY_WINDOW_EXHAUSTED
            exp_annotations:
              summary: "INVITE email given up without being sent (RETRY_WINDOW_EXHAUSTED)"
              description: "auth-service gave up at least one INVITE email in the last hour (RETRY_WINDOW_EXHAUSTED). The recipient never got the link. The auth-service ERROR log names the user; resend the invite, or ask the user to request a new password reset.\n"
      - eval_time: 85m
        alertname: AuthEmailPermanentlyFailed
        exp_alerts: []
