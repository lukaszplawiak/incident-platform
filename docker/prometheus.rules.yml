# Prometheus alerting rules for Incident Platform
#
# Every rule here is about the platform ITSELF, so every rule carries
# scope: platform. Alertmanager routes on that label (docker/alertmanager.yml,
# backlog #0-16): Watchdog goes to an external dead man's switch, critical
# alerts go to the operator by email outside the platform AND to the platform,
# everything else only to the platform. Tenants monitor their own systems with
# their own Prometheus/Alertmanager and an Integration API key of their tenant;
# those alerts never pass through this file.
#
# Which tenant a platform alert belongs to is NOT decided by a label.
# ingestion-service takes the tenant of the authenticated caller, i.e. the tenant
# of the Integration API key Alertmanager sends (the reserved operator tenant).
# A tenantId label, where a metric carries one (TenantRateLimitExceeded), is only
# copied into the alert's metadata as an identifier.
# Fixed (backlog #0-16): these rules used to carry tenantId: system to "match" the
# tenant in Alertmanager's 30-day service token; that token and that tenant are gone.
#
# Alert severity must match IncidentSeverity enum:
# CRITICAL, HIGH, MEDIUM, LOW (case-insensitive in normalizer)

groups:

  # ────────────────────────────────────────────────────────────────
  # Meta-monitoring (backlog #0-16) -- is the alerting path itself alive?
  # ────────────────────────────────────────────────────────────────
  - name: meta
    rules:

      - alert: Watchdog
        # Always firing, on purpose. Alertmanager sends it to an external
        # dead man's switch (docker/alertmanager.yml, route "deadmans-switch")
        # every minute; the external service pages the operator when the pings
        # STOP. That is the only signal that survives Prometheus, Alertmanager
        # or the host being down -- nothing inside this stack can report its
        # own death. Same rule as kube-prometheus ships.
        expr: vector(1)
        labels:
          # Never reaches ingestion-service (the Watchdog route is first and has no
          # continue), so it does not need an IncidentSeverity value.
          severity: none
          scope: platform
        annotations:
          summary: "Alerting pipeline heartbeat (always firing)"
          description: >
            This alert is always firing. If the dead man's switch stops receiving
            it, Prometheus or Alertmanager is down or cannot send notifications.

      - alert: AlertmanagerNotificationsFailing
        # Alertmanager cannot deliver to one of its receivers (e.g. ingestion-service
        # rejects or cannot be reached). Routed ONLY to the operator email, never to
        # the receiver that may be the one failing.
        expr: |
          sum by (integration) (
            increase(alertmanager_notifications_failed_total[10m])
          ) > 0
        for: 5m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "Alertmanager cannot deliver {{ $labels.integration }} notifications"
          description: >
            Alertmanager has been failing to send {{ $labels.integration }}
            notifications for at least 5 minutes. Platform alerts sent through that
            integration are not arriving.

  # ────────────────────────────────────────────────────────────────
  # Infrastructure alerts
  # ────────────────────────────────────────────────────────────────
  - name: infrastructure
    rules:

      - alert: HighCpuUsage
        # Fire when CPU usage > 90% for 5 minutes
        expr: |
          100 - (avg by(instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          ) * 100) > 90
        for: 5m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: >
            CPU usage on {{ $labels.instance }} has been above 90%
            for more than 5 minutes. Current value: {{ $value | printf "%.1f" }}%.

      - alert: HighMemoryUsage
        # Fire when available memory < 10% for 5 minutes
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: >
            Available memory on {{ $labels.instance }} is below 10%.
            Available: {{ $value | printf "%.1f" }}%.

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) * 100 < 15
        for: 10m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: >
            Disk usage on {{ $labels.instance }} ({{ $labels.mountpoint }})
            is above 85%. Available: {{ $value | printf "%.1f" }}%.

  # ────────────────────────────────────────────────────────────────
  # Application alerts — ingestion-service
  # ────────────────────────────────────────────────────────────────
  - name: ingestion
    rules:

      - alert: TenantRateLimitExceeded
        # Fire when a tenant is being rate-limited at > 10 req/s for 2 minutes
        expr: |
          rate(rate_limit_tenant_rejected_total[5m]) > 10
        for: 2m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "Tenant {{ $labels.tenantId }} is being rate limited"
          description: >
            Tenant {{ $labels.tenantId }} has had more than 10 requests/sec
            rejected by the rate limiter in the last 5 minutes.
            Possible alert flood or abuse. Rejected count: {{ $value | printf "%.0f" }}/s.

      - alert: IpRateLimitExceeded
        # Fire when an IP is being aggressively rate-limited > 20 req/s
        expr: |
          rate(rate_limit_ip_rejected_total[5m]) > 20
        for: 1m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "IP {{ $labels.clientIp }} is aggressively rate limited"
          description: >
            IP {{ $labels.clientIp }} has had more than 20 requests/sec rejected.
            Possible DDoS attempt. Rejected count: {{ $value | printf "%.0f" }}/s.

      - alert: AlertIngestionErrorRateHigh
        # Fire when > 5% of ingestion requests fail
        expr: |
          rate(http_server_requests_seconds_count{
            uri=~"/api/v1/alerts/.*",
            status=~"5.."
          }[5m])
          /
          rate(http_server_requests_seconds_count{
            uri=~"/api/v1/alerts/.*"
          }[5m]) > 0.05
        for: 3m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "High error rate on alert ingestion endpoint"
          description: >
            More than 5% of alert ingestion requests are failing.
            Current error rate: {{ $value | printf "%.1f" }}%.

  # ────────────────────────────────────────────────────────────────
  # Application alerts — all services
  # ────────────────────────────────────────────────────────────────
  - name: services
    rules:

      - alert: PlatformServiceDown
        # Any of the 7 services unreachable for Prometheus. Replaces the former
        # IncidentServiceDown (backlog #0-16): ingestion-service or auth-service
        # being down is exactly when the platform webhook cannot deliver, so every
        # service needs the out-of-band email route that critical alerts get.
        expr: |
          up{job=~".*-service"} == 0
        for: 1m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.service }} is down"
          description: >
            {{ $labels.service }} has been unreachable for Prometheus for more
            than 1 minute.

      - alert: OperatorAdminNotActivated
        # Backlog #0-49: auth-service's OperatorTenantBootstrap reports 1 while the
        # platform-operator tenant has no admin who can log in (invite lost or
        # expired and being reissued, or users a human has to fix). The gauge
        # exists only when OPERATOR_ADMIN_EMAIL is set; every replica refreshes
        # it from the database every 5 min (not only the one running the
        # reconcile), so max() reflects the real state. Critical, so it reaches the operator by email
        # (Alertmanager's own SMTP, not auth-service's mail settings).
        expr: |
          max(platform_operator_admin_pending) == 1
        for: 1h
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "The platform-operator tenant has no admin who can log in"
          description: >
            For more than 1 hour the operator tenant has had no active admin who
            accepted an invite. See the OperatorTenantBootstrap lines in the
            auth-service log and README Step 5.

      - alert: AuthEmailDeliveryFailing
        # Backlog #0-52: auth-service's invite and password-reset emails have
        # been failing for 30 minutes with not one succeeding: SMTP is down or
        # misconfigured. Retries continue until each request's deadline (a
        # reset 15 minutes, an invite 7 days after it was requested), so this is the early
        # warning; AuthEmailPermanentlyFailed reports each email actually lost.
        # At low volume one address the SMTP server keeps rejecting also fires
        # it — the auth-service WARN lines name the address. Telling the two
        # apart is backlog #0-55. Critical, so it
        # reaches the operator by Alertmanager's own email, which does not
        # depend on auth-service's mail settings. Counters are pre-registered
        # at 0, and "unless" (not "== 0") keeps the rule true if the "sent"
        # series is missing.
        expr: |
          sum(increase(auth_email_send_total{outcome="failed"}[30m])) > 0
          unless
          sum(increase(auth_email_send_total{outcome="sent"}[30m])) > 0
        for: 30m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "auth-service cannot send invite or password reset emails"
          description: >
            Every invite and password reset email auth-service tried to send in
            the last 30 minutes failed, for more than 30 minutes. Check the SMTP
            settings and the AuthEmailScheduler lines in the auth-service log.

      - alert: AuthEmailPermanentlyFailed
        # Backlog #0-52: an invite or password reset email was given up without
        # being sent: its deadline (7 days for an invite, 15 minutes for a reset)
        # passed while SMTP kept failing (reason RETRY_WINDOW_EXHAUSTED) or before
        # it could be tried at all (DEADLINE_PASSED). The user did not get the
        # link: an admin resends the invite, or the user requests a new reset. A
        # counter, so the alert fires on the event, not on rows the outbox purge
        # later removes. Resolves by itself an hour after the last one.
        expr: |
          sum by (type, reason) (
            increase(auth_email_permanently_failed_total[1h])
          ) > 0
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "{{ $labels.type }} email given up without being sent ({{ $labels.reason }})"
          description: >
            auth-service gave up at least one {{ $labels.type }} email in the
            last hour ({{ $labels.reason }}). The recipient never got the link.
            The auth-service ERROR log names the user; resend the invite, or ask
            the user to request a new password reset.

      - alert: AuditOutboxBacklog
        # Backlog #0-84: services write audit events to their own outbox table,
        # in the transaction of the action, and a relay sends them to Kafka,
        # retrying until Kafka acknowledges. Nothing is dropped any more, but an
        # event waiting long means the trail is behind: Kafka down, a row Kafka
        # refuses, or the relay not running. The gauge is read from the table
        # when Prometheus scrapes, on every replica, not by the relay (found in
        # review: a relay that stopped froze a gauge it refreshed itself), so a
        # stopped relay, or a break-glass command's event left for the service,
        # shows as a growing age. A service that is down has no gauge at all:
        # PlatformServiceDown covers it. 10 minutes is far beyond normal
        # (seconds). Critical: until it clears, recent actions (logins, MFA
        # resets, API keys) are missing from their tenants' audit trail, and an
        # operator should know by email.
        expr: |
          max by (job) (audit_outbox_oldest_pending_age_seconds) > 600
        for: 5m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.job }} audit events waiting in the outbox for over 10 minutes"
          description: >
            The oldest audit event in {{ $labels.job }}'s outbox has waited
            {{ $value | humanizeDuration }}. Nothing is lost, but the audit
            trail is behind until the relay sends it. Check Kafka and the
            service's "Audit event not sent" WARN lines.

      - alert: AuditEventsRejected
        # Backlog #0-84: incident-service's audit consumer could not store a
        # record (unreadable, or a constraint other than its idempotency keys)
        # and sent it to the dead-letter topic. The producer's outbox counted
        # it as delivered, so AuditOutboxBacklog never sees it: without this
        # alert the event would be missing from the tenant's trail unnoticed
        # (found in review). Critical, as AuditOutboxBacklog: a gap in the
        # audit trail. Resolves by itself an hour after the last one.
        expr: |
          sum by (job, reason) (
            increase(audit_events_rejected_total[1h])
          ) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.job }} rejected audit events ({{ $labels.reason }})"
          description: >
            {{ $labels.job }} could not store at least one audit event in the
            last hour ({{ $labels.reason }}); it is in the dead-letter topic
            (incidents.dead-letter, sourceTopic audit.events) and missing from
            the tenant's audit trail. The ERROR log "Audit event rejected"
            names it.

      - alert: AuditEventUnrecorded
        # Backlog #0-84 (second step): notification- and escalation-service
        # write an audit event after the fact for an action that cannot be
        # undone (a notification delivered, an escalation fired), so a failure
        # to write it is counted rather than thrown: thrown, it would record a
        # delivered notification as failed, or count a failed attempt against
        # an escalation that happened. The event is then missing from the
        # tenant's audit trail (and, for a notification, from
        # notification_log). Critical, as AuditEventsRejected: a gap in the
        # audit trail. Resolves by itself an hour after the last one. The
        # counter is registered at zero for every event type at startup
        # (UnrecordedAuditEvents): a series that began at 1 would hide its
        # first failure from increase().
        expr: |
          sum by (job, event_type) (
            increase(audit_event_unrecorded_total[1h])
          ) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.job }} could not record {{ $labels.event_type }} audit events"
          description: >
            {{ $labels.job }} failed to write at least one {{ $labels.event_type }}
            audit event in the last hour, after the action it records had
            happened; it is missing from the tenant's audit trail. The ERROR
            log ("Audit event not recorded", or "Notification delivered but not
            recorded") names the incident and holds what to reconstruct.

      - alert: KafkaRecordsTenantRejected
        # Backlog #0-92: a consumer refused a record's tenant (no valid tenant
        # in the payload, a missing or invalid X-Tenant-Id header, or a header
        # naming another tenant than the payload) and dead-lettered it. No platform
        # sender builds such a record (TenantRecords), so it is a forged record
        # (Kafka has no ACLs yet: #0-66) or a sender's bug, and the event it
        # carried was not processed: a notification, an escalation or an audit
        # entry is missing. Critical. Resolves an hour after the last one.
        expr: |
          sum by (job, reason) (
            increase(kafka_records_tenant_rejected_total[1h])
          ) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.job }} refused Kafka records' tenant ({{ $labels.reason }})"
          description: >
            {{ $labels.job }} dead-lettered at least one Kafka record in the last
            hour because its tenant could not be trusted ({{ $labels.reason }}).
            Its event was not processed. The dead-letter topic holds it; the
            ERROR log "Poison pill" (or "Audit event rejected") names its topic,
            partition and offset.

      - alert: KafkaRecordsWithoutTenant
        # Backlog #0-91: a service produced a record without a valid
        # X-Tenant-Id header (TenantKafkaProducerInterceptor counts, never
        # writes): a sender that does not build its records through
        # TenantRecords. Its consumer refuses such a record too, missing or
        # invalid header alike, and dead-letters it (the critical alert above);
        # this one names the service that produced it. High, as the event's
        # loss is already reported critical there. A dead-letter record marked
        # as tenant-less (TenantRecords.withoutTenant) is not counted.
        expr: |
          sum by (job, reason) (
            increase(kafka_records_produced_tenant_invalid_total[1h])
          ) > 0
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "{{ $labels.job }} produced Kafka records without a valid tenant header ({{ $labels.reason }})"
          description: >
            {{ $labels.job }} sent at least one Kafka record in the last hour
            whose X-Tenant-Id header was {{ $labels.reason }}. Its WARN log names
            the topic; the sender should build the record with TenantRecords.

      - alert: KafkaRecordRedeliveryGaveUp
        # Backlog #0-96: a consumed record kept failing "transiently" (the
        # database, a timeout, a version race) for longer than its redelivery
        # deadline (kafka.consumer.redelivery-deadline, 30 min) and was
        # dead-lettered instead of read again, so it no longer holds its
        # partition. Its event was not processed: a notification, an
        # escalation, a postmortem or an audit entry is missing until someone
        # replays it (#0-97). Critical. Resolves an hour after the last one.
        # An audit record given up on raises AuditEventsRejected (reason
        # gave_up) too, on purpose: that one says the audit trail has a gap,
        # this one that a partition's record was let go.
        expr: |
          sum by (job) (
            increase(kafka_records_redelivery_gave_up_total[1h])
          ) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "{{ $labels.job }} gave up redelivering Kafka records"
          description: >
            {{ $labels.job }} dead-lettered at least one Kafka record in the last
            hour because it was still failing after its redelivery deadline. Its
            event was not processed. The ERROR log "longer than its redelivery
            deadline" names its topic, partition and offset; the dead-letter
            topic holds it.

      - alert: KafkaRecordRedeliveryStuck
        # Backlog #0-96: a consumer has been nacking records for 15 minutes
        # without a break: a record at a partition's head keeps failing (the
        # database down, or the record's dead-letter copy not stored), and
        # every record behind it, of every tenant on that partition, waits. The
        # consumer-lag alerts show the backlog; this one names the cause. High.
        expr: |
          sum by (job, reason) (
            increase(kafka_records_redelivery_requested_total[5m])
          ) > 0
        for: 15m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "{{ $labels.job }} keeps reading Kafka records again ({{ $labels.reason }})"
          description: >
            {{ $labels.job }} has been nacking Kafka records for 15 minutes
            ({{ $labels.reason }}); the records behind them wait. The WARN logs
            "Transient failure processing record" or "could not be dead-lettered"
            name the partition and the cause.

      - alert: PlatformTenantProvisioningSpike
        # Backlog #0-83: more tenants created through the platform API in an
        # hour than onboarding normally needs. A taken-over operator session can
        # create tenants (and send invite emails) below the per-operator limit;
        # this is how it gets noticed. Critical, so it reaches the operator by
        # email outside the platform: an attacker acting as an operator could
        # otherwise resolve the incident in the operator tenant. Raise the
        # threshold for a planned bulk onboarding.
        expr: |
          sum(increase(platform_tenants_provisioned_total[1h])) > 10
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "Unusually many tenants created through the platform API"
          description: >
            {{ $value | printf "%.0f" }} tenants were created in the last hour.
            Check the TENANT_PROVISIONED audit events in the platform-operator
            tenant: which operator, which tenants, which admin addresses.

      - alert: PlatformApiRateLimited
        # Backlog #0-83: the platform API refused a write by its per-operator
        # limit (platform.rate-limit.operations-per-hour) or its platform-wide
        # one (global-operations-per-hour); the counter's `limit` tag says
        # which. Either a script went wrong or accounts are being abused.
        # Critical for the same reason as PlatformTenantProvisioningSpike.
        expr: |
          sum(increase(platform_ratelimit_rejected_total[1h])) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "The platform API's rate limit was reached"
          description: >
            The platform API refused write operations for exceeding its
            per-operator or platform-wide limit in the last hour. The
            auth-service WARN log names the operator and the limit; check the
            recent TENANT_* audit events.

      - alert: PlatformApiRateLimitUnavailable
        # Backlog #0-83: the platform API's limit could not be checked in Redis,
        # so its write operations were refused (fail-closed, 503). Tenant
        # onboarding is blocked until Redis is reachable from auth-service.
        expr: |
          sum(increase(platform_ratelimit_unavailable_total[15m])) > 0
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "Platform API write operations refused: rate limit unavailable"
          description: >
            auth-service could not reach Redis to check the platform API's
            limit in the last 15 minutes and refused tenant provisioning. Check
            Redis and the PlatformRateLimiter ERROR lines in the auth-service log.

      - alert: AdminMfaResetRateLimited
        # Backlog #0-88: an admin's MFA resets of other users were refused by
        # the per-admin or per-tenant limit (mfa-reset.rate-limit.*); the
        # counter's `limit` tag says which. Mass-resetting a tenant's MFA is
        # what a taken-over or rogue admin account would do. Content-free: no
        # tenant label; the auth-service WARN log names the admin and tenant.
        # Critical, so it reaches the operator by email, outside the platform.
        expr: |
          sum(increase(auth_mfa_reset_ratelimit_rejected_total[1h])) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "An admin reached the MFA reset rate limit"
          description: >
            Admin MFA resets were refused for exceeding the per-admin or
            per-tenant limit in the last hour. The auth-service WARN log names
            the admin and the tenant; check that tenant's MFA_RESET_BY_ADMIN
            audit events and contact its other admins.

      - alert: AdminMfaResetRateLimitUnavailable
        # Backlog #0-88: the MFA reset limit could not be checked in Redis, so
        # admin MFA resets were refused (fail-closed, 503) until Redis is
        # reachable from auth-service.
        expr: |
          sum(increase(auth_mfa_reset_ratelimit_unavailable_total[15m])) > 0
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "Admin MFA resets refused: rate limit unavailable"
          description: >
            auth-service could not reach Redis to check the MFA reset limit in
            the last 15 minutes and refused admin MFA resets. Check Redis and
            the MfaResetRateLimiter ERROR lines in the auth-service log.

      - alert: PlatformMfaRecoveryRequested
        # Backlog #0-90: an operator asked to reset the MFA of a customer
        # tenant's only admin, which runs after the waiting period (72 h)
        # unless cancelled. Rare and powerful, so every request is announced:
        # with several operators this is a second pair of eyes, and for a
        # taken-over operator session the way it gets noticed in time. Critical,
        # so it reaches the operator by email outside the platform.
        # Content-free: no tenant label; the WARN log and the
        # MFA_RECOVERY_REQUESTED audit event name tenant, user and operator.
        expr: |
          sum(increase(platform_mfa_recovery_total{outcome="requested"}[1h])) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "An MFA recovery of a customer tenant's only admin was requested"
          description: >
            An operator asked the platform to reset a customer admin's MFA and
            password in the last hour; it runs after the waiting period unless
            cancelled. Check the MFA_RECOVERY_REQUESTED audit events in the
            platform-operator tenant (who asked, how the person was verified)
            and cancel through the platform API if nobody expected it.

      - alert: PlatformMfaRecoveryCancelledByAccount
        # Backlog #0-90: the account an MFA recovery was for cancelled it from
        # its notice. Either its owner did not ask for the recovery (the
        # operator may have been deceived, or the operator account misused) or
        # the owner got back in another way. Either way an operator must find
        # out which. Critical, content-free, like the alert above.
        expr: |
          sum(increase(platform_mfa_recovery_total{outcome="cancelled_by_account"}[1h])) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "An account cancelled the MFA recovery requested for it"
          description: >
            A customer admin cancelled, from its notice, an MFA recovery an
            operator had requested. Find the MFA_RECOVERY_CANCELLED event in the
            platform-operator tenant, then review how the request was verified
            with the operator who made it.

      - alert: PlatformMfaRecoveryCancelledOnRecheck
        # Backlog #0-90 (security review): when its waiting period ended, an
        # MFA recovery no longer applied and was cancelled: the tenant had
        # gained another admin, the user lost the admin role or the factor, or
        # the operator who asked is no longer an operator admin. A second admin
        # appearing during the wait may be whoever holds the locked-out
        # admin's session, so an operator looks at every such case. Critical,
        # content-free.
        expr: |
          sum(increase(platform_mfa_recovery_total{outcome="cancelled_on_recheck"}[1h])) > 0
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "An MFA recovery was cancelled when it was due to run"
          description: >
            An MFA recovery no longer applied when its waiting period ended and
            was cancelled. The MFA_RECOVERY_CANCELLED event in the
            platform-operator tenant gives the reason (OTHER_ADMIN_EXISTS,
            NO_LONGER_APPLICABLE, OPERATOR_NO_LONGER_ADMIN); for a new admin,
            ask the customer through the verified channel whether they know it.

      - alert: PlatformMfaRecoveryExpired
        # Backlog #0-90 (review): an MFA recovery request expired because its
        # notice could not be sent to the account within the security-notice
        # deadline (24 h or more); the locked-out admin is still locked out and
        # the auth email path is likely broken. High, content-free.
        expr: |
          sum(increase(platform_mfa_recovery_total{outcome="expired"}[1h])) > 0
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "An MFA recovery request expired: its notice was never sent"
          description: >
            An MFA recovery request expired because the account's notice could
            not be emailed in time. Check AuthEmailPermanentlyFailed and SMTP,
            then ask for the recovery again (MFA_RECOVERY_EXPIRED in the
            platform-operator tenant names the tenant and user).

      - alert: PlatformMfaRecoveryJobFailing
        # Backlog #0-90 (performance review): the scheduler could not execute or
        # expire a request. It stays PENDING and is retried every run, oldest
        # first, so a request that keeps failing would hold back the others.
        expr: |
          sum(increase(platform_mfa_recovery_failures_total[30m])) > 0
        for: 15m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "MFA recovery requests keep failing in the scheduler"
          description: >
            auth-service's MfaRecoveryScheduler failed on MFA recovery requests
            for the last 15 minutes. Its ERROR log "MFA recovery: could not"
            names the request and the cause.

      - alert: HighHttpErrorRate
        # Fire when > 1% of requests to any service return 5xx
        expr: |
          rate(http_server_requests_seconds_count{status=~"5.."}[5m])
          /
          rate(http_server_requests_seconds_count[5m]) > 0.01
        for: 5m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "High HTTP error rate on {{ $labels.service }}"
          description: >
            Service {{ $labels.service }} has more than 1% of requests
            returning 5xx errors. Current rate: {{ $value | printf "%.2f" }}.

  # ────────────────────────────────────────────────────────────────
  # JVM alerts — all services
  # ────────────────────────────────────────────────────────────────
  - name: jvm
    rules:

      - alert: JvmMemoryHigh
        # Fire when JVM heap usage > 85%
        expr: |
          jvm_memory_used_bytes{area="heap"}
          /
          jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "JVM heap memory high on {{ $labels.service }}"
          description: >
            JVM heap usage on {{ $labels.service }} is above 85%.
            Current: {{ $value | printf "%.1f" }}%. Risk of OOMKilled.

      - alert: JvmGcPauseHigh
        # Fire when GC pause time > 200ms on average
        expr: |
          rate(jvm_gc_pause_seconds_sum[5m])
          /
          rate(jvm_gc_pause_seconds_count[5m]) > 0.2
        for: 5m
        labels:
          severity: medium
          scope: platform
        annotations:
          summary: "High GC pause time on {{ $labels.service }}"
          description: >
            Average GC pause on {{ $labels.service }} is above 200ms.
            Current: {{ $value | printf "%.0f" }}ms. May indicate memory pressure.


  # ────────────────────────────────────────────────────────────────
  # Kafka alerts -- consumer group lag
  #
  # Metrics sourced from kafka-exporter (danielqsj/kafka-exporter).
  # Requires kafka-exporter container running and scraped by Prometheus
  # -- see docker-compose.yml and prometheus.yml for configuration.
  #
  # Consumer lag = difference between the latest offset on the broker
  # and the last committed offset by the consumer group.
  # High lag means consumers are falling behind producers -- events
  # are queuing in Kafka without being processed.
  # ────────────────────────────────────────────────────────────────
  - name: kafka
    rules:

      - alert: KafkaConsumerLagHigh
        # Fire when any consumer group has total lag > 1000 messages
        # for 5 minutes -- sustained lag, not a transient spike.
        #
        # Threshold rationale:
        #   Normal operation : lag < 50   (consumers keep up with producers)
        #   Acceptable burst : lag < 500  (brief spike during high load)
        #   Alert threshold  : lag > 1000 for 5m = consumers cannot keep up
        #
        # Monitored consumer groups:
        #   incident-service     -- alerts.raw, alerts.resolved
        #   notification-service -- incidents.lifecycle
        #   escalation-service   -- incidents.lifecycle
        #   postmortem-service   -- incidents.lifecycle
        #   incident-service     -- incidents.lifecycle (escalation events)
        expr: |
          sum by (consumergroup, topic) (
            kafka_consumer_group_lag
          ) > 1000
        for: 5m
        labels:
          severity: high
          scope: platform
        annotations:
          summary: "High Kafka consumer lag: {{ $labels.consumergroup }} on {{ $labels.topic }}"
          description: >
            Consumer group {{ $labels.consumergroup }} has accumulated
            more than 1000 unprocessed messages on topic {{ $labels.topic }}.
            The consuming service is falling behind.
            Current lag: {{ $value | printf "%.0f" }} messages.
            Check service logs for processing errors or resource exhaustion.

      - alert: KafkaConsumerLagCritical
        # Fire when lag exceeds 10000 messages for 2 minutes.
        # At this level incident creation, notifications and escalations
        # may be significantly delayed.
        expr: |
          sum by (consumergroup, topic) (
            kafka_consumer_group_lag
          ) > 10000
        for: 2m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "Critical Kafka consumer lag: {{ $labels.consumergroup }} on {{ $labels.topic }}"
          description: >
            Consumer group {{ $labels.consumergroup }} has over 10000 unprocessed
            messages on topic {{ $labels.topic }}.
            Incident processing, notifications and escalations are severely delayed.
            Current lag: {{ $value | printf "%.0f" }} messages.
            Immediate investigation required.