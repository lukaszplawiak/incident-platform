spring:
  application:
    name: escalation-service
  # Virtual threads (Project Loom, stable since Java 21) — this service is
  # I/O-bound (JPA/JDBC, Kafka, synchronous HTTP to oncall-service via
  # OncallServiceClient), so it benefits the same way incident-service does.
  # See incident-service's application.yml for the fuller caveat note
  # (synchronized-block pinning risk — checked, none present here either).
  threads:
    virtual:
      enabled: true
  # Backlog #0-84: with virtual threads Spring Boot schedules on a
  # SimpleAsyncTaskScheduler, one virtual thread per run, so the audit outbox
  # relay holds no other @Scheduled job (spring.task.scheduling.pool.size has
  # no effect here and is not set).

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:incidentdb}
    username: ${DB_USER:incident_app}
    # No default (backlog #0-66), so a missing DB_PASSWORD never connects
    # with the dev password. Spring Boot leaves an unresolved placeholder in
    # place here, so the symptom is "password authentication failed for user
    # incident_app", not a placeholder error; compose and Kubernetes stop
    # earlier with their own message. Set in docker/.env (compose),
    # app-secrets (k8s) or application-local.yml (spring-boot:run):
    # docs/database-roles.md.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
      pool-name: escalation-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_escalation

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: escalation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaConsumerInterceptor
        # Backlog #0-96: a poison pill now waits up to 5 s for its dead-letter
        # copy before it is acknowledged, so a poll of max.poll.records of them
        # must fit with room to spare; 30 s did not (10 x 5 s). The consumer's
        # KafkaConfig refuses to start when max.poll.records x 5 s exceeds half
        # of this. A nack's delay pauses the partition, not the poll loop.
        max.poll.interval.ms: 120000
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaProducerInterceptor
        # Backlog #0-84: max.block.ms is deliberately left at Kafka's default
        # (60 s) here, unlike the other services with an audit outbox. The
        # escalation event (EscalationScheduler) is sent once and not retried
        # when send() throws, so a shorter block would turn a brief Kafka
        # outage into a lost escalation notification. The audit outbox relay
        # runs on its own virtual thread (see spring.threads above) and its
        # lock outlasts one 60 s block, so the longer wait costs it nothing:
        # a run stops at the first send Kafka fails, so it blocks at most once
        # (about 60 s, plus audit.outbox.send-timeout, 5 s), inside the relay's
        # lock of send-timeout x max-batches-per-run + 30 s (80 s by default).
        # Setting max.block.ms here, or lowering send-timeout or
        # max-batches-per-run, must keep that lock longer than one block plus
        # one send-timeout (found in review), or a second replica could start
        # the same rows; harmless (the consumer deduplicates), but wasted work.
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  # Access token TTL — how long a user JWT is valid after login.
  # Short TTL (PT15M) limits exposure of stolen tokens; session continuity
  # is handled by the refresh token flow (POST /api/v1/auth/refresh).
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  # Service token TTL — for inter-service calls via ServiceTokenProvider.
  # Longer than access-token-ttl; rotated automatically before expiry.
  service-token-ttl: ${JWT_SERVICE_TOKEN_TTL:PT1H}
  # Refresh token TTL — how long a refresh token is valid.
  # Refresh tokens are rotated on every use — stolen tokens are
  # detected when the legitimate user next calls /auth/refresh.
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

# Backlog #0-84: audit events go to this service's outbox table (migration),
# written with the action they record, and the shared relay sends them to
# Kafka. Without this property the service has no AuditEventPublisher and
# does not start.
audit:
  outbox:
    table: escalation_audit_outbox
    poll-interval-ms: ${AUDIT_OUTBOX_POLL_INTERVAL_MS:2000}

# Backlog #0-82, step 2b: a suspended tenant's escalations are held back, its
# timers stopped for the length of the suspension. This table (migration V9)
# lists the paused tenants; PausedTenantsSync (shared) keeps it in step with
# auth-service every sync-interval-ms, EscalationScheduler's query leaves them
# out. Without the property the service does not start (its scheduler needs
# TenantWorkGuard, which comes with it).
tenant-pause:
  table: escalation_paused_tenants
  sync-interval-ms: ${TENANT_PAUSE_SYNC_INTERVAL_MS:10000}

kafka:
  topics:
    incidents-lifecycle: incidents.lifecycle
    audit-events: audit.events
    escalation-dead-letter: escalation.dead-letter
  dead-letter:
    # How long DLT messages are retained before Kafka deletes them.
    # Gives operators time to inspect, replay or discard poison pills.
    # Override per environment: dev=1, staging=7, prod=30.
    retention-days: ${DEAD_LETTER_RETENTION_DAYS:30}

escalation:
  threshold-minutes: ${ESCALATION_THRESHOLD_MINUTES:15}
  scheduler-interval-ms: ${ESCALATION_SCHEDULER_INTERVAL_MS:60000}
  # Fixed (backlog #39): caps how many due tasks one poll cycle processes.
  # See EscalationScheduler's own Javadoc for the full account — without
  # this, a large backlog (scheduler outage, burst of simultaneous
  # incidents) had no ceiling on how long a single cycle's sequence of
  # synchronous oncall-service HTTP calls could take.
  scheduler-batch-size: ${ESCALATION_SCHEDULER_BATCH_SIZE:100}
  # Backlog #0-82, step 2b: how long one escalation run may take before it
  # leaves the rest for the next; at most the run's 5 min ShedLock less 30 s
  # (checked at startup), so another replica never starts on the same tasks.
  scheduler-processing-budget: ${ESCALATION_SCHEDULER_PROCESSING_BUDGET:PT4M}

# Backlog #0-82, step 2: TenantStatusFilter asks auth-service what a tenant may
# do (AuthServiceTenantStatusProvider in shared; tenant-status.cache.ttl 10 s,
# the last known status while auth-service is down, FULL for a tenant never
# answered for). Without this URL every tenant would have full access here
# (checked in CI: .github/scripts/check-tenant-status-config.sh).
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8087}

server:
  port: ${SERVER_PORT:8084}
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_PORT:8094}

logging:
  level:
    root: INFO
    com.incidentplatform: DEBUG
    org.springframework.security: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{tenantId:-no-tenant}] [%X{requestId:-no-req}] [%X{userId:-no-user}] %-5level %logger{36} - %msg%n"

security:
  cors:
    # Allowed origins for CORS. Comma-separated list.
    # Override per environment: dev=localhost, prod=https://app.incidentplatform.com
    # This property has no inline default — it must be set here or via env var.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# oncall-service HTTP client
oncall:
  service:
    url: ${ONCALL_SERVICE_URL:http://oncall-service:8086}
    # Fixed (backlog #0-11): this client had no timeouts. Before the service
    # token fix every call was a fast 401; now they are real calls, and a hung
    # oncall-service would block the scheduler thread (the circuit breaker only
    # counts calls that finish). See OncallClientConfig.
    connect-timeout: ${ONCALL_CONNECT_TIMEOUT:2s}
    read-timeout: ${ONCALL_READ_TIMEOUT:5s}

# Resilience4j circuit breaker for oncall-service HTTP calls
resilience4j:
  circuitbreaker:
    instances:
      oncall-service:
        # Open circuit after 50% failures in last 10 calls
        failureRateThreshold: 50
        minimumNumberOfCalls: 10
        # Stay open for 30s before trying again (half-open)
        waitDurationInOpenState: 30s
        # Allow 3 test calls in half-open state
        permittedNumberOfCallsInHalfOpenState: 3
        # Count both exceptions and slow calls as failures
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # This comment used to promise slow calls count as failures, but no
        # threshold was set (the default is 60s, longer than the read timeout).
        # Above 3s a call is slow; at 50% slow calls the circuit opens.
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 50
        # A malformed tenant id is a defect in the caller/payload, not an
        # oncall-service outage: it must not count toward opening the circuit.
        ignoreExceptions:
          - java.lang.IllegalArgumentException