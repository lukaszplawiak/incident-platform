spring:
  application:
    name: notification-service
  # Virtual threads (Project Loom, stable since Java 21) — this service is
  # heavily I/O-bound (JPA/JDBC for the outbox, Kafka, synchronous HTTP to
  # oncall-service/incident-service/Slack/Gmail), same rationale as
  # incident-service and escalation-service. Verified no `synchronized`
  # blocks anywhere in this module before enabling (the known
  # virtual-thread pinning risk).
  threads:
    virtual:
      enabled: true
  # Backlog #0-84: with virtual threads Spring Boot schedules on a
  # SimpleAsyncTaskScheduler, one virtual thread per run, so the audit outbox
  # relay holds no other @Scheduled job (spring.task.scheduling.pool.size has
  # no effect here and is not set).

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:incidentdb}
    username: ${DB_USER:incident_app}
    # No default (backlog #0-66), so a missing DB_PASSWORD never connects
    # with the dev password. Spring Boot leaves an unresolved placeholder in
    # place here, so the symptom is "password authentication failed for user
    # incident_app", not a placeholder error; compose and Kubernetes stop
    # earlier with their own message. Set in docker/.env (compose),
    # app-secrets (k8s) or application-local.yml (spring-boot:run):
    # docs/database-roles.md.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
      pool-name: notification-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_notification


  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Backlog #0-18: JavaMail's defaults are infinite. The notification scheduler now also
          # sends the operator alert from its own loop, so a hung mail relay would stall every
          # notification, not just that email.
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
          # Note: unconditionally true, correct for the real default host
          # (Mailtrap). The dev mail catchers (Mailpit in docker-compose,
          # backlog #0-16, and in the Kubernetes dev overlay, #0-42) offer
          # no auth, so those environments turn it off with
          # SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH / ..._STARTTLS_ENABLE=false;
          # a real relay keeps both. Before that override, the mismatch broke
          # the /actuator/health check, hence management.health.mail.enabled:
          # false below.
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaConsumerInterceptor
        max.poll.interval.ms: 300000
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
        max.poll.records: 10
    producer:
      properties:
        # Backlog #0-84: how long KafkaProducer.send() itself may block while
        # Kafka's metadata is missing (Kafka down or unreachable), before it
        # fails. The default, 60 s, would hold the audit outbox relay that long
        # per run; the relay waits for acknowledgements within
        # audit.outbox.send-timeout (5 s) anyway. Every send of this service's
        # producer fails as fast (the dead-letter publisher too).
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        # Backlog #0-91: checks that every record carries a valid tenant header
        # (built by TenantRecords); it writes nothing.
        interceptor.classes: com.incidentplatform.shared.kafka.TenantKafkaProducerInterceptor
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  # Access token TTL — how long a user JWT is valid after login.
  # Short TTL (PT15M) limits exposure of stolen tokens; session continuity
  # is handled by the refresh token flow (POST /api/v1/auth/refresh).
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  # Service token TTL — for inter-service calls via ServiceTokenProvider.
  # Longer than access-token-ttl; rotated automatically before expiry.
  service-token-ttl: ${JWT_SERVICE_TOKEN_TTL:PT1H}
  # Refresh token TTL — how long a refresh token is valid.
  # Refresh tokens are rotated on every use — stolen tokens are
  # detected when the legitimate user next calls /auth/refresh.
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

# Backlog #0-84: audit events go to this service's outbox table (migration),
# written with the action they record, and the shared relay sends them to
# Kafka. Without this property the service has no AuditEventPublisher and
# does not start.
audit:
  outbox:
    table: notification_audit_outbox
    poll-interval-ms: ${AUDIT_OUTBOX_POLL_INTERVAL_MS:2000}

# Backlog #0-82, step 2b: a suspended tenant's notifications are held back and
# all sent on resumption. This table (migration V10) lists the paused tenants;
# PausedTenantsSync (shared) keeps it in step with auth-service every
# sync-interval-ms, NotificationScheduler's query leaves them out. Without the
# property the service does not start (its scheduler needs TenantWorkGuard,
# which comes with it).
tenant-pause:
  table: notification_paused_tenants
  sync-interval-ms: ${TENANT_PAUSE_SYNC_INTERVAL_MS:10000}

kafka:
  topics:
    incidents-lifecycle: incidents.lifecycle
    audit-events: audit.events
    notification-dead-letter: notification.dead-letter
  dead-letter:
    # How long DLT messages are retained before Kafka deletes them.
    # Gives operators time to inspect, replay or discard poison pills.
    # Override per environment: dev=1, staging=7, prod=30.
    retention-days: ${DEAD_LETTER_RETENTION_DAYS:30}

notification:
  channels:
    email:
      enabled: true
      from: alerts@incidentplatform.com
    slack:
      enabled: true
      # bot-token/channel/broadcast-enabled were here (backlog #0-18's
      # comment about the shared-channel broadcast lived on this block) —
      # removed by backlog #0-21: each tenant's own bot token, default
      # channel and broadcast flag now live in auth-service's
      # SlackWorkspace, read per notification via SlackWorkspaceClient.
      # signing-secret/api-base-url stay global: Slack's signing secret is
      # per-App, not per-workspace (verified against Slack's own docs).
      signing-secret: ${SLACK_SIGNING_SECRET}
      api-base-url: ${SLACK_API_BASE_URL:https://slack.com/api}
      # Backlog #0-103: timeouts of SlackApiClient's calls to the Slack Web API, each
      # attempt (resilience4j.retry.instances.slack retries a timeout). Apart from
      # notification.client.*, which are for calls inside the cluster.
      # Slack answers in well under a second; 5 s (not 10 s, review of #0-103) keeps the
      # worst case of a send small enough for notification.scheduler.processing-budget.
      connect-timeout: ${SLACK_CONNECT_TIMEOUT:3s}
      read-timeout: ${SLACK_READ_TIMEOUT:5s}
    sms:
      enabled: true
      from-number: ${SMS_FROM:+1234567890}
  # Backlog #0-18: replaces notification.fallback.*, which received the incident text of
  # any tenant whenever no on-call contact was found. This address belongs to the platform
  # OPERATOR and receives only content-free alerts (tenant id, incident id, event type,
  # reason) when a notification could not be delivered to anyone in the tenant.
  # No default: unset means no email is sent (the ERROR log and metric remain).
  operator-alert:
    email: ${NOTIFICATION_OPERATOR_ALERT_EMAIL:}
    # At most one email per tenant and reason within this interval (a tenant with nobody on call
    # would otherwise email the operator once per incident). Every alert is still logged and counted.
    min-interval: ${NOTIFICATION_OPERATOR_ALERT_MIN_INTERVAL:PT15M}
  client:
    # Timeout for inter-service HTTP calls.
    connect-timeout-seconds: ${NOTIFICATION_CLIENT_CONNECT_TIMEOUT:3}
    read-timeout-seconds: ${NOTIFICATION_CLIENT_READ_TIMEOUT:5}
  scheduler:
    # How long PENDING entries must exist before scheduler picks them up.
    pending-threshold: ${NOTIFICATION_SCHEDULER_PENDING_THRESHOLD:PT30S}
    # Backlog #0-19: how long an entry is retried (it stays PENDING) while oncall-service cannot
    # answer the lookup that decides who is notified. After it the entry is UNDELIVERABLE.
    # Measured from the first failed lookup of the entry, not from its creation.
    lookup-retry-window: ${NOTIFICATION_LOOKUP_RETRY_WINDOW:PT10M}
    # One run stops after this long and leaves the rest for the next cycle. Keep it below the
    # ShedLock lockAtMostFor (4m) of processPendingNotifications, or a second replica starts on
    # the same PENDING entries. The lock must also outlast the entry in flight: a 30 s margin
    # plus what the channels say a send can take, i.e. Slack's retries and timeouts (3 attempts
    # x (3 s + 5 s) + 1.5 s backoff, twice: about 51 s), checked at startup. Lowered from PT3M
    # in the review of backlog #0-103, which made Slack's retry run on the send path.
    processing-budget: ${NOTIFICATION_SCHEDULER_PROCESSING_BUDGET:PT2M30S}
    # At most this many PENDING entries are loaded per run, oldest first (backlog #0-10; same idea
    # as escalation-service's scheduler-batch-size).
    batch-size: ${NOTIFICATION_SCHEDULER_BATCH_SIZE:200}
    interval-ms: ${NOTIFICATION_SCHEDULER_INTERVAL_MS:30000}
    # How long a slack_message_ts row is kept before the cleanup job
    # deletes it — only matters for incidents acknowledged some other way
    # than the Slack button (e.g. the web UI), since the Slack-ACK path
    # deletes its own rows immediately.
    slack-message-ts-retention: ${NOTIFICATION_SLACK_TS_RETENTION:P7D}
    slack-ts-cleanup-interval-ms: ${NOTIFICATION_SLACK_TS_CLEANUP_INTERVAL_MS:3600000}

oncall-service:
  base-url: ${ONCALL_SERVICE_URL:http://localhost:8086}

incident-service:
  base-url: ${INCIDENT_SERVICE_URL:http://localhost:8082}

# Backlog #0-21/#0-30: SlackWorkspaceClient — the first call this service
# makes into auth-service, to read a tenant's Slack workspace connection.
# Since backlog #0-82 step 2 also where TenantStatusFilter asks a tenant's
# status (AuthServiceTenantStatusProvider in shared).
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8087}


server:
  port: ${SERVER_PORT:8083}
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Fixed: MailHealthIndicator (auto-enabled by Actuator whenever
    # JavaMailSender is on the classpath) was actively test-connecting to
    # the SMTP server as part of /actuator/health — which the Docker
    # Compose healthcheck for this service directly polls. Spring Boot
    # Actuator's default aggregation marks the WHOLE /actuator/health
    # response DOWN if any one contributing indicator is DOWN, so any
    # SMTP hiccup (or, in docker-compose specifically: mail.properties
    # .mail.smtp.auth=true below being unconditionally true even when
    # MAIL_HOST pointed at a dev catcher (then mailhog, now Mailpit) that
    # doesn't offer auth — surfaced as jakarta.mail.AuthenticationFailedException,
    # "no password specified") flipped this service's reported health to
    # DOWN and its container to "unhealthy", even though Kafka consumption,
    # the database, and Slack notification routing were all working fine.
    # Email is one of three notification channels this service supports
    # (see notification.channels below) — connectivity to it shouldn't
    # gate whether the whole service is considered healthy, in CI or in
    # production; a transient SMTP outage shouldn't look like an outage
    # of notification-service itself, and restarting the pod wouldn't fix
    # an unreachable mail relay anyway.
    mail:
      enabled: false
  server:
    port: ${MANAGEMENT_PORT:8093}

resilience4j:
  circuit-breaker:
    instances:
      oncall:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      # Circuit breaker for PATCH /incidents/{id}/status calls.
      # Protects the slackTaskExecutor thread pool (maxPoolSize=5) from
      # exhaustion when incident-service is unresponsive.
      # open-state 30s: same as oncall — within-cluster services recover quickly.
      incident-ack:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      # SlackWorkspaceClient (backlog #0-21/#0-30) — same shape as oncall/incident-ack.
      # The 404-is-not-found case is caught inline in the client before it ever
      # reaches this breaker, so only a real failure (unreachable, 5xx, rejected
      # token) counts against it.
      slack-workspace:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      # SlackApiClient's chat.postMessage and chat.update (backlog #0-104). Same idea as
      # the breakers above, but without a fallback of its own: Resilience4j wraps the
      # retry around the breaker, so each attempt passes it, and an open breaker's
      # CallNotPermittedException goes, unretried, to the retry's fallback (SLACK_UNAVAILABLE,
      # circuit_open). A fallback here would hide the failure from the retry (the question of
      # backlog #0-23). Only network errors and 5xx count. Ignored, so they never open it: a
      # tenant's revoked token, a channel the bot is not in, a rate limit (4xx, 429, ok:false)
      # - Slack answering, and no one tenant may open it for the others - and also Slack's
      # own ok:false outage codes (internal_error, service_unavailable) and a 200 that cannot
      # be read: each of those answers at once, so it does not hold the scheduler, and
      # NotificationException does not tell them from a tenant's own. While it is open, Slack
      # messages fail at once and are not sent later (backlog #0-32), accepted: they were lost
      # after the retries anyway, and every other channel no longer waits about 51 s per entry.
      slack:
        # Second review: a channel's outage must not mark the service DOWN (the reason
        # management.health.mail is disabled above); its state stays in the metrics
        # (resilience4j_circuitbreaker_state, alert SlackCircuitOpen).
        register-health-indicator: false
        # Time-based (review): a count window would join two failed messages hours apart.
        # Each attempt is a call, so 5 means at least two messages whose attempts failed.
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.incidentplatform.notification.channel.NotificationException

  retry:
    instances:
      # SlackApiClient's chat.postMessage and chat.update. Backlog #0-103: until then the
      # send path called postIncidentMessage on the channel itself, past Spring's proxy, so
      # this retry applied only to the ACK update. A retried post may show twice (Slack has
      # no idempotency key), accepted: a duplicate beats a lost incident message.
      slack:
        max-attempts: ${SLACK_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${SLACK_RETRY_WAIT_MS:500ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      # Retry for oncall-service calls (getCurrentOncall, findBySlackUserId,
      # findCurrentByUserId).
      # 2 attempts with 200ms fixed wait — oncall-service is within the cluster,
      # transient failures are typically short-lived.
      # NOTE (backlog #0-23): this retry is probably inactive for these methods. Each has a
      # circuit-breaker fallback that turns every failure into OncallLookupUnavailableException
      # (or, for findBySlackUserId, an empty result), and neither is listed in retry-exceptions
      # below, so the retry never sees the original ResourceAccessException /
      # HttpServerErrorException. The real retry of the recipient lookup is the scheduler's:
      # the entry stays PENDING (notification.scheduler.lookup-retry-window). Whether to keep
      # this retry, and how Resilience4j orders it around the breaker in this configuration,
      # has not been verified.
      oncall:
        max-attempts: ${ONCALL_RETRY_MAX_ATTEMPTS:2}
        wait-duration: ${ONCALL_RETRY_WAIT_MS:200ms}
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

      # Retry for SlackWorkspaceClient (backlog #0-21/#0-30). Same shape as
      # oncall above, including its open question (backlog #0-23): this
      # client's @CircuitBreaker fallback also returns normally rather than
      # rethrowing, so whether @Retry actually gets a chance to see the
      # original exception before the fallback answers is the same
      # unverified Resilience4j-ordering question already tracked there —
      # not re-litigated here.
      slack-workspace:
        max-attempts: ${SLACK_WORKSPACE_RETRY_MAX_ATTEMPTS:2}
        wait-duration: ${SLACK_WORKSPACE_RETRY_WAIT_MS:200ms}
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

logging:
  level:
    root: INFO
    com.incidentplatform: DEBUG
    org.springframework.security: WARN
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
  # Backlog #0-94: one JSON (ECS) object per line, set for every service by shared's
  # StructuredLoggingDefaults; the plain-text pattern that was here is its local fallback.

security:
  cors:
    # Allowed origins for CORS. Comma-separated list.
    # Override per environment: dev=localhost, prod=https://app.incidentplatform.com
    # This property has no inline default — it must be set here or via env var.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}