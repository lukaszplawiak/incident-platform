apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/part-of: incident-platform
data:
  # Database
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "incidentdb"
  DB_USER: "incident_app"
  DB_POOL_SIZE: "5"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Redis
  # (used by auth-service — token revocation checks, login rate limiting)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Service URLs (internal Kubernetes DNS)
  INCIDENT_SERVICE_URL: "http://incident-service:8082"
  ONCALL_SERVICE_URL: "http://oncall-service:8086"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8083"
  # Backlog #0-21/#0-30: notification-service's SlackWorkspaceClient reads a
  # tenant's Slack workspace connection from auth-service's internal endpoint.
  AUTH_SERVICE_URL: "http://auth-service:8087"

  # Auth service — non-secret configuration. JWT_SECRET and
  # MFA_ENCRYPTION_KEY are secrets and live in app-secrets, not here.
  JWT_ACCESS_TOKEN_TTL: "PT15M"
  JWT_REFRESH_TOKEN_TTL: "P30D"
  JWT_SERVICE_TOKEN_TTL: "PT1H"
  MFA_TOTP_ISSUER: "IncidentPlatform"
  APP_BASE_URL: "https://incident-platform.local"
  CORS_ALLOWED_ORIGINS: "https://incident-platform.local"
  INVITE_EMAIL_FROM: "noreply@incident-platform.local"
  # notification-service: where the platform OPERATOR is emailed (content-free alert) when a
  # notification could not be delivered to anyone in its tenant. Empty means no email is sent
  # (the ERROR log and the notification.undeliverable metric remain), so set it per environment
  # in the overlay (backlog #0-18).
  NOTIFICATION_OPERATOR_ALERT_EMAIL: ""
  # Placeholder: no environment has a mail relay yet. Replace MAIL_HOST (and set MAIL_USERNAME /
  # MAIL_PASSWORD in the overlay's Secret) before a real deployment; until then mail to it fails
  # and is retried (auth-service outbox, ADR-0015). 587 is SMTP submission with STARTTLS and auth,
  # what both services expect. The dev overlay points it at its own Mailpit instead (backlog #0-42,
  # ADR-0026); this used to be "mailhog", which nothing deployed.
  MAIL_HOST: "smtp.incident-platform.local"
  MAIL_PORT: "587"

  # WebSocket
  WEBSOCKET_ALLOWED_ORIGINS: "http://localhost:4200,http://incident-platform-frontend"

  # No SPRING_PROFILES_ACTIVE here (backlog #0-63). It used to be "dev" in
  # this base, so every overlay, prod and staging included, started with the
  # dev profile: incident-service then enabled DevSecurityConfig and
  # DevTokenController, whose unauthenticated GET /dev/token mints an ADMIN
  # JWT for any tenant that all seven services accept (one HS512 secret).
  # Not reachable through the Ingress, but from any pod (no NetworkPolicy).
  # DevTokenController's own startup guard cannot catch it: it only refuses
  # to start when the dev profile is NOT active. The dev overlay adds the
  # profile; CI fails if the rendered staging or prod overlay sets any
  # profile at all.