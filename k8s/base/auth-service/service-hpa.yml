apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/part-of: incident-platform
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
    - name: management
      port: 8097
      targetPort: 8097
---
# HorizontalPodAutoscaler — automatically scales replicas based on CPU/memory.
# When CPU > 70% → add replica (up to maxReplicas).
# When CPU < 70% → remove replica (down to minReplicas).
#
# Correction: an earlier version of this file capped maxReplicas at 1,
# on the assumption that AuthEmailScheduler's two @Scheduled jobs had no
# distributed-lock protection. That assumption was wrong — verified
# directly against the code: AuthEmailScheduler.processPending()/
# retryFailed() both carry @SchedulerLock, SchedulerConfig.java registers
# both @EnableSchedulerLock and a JdbcTemplateLockProvider bean, and the
# shedlock table is created in V5__create_invite_email_outbox.sql. Same
# pattern as escalation/notification/postmortem-service. Scaling beyond
# 1 replica is safe; matched to incident-service's maxReplicas: 3 as
# auth-service is the authentication gateway for the whole platform and
# a comparably central, likely hot-path service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  labels:
    app.kubernetes.io/part-of: incident-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80