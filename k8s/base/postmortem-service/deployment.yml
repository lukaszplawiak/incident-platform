apiVersion: apps/v1
kind: Deployment
metadata:
  name: postmortem-service
  labels:
    app: postmortem-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: incident-platform
spec:
  # No spec.replicas (backlog #0-137): the HorizontalPodAutoscaler in service-hpa.yml owns the count, and
  # each overlay sets its floor and ceiling there. A replicas field here would be reapplied by every
  # `kubectl apply`, resetting what the HPA scaled to (Kubernetes docs: "Migrating Deployments and
  # StatefulSets to horizontal autoscaling").
  selector:
    matchLabels:
      app: postmortem-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: postmortem-service
    spec:
      # Spread over nodes (backlog #0-138, ADR-0029): the scheduler places this service's pods on
      # different nodes where it can, so one node's failure takes at most part of the HPA's floor.
      # ScheduleAnyway, not DoNotSchedule: a cluster with fewer nodes than pods (minikube, one node)
      # still schedules them all. matchLabelKeys pod-template-hash counts the skew per ReplicaSet, so
      # the old pods of a rolling update do not skew where the new ones go. Zones
      # (topology.kubernetes.io/zone) wait for a cluster whose zones are known (backlog #0-140). The
      # spread is applied when a pod is scheduled only: an HPA scale-down or a drain does not restore it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: postmortem-service
          matchLabelKeys:
            - pod-template-hash
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgresql 5432; do echo 'Waiting for PostgreSQL...'; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo 'Waiting for Kafka...'; sleep 2; done"]
      containers:
        - name: postmortem-service
          image: postmortem-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
            - containerPort: 8095
              name: management
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            # Backlog #0-78: password of the services' DB role (incident_app),
            # from the same Secret key the postgres StatefulSet creates it with.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GEMINI_API_KEY
            - name: SERVER_PORT
              value: "8085"
            - name: MANAGEMENT_PORT
              value: "8095"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8095
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8095
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3