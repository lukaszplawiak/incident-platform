apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Backlog #0-29: from the first commit of these manifests until this fix, this file held the staging
# overlay's body and k8s/overlays/staging/ held this one (namespace, image tags, replicas, HPA), while
# each directory's secrets.yml was already its own. check-k8s-environments.rb (CI) now fails when an
# overlay renders into another environment's namespace, or when prod's images carry an environment
# name or `latest` instead of a release tag.
namespace: incident-platform-prod

resources:
  # Extend base configuration
  - ../../base
  # Prod-specific secrets
  - secrets.yml

patches:
  - target:
      kind: Deployment
      name: incident-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
  # Replica counts (backlog #0-137): the HPAs own them, so prod sets each service's floor and ceiling
  # here, never spec.replicas (check-k8s-environments.rb fails on that, and on a prod floor below 2).
  # Until #0-137 these were spec.replicas patches, which the HPAs (minReplicas 1) scaled down to 1
  # and every `kubectl apply` reset; auth-service had no patch at all and ran a single replica.
  # The floor is for availability (one pod can fail or be moved), the ceiling bounds the
  # connections to Postgres (docs/database-roles.md, backlog #0-79).
  - target:
      kind: HorizontalPodAutoscaler
      name: incident-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 5
  # ingestion-service has no database, so its ceiling costs no Postgres connections.
  - target:
      kind: HorizontalPodAutoscaler
      name: ingestion-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 5
  # Every service asks auth-service for its tenant's status (backlog #0-82): never a single replica.
  - target:
      kind: HorizontalPodAutoscaler
      name: auth-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # 2 to 2 on purpose (ADR-0028): a second pod is for availability, not throughput. For notification,
  # escalation and postmortem one pod already consumes all three partitions of incidents.lifecycle
  # (listener concurrency 3), their @Scheduled jobs run on one pod at a time under ShedLock, and Slack,
  # mail, SMS and Gemini set their pace rather than CPU. oncall-service serves HTTP only, to escalation
  # and notification, so its load follows theirs. A third pod would only cost 5 more Postgres
  # connections; scaling the consumers is more partitions, not pods.
  - target:
      kind: HorizontalPodAutoscaler
      name: (notification|escalation|postmortem|oncall)-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 2
  # backlog #0-26: base ships NOTIFICATION_OPERATOR_ALERT_EMAIL empty, so no overlay emailed the
  # operator about an undeliverable notification. Placeholder address, in the same .local
  # convention as APP_BASE_URL/INVITE_EMAIL_FROM in the base ConfigMap (no real domain exists
  # anywhere in this repo yet) — replace before a real deployment.
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/NOTIFICATION_OPERATOR_ALERT_EMAIL
        value: "ops@incident-platform.local"

images:
  - name: auth-service
    newTag: "1.0.0"
  - name: incident-service
    newTag: "1.0.0"
  - name: ingestion-service
    newTag: "1.0.0"
  - name: notification-service
    newTag: "1.0.0"
  - name: escalation-service
    newTag: "1.0.0"
  - name: postmortem-service
    newTag: "1.0.0"
  - name: oncall-service
    newTag: "1.0.0"