apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incident-platform-staging

resources:
  # Extend base configuration
  - ../../base
  # Staging-specific secrets
  - secrets.yml

patches:
  - target:
      kind: Deployment
      name: incident-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: ingestion-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # backlog #0-26: base ships NOTIFICATION_OPERATOR_ALERT_EMAIL empty, so no overlay emailed the
  # operator about an undeliverable notification. Placeholder address, in the same .local
  # convention as APP_BASE_URL/INVITE_EMAIL_FROM in the base ConfigMap (no real domain exists
  # anywhere in this repo yet) — replace before a real deployment.
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/NOTIFICATION_OPERATOR_ALERT_EMAIL
        value: "ops@incident-platform.local"

images:
  - name: auth-service
    newTag: staging
  - name: incident-service
    newTag: staging
  - name: ingestion-service
    newTag: staging
  - name: notification-service
    newTag: staging
  - name: escalation-service
    newTag: staging
  - name: postmortem-service
    newTag: staging
  - name: oncall-service
    newTag: staging