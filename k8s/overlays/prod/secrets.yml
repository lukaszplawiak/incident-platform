apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: incident-platform-prod
type: Opaque
# IMPORTANT: NEVER commit real production secrets to git.
#
# Production secret management options (choose one):
# 1. External Secrets Operator + AWS Secrets Manager (recommended)
# 2. External Secrets Operator + HashiCorp Vault
# 3. Sealed Secrets (Bitnami) — encrypted secrets safe to commit
#
# For CI/CD pipeline (GitHub Actions example):
#   kubectl create secret generic app-secrets \
#     --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
#     --from-literal=MFA_ENCRYPTION_KEY=${{ secrets.MFA_ENCRYPTION_KEY }} \
#     --from-literal=SLACK_ENCRYPTION_KEY=${{ secrets.SLACK_ENCRYPTION_KEY }} \
#     --from-literal=SLACK_SIGNING_SECRET=${{ secrets.SLACK_SIGNING_SECRET }} \
#     --from-literal=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
#     --from-literal=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
#     --namespace=incident-platform-prod
#   kubectl create secret generic postgresql-admin \
#     --from-literal=username=postgres \
#     --from-literal=password=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
#     --namespace=incident-platform-prod
#
# Every key above is read by a secretKeyRef; a missing one stops the pods
# that need it with CreateContainerConfigError. DB_PASSWORD and the
# postgresql-admin Secret: backlog #0-78, docs/database-roles.md.
#
# These placeholders must be replaced before production deployment.
data:
  JWT_SECRET: REPLACE_WITH_REAL_BASE64_ENCODED_SECRET
  MFA_ENCRYPTION_KEY: REPLACE_WITH_REAL_BASE64_ENCODED_KEY
  # Backlog #0-21: separate key from MFA_ENCRYPTION_KEY.
  SLACK_ENCRYPTION_KEY: REPLACE_WITH_REAL_BASE64_ENCODED_KEY
  SLACK_SIGNING_SECRET: REPLACE_WITH_REAL_BASE64_ENCODED_SIGNING_SECRET
  GEMINI_API_KEY: REPLACE_WITH_REAL_BASE64_ENCODED_API_KEY
  # Backlog #0-78: password of incident_app, the role every service connects as.
  DB_PASSWORD: REPLACE_WITH_REAL_BASE64_ENCODED_PASSWORD
---
# Backlog #0-78: the postgres image's superuser, for administration only —
# no service connects with it. Used only when the database volume is first
# created (docs/database-roles.md).
# IMPORTANT: NEVER commit the real production password; see app-secrets above.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-admin
  namespace: incident-platform-prod
type: Opaque
data:
  username: cG9zdGdyZXM=
  password: REPLACE_WITH_REAL_BASE64_ENCODED_PASSWORD
