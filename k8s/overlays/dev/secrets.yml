apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: incident-platform-dev
type: Opaque
# Dev environment secrets — placeholders only.
# Replace with real values for staging/prod.
# To encode: echo -n 'your-value' | base64
data:
  JWT_SECRET: bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS1taW5pbXVtLTY0LWNoYXJhY3RlcnMtbG9uZy1ub3QtZm9yLXByb2R1Y3Rpb24tazhz
  # 32 random bytes, base64 — matches `openssl rand -base64 32` per the
  # comment in auth-service/src/main/resources/application.yml. Dev-only
  # value, regenerate for staging/prod, never reuse across environments.
  MFA_ENCRYPTION_KEY: RitIUzFyWFVQdGpRTy9QVnBhU2o5K29mY0psTXpSeGpYRmpxSzFyOVdzYz0=
  # Backlog #0-21: separate key from MFA_ENCRYPTION_KEY — encrypts each
  # tenant's Slack bot token (auth-service's SlackWorkspace), not MFA
  # secrets. Dev-only value, regenerate for staging/prod.
  SLACK_ENCRYPTION_KEY: SUxFVEF2UVBoYzl5RG83cm01ZnF0cHEzUkt4eU5RbVZ5RXI3bVc0OUEyaz0=
  SLACK_SIGNING_SECRET: cGxhY2Vob2xkZXItc2lnbmluZy1zZWNyZXQ=
  GEMINI_API_KEY: cGxhY2Vob2xkZXItZ2VtaW5pLWtleQ==
  # Backlog #0-78: password of incident_app, the role every service connects as
  # (not a superuser). Also used by postgresql-init.sh to create the role.
  # Dev-only value (incident_secret), the same as docker/.env.example.
  DB_PASSWORD: aW5jaWRlbnRfc2VjcmV0
---
# Backlog #0-78: the postgres image's superuser, for administration only —
# no service connects with it. Used only when the database volume is first
# created (docs/database-roles.md).
# Dev-only values: postgres / postgres_admin_dev, as in docker/.env.example.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-admin
  namespace: incident-platform-dev
type: Opaque
data:
  username: cG9zdGdyZXM=
  password: cG9zdGdyZXNfYWRtaW5fZGV2
