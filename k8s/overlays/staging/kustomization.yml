apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incident-platform-prod

resources:
  # Extend base configuration
  - ../../base
  # Prod-specific secrets
  - secrets.yml

patches:
  - target:
      kind: Deployment
      name: incident-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
  - target:
      kind: Deployment
      name: ingestion-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: escalation-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: postmortem-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: oncall-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: incident-service-hpa
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 5
  # backlog #0-26: base ships NOTIFICATION_OPERATOR_ALERT_EMAIL empty, so no overlay emailed the
  # operator about an undeliverable notification. Placeholder address, in the same .local
  # convention as APP_BASE_URL/INVITE_EMAIL_FROM in the base ConfigMap (no real domain exists
  # anywhere in this repo yet) — replace before a real deployment.
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/NOTIFICATION_OPERATOR_ALERT_EMAIL
        value: "ops@incident-platform.local"

images:
  - name: auth-service
    newTag: "1.0.0"
  - name: incident-service
    newTag: "1.0.0"
  - name: ingestion-service
    newTag: "1.0.0"
  - name: notification-service
    newTag: "1.0.0"
  - name: escalation-service
    newTag: "1.0.0"
  - name: postmortem-service
    newTag: "1.0.0"
  - name: oncall-service
    newTag: "1.0.0"