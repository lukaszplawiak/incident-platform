apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Backlog #0-29: from the first commit of these manifests until this fix, this file held the prod
# overlay's body and k8s/overlays/prod/ held this one (namespace, image tags, replicas, HPA), while
# each directory's secrets.yml was already its own. check-k8s-environments.rb (CI) now fails when an
# overlay renders into another environment's namespace.
namespace: incident-platform-staging

resources:
  # Extend base configuration
  - ../../base
  # Staging-specific secrets
  - secrets.yml

patches:
  # Replica counts (backlog #0-137): the HPAs own them, so staging raises the floor of the two services
  # on the alert path to 2 and keeps base's ceilings (3); the other five run base's HPAs (1 to 3 for
  # auth-service, 1 to 2 for the rest). Until #0-137 these were spec.replicas patches, which the HPAs
  # scaled down to 1 and every `kubectl apply` reset.
  - target:
      kind: HorizontalPodAutoscaler
      name: (incident|ingestion)-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
  # backlog #0-26: base ships NOTIFICATION_OPERATOR_ALERT_EMAIL empty, so no overlay emailed the
  # operator about an undeliverable notification. Placeholder address, in the same .local
  # convention as APP_BASE_URL/INVITE_EMAIL_FROM in the base ConfigMap (no real domain exists
  # anywhere in this repo yet) — replace before a real deployment.
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/NOTIFICATION_OPERATOR_ALERT_EMAIL
        value: "ops@incident-platform.local"

images:
  - name: auth-service
    newTag: staging
  - name: incident-service
    newTag: staging
  - name: ingestion-service
    newTag: staging
  - name: notification-service
    newTag: staging
  - name: escalation-service
    newTag: staging
  - name: postmortem-service
    newTag: staging
  - name: oncall-service
    newTag: staging